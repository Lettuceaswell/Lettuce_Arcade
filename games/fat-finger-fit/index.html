<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fat Finger Fit — Lettuce Arcade</title>
<meta name="theme-color" content="#083734">
<link rel="stylesheet" href="/shared/arcade.css">
<style>
  /* SKELETON. Layout and mechanics only — no polish, no blob, no count-up. */
  html, body { height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    padding: calc(8px + var(--safe-top)) 14px calc(10px + var(--safe-bottom));
    gap: 6px;
    -webkit-user-select: none; user-select: none;
  }

  /* header: day + running score */
  /* sits between the shared back button (ends ~127px) and menu button (starts ~323px) */
  #head { display: flex; justify-content: space-between; align-items: center; min-height: 48px; padding: 0 60px 0 120px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #day { font-size: 1rem; letter-spacing: 0.06em; color: var(--fg-dim); }
  #score { font-size: 1.3rem; }

  /* blob + gauges (~36%) */
  #body { flex: 36 1 0; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  #blob { width: 72px; height: 60px; border-radius: 50% 50% 45% 45%; background: var(--accent-dim); opacity: 0.7; transition: transform 400ms; }
  #gauges { display: flex; gap: 36px; }
  .gauge { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .ring { width: 78px; height: 78px; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; }
  .ring::after { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--bg); }
  .ring b { position: relative; z-index: 1; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .ring.grey { filter: saturate(0); }
  .glabel { font-size: 0.72rem; letter-spacing: 0.12em; color: var(--fg-dim); font-weight: 700; }

  /* energy bar (~16%) */
  #energy { flex: 16 1 0; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  #energy .glabel { text-align: left; }
  #bar { position: relative; height: 34px; background: rgba(0,0,0,0.35); border-radius: 6px; overflow: hidden; }
  #bar .seg { position: absolute; top: 0; bottom: 0; left: 0; width: 0; transition: opacity 120ms; }
  #bar .seg.pending { opacity: 0.45; }
  #bar .seg.T { background: repeating-linear-gradient(135deg, #3A3F4B 0 5px, #565b6a 5px 8px); }
  #bar .seg.warm { background: #f0b054; opacity: 0.35; } /* overshoot past the tick, warmer amber */
  /* Resolution: the bar snaps to truth with an overshoot-and-settle (~350ms). */
  #bar.snap .seg { transition: left 350ms cubic-bezier(0.2, 0.9, 0.3, 1.35), width 350ms cubic-bezier(0.2, 0.9, 0.3, 1.35), opacity 120ms; }
  #bar.snap #window { transition: left 350ms cubic-bezier(0.2, 0.9, 0.3, 1.35), width 350ms cubic-bezier(0.2, 0.9, 0.3, 1.35), opacity 200ms; }
  /* The estimate window: soft zone with bracket ends, only ever at the tip. */
  #window { position: absolute; top: 0; bottom: 0; background: rgba(210, 249, 247, 0.22); border-left: 2px solid var(--fg); border-right: 2px solid var(--fg); box-sizing: border-box; opacity: 0; }
  #window.on { opacity: 1; }
  /* Ghost of the previous lock's window width, so the widening is comparable (§18.1). */
  #ghost { position: absolute; top: 3px; bottom: 3px; border-left: 1px dashed rgba(210,249,247,0.45); border-right: 1px dashed rgba(210,249,247,0.45); box-sizing: border-box; opacity: 0; }
  #ghost.on { opacity: 1; }
  #tick { position: absolute; top: -2px; bottom: -2px; left: 50%; width: 3px; margin-left: -1.5px; background: var(--fg); }
  #tickmark { text-align: center; font-size: 0.7rem; line-height: 1; color: var(--fg-dim); }
  @media (prefers-reduced-motion: reduce) { #bar.snap .seg, #bar.snap #window { transition: none; } }

  /* sliders (~36%): only the live one is on screen. The strip above it
     shows which lock you're on and which are done. */
  #sliders { flex: 36 1 0; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
  #locks { display: flex; justify-content: center; gap: 22px; font-size: 1.5rem; line-height: 1; }
  #locks span { position: relative; opacity: 0.3; transition: opacity 150ms, transform 150ms; }
  #locks span.live { opacity: 1; transform: scale(1.25); }
  #locks span.locked { opacity: 0.55; }
  #locks span.locked::after { content: "✓"; position: absolute; right: -10px; bottom: -6px; font-size: 0.7rem; font-weight: 900; color: var(--accent); }
  .row { display: none; align-items: center; gap: 14px; min-height: 60px; }
  .row.live { display: flex; }
  .row label { font-size: 2.2rem; line-height: 1; width: 48px; text-align: center; }
  .row input[type=range] { flex: 1; height: 60px; margin: 0; -webkit-appearance: none; appearance: none; background: transparent; }
  .row input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: rgba(210,249,247,0.25); }
  .row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 44px; height: 44px; margin-top: -18px; border-radius: 50%; background: var(--accent); border: 3px solid var(--bg); box-shadow: 0 0 0 2px var(--fg); }
  .row input[type=range]::-moz-range-track { height: 8px; border-radius: 4px; background: rgba(210,249,247,0.25); }
  .row input[type=range]::-moz-range-thumb { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); border: 3px solid var(--bg); }

  /* commit (~12%) */
  #foot { flex: 12 1 0; min-height: 56px; display: flex; align-items: center; }
  #commit { width: 100%; min-height: 56px; font-size: 1.1rem; font-weight: 900; letter-spacing: 0.25em; }

  /* end card — bones only */
  #overlay { position: fixed; inset: 0; z-index: 9000; display: none; align-items: center; justify-content: center; background: rgba(3, 26, 24, 0.9); padding: 12px; }
  #overlay.show { display: flex; }
  .card { width: 100%; max-width: 320px; background: #052926; border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
  .card .final { font-size: 3rem; font-weight: 900; line-height: 1; }
  .card .line { color: var(--fg-dim); font-size: 0.95rem; font-variant-numeric: tabular-nums; }
  .card .line b { color: var(--fg); }
  .spark { display: flex; align-items: flex-end; gap: 4px; height: 48px; padding: 0 8px; }
  .spark span { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px; }
</style>
</head>
<body>
<div id="head"><span id="day">DAY 1 / 8</span><span id="score">0</span></div>

<div id="body">
  <div id="blob"></div>
  <div id="gauges">
    <div class="gauge"><div class="ring" id="ring-lbs"><b id="lbs">100%</b></div><div class="glabel">MASS</div></div>
    <div class="gauge"><div class="ring" id="ring-muscle"><b id="muscle">0%</b></div><div class="glabel">MUSCLE</div></div>
  </div>
</div>

<div id="energy">
  <div class="glabel">ENERGY</div>
  <div id="bar">
    <div class="seg P"></div><div class="seg C"></div><div class="seg F"></div><div class="seg warm"></div><div class="seg T"></div>
    <div id="ghost"></div><div id="window"></div><div id="tick"></div>
  </div>
  <div id="tickmark">▲</div>
</div>

<div id="sliders">
  <div id="locks" aria-hidden="true"><span data-key="P">🥩</span><span data-key="C">🍞</span><span data-key="F">🧈</span><span data-key="T">🏋️</span></div>
  <div class="row" data-key="P"><label aria-label="Protein">🥩</label><input type="range" min="0" max="100" step="0.01" value="50"></div>
  <div class="row" data-key="C"><label aria-label="Carbs">🍞</label><input type="range" min="0" max="100" step="0.01" value="50"></div>
  <div class="row" data-key="F"><label aria-label="Fat">🧈</label><input type="range" min="0" max="100" step="0.01" value="50"></div>
  <div class="row" data-key="T"><label aria-label="Training">🏋️</label><input type="range" min="0" max="100" step="0.01" value="50"></div>
</div>

<div id="foot"><button id="commit" class="btn">COMMIT</button></div>

<div id="overlay" role="dialog" aria-label="Run over">
  <div class="card">
    <div class="line">💪 Fat Finger Fit · day 8</div>
    <div class="line"><b id="c-lbs"></b> MASS · <b id="c-muscle"></b> MUSCLE</div>
    <div class="line" id="c-cascade"></div>
    <div class="final" id="c-final"></div>
    <div class="spark" id="spark" aria-hidden="true"></div>
    <div class="line" id="c-best"></div>
    <button id="again" class="btn">RUN IT BACK</button>
  </div>
</div>

<script src="/shared/arcade.js"></script>
<script src="model.js"></script>
<script>
  Arcade.backButton();
  Arcade.menuButton({
    rules: [
      "Eight days. Four sliders a day: 🥩 protein, 🍞 carbs, 🧈 fat, 🏋️ training. You lock them one at a time, in that order, and you can't go back.",
      "Eating fills the bar. Training empties it.",
      "The tick in the middle is maintenance. Land right of it and you gain weight, left of it and you lose it.",
      "Muscle needs training, protein, and a surplus. All three.",
      "Win: end day 8 with both dials at 100%.",
      "Your blob starts at 50 lbs, which is not a realistic weight for anything, and that's fine.",
      "Your thumb is not precise. Every lock lands somewhere inside the window it shows you, not on the line. The more you've locked, the wider the window gets."
    ],
    actions: [{ label: "New run", confirm: "This run is gone. Your best score stays.", onClick: function () { newRun(); } }],
    describeSave: function () { return "Your best Fat Finger Fit score."; }
  });

  var T = FFF.TUNE, ORDER = FFF.ORDER;
  function $(id) { return document.getElementById(id); }
  var rows = {}, inputs = {}, locks = {};
  Array.prototype.forEach.call(document.querySelectorAll(".row"), function (r) {
    rows[r.dataset.key] = r; inputs[r.dataset.key] = r.querySelector("input");
  });
  Array.prototype.forEach.call(document.querySelectorAll("#locks span"), function (l) { locks[l.dataset.key] = l; });

  var state, lockIdx, nominal, delivered, halves, best;
  best = Number(Arcade.load("best", 0)) || 0;
  var runsDone = Number(Arcade.load("runs", 0)) || 0;
  var wins = Number(Arcade.load("wins", 0)) || 0;
  function saveBrag() {
    var bestWon = !!Arcade.load("bestWon", false);
    Arcade.brag(best > 0 ? "Best " + FFF.fmt(best, bestWon) : "");
    Arcade.stats(runsDone > 0 ? [
      ["Best score", FFF.fmt(best, bestWon)],
      ["Runs finished", runsDone],
      ["Wins", wins]
    ] : null);
  }
  saveBrag();

  // ---- run / day lifecycle ---------------------------------------------
  function newRun() {
    $("overlay").classList.remove("show");
    state = FFF.newRun();
    startDay();
    drawGauges();
    drawScore();
  }
  function startDay() {
    lockIdx = 0; nominal = {}; delivered = {}; halves = [];
    $("day").textContent = "DAY " + state.day + " / " + T.DAYS;
    drawSliderStates();
    drawBar(null);
    console.log("--- day " + state.day + " ---");
  }
  function liveKey() { return ORDER[lockIdx]; }

  function commit() {
    var k = liveKey();
    var v = Number(inputs[k].value);
    nominal[k] = v;
    delivered[k] = FFF.deliver(k, v);          // hidden until resolution
    halves.push(FFF.windowHalf(k, v));
    console.log("lock " + k + " nominal=" + v.toFixed(1) + " contrib=" + FFF.contribution(k, v).toFixed(0) +
      " delivered=" + delivered[k].toFixed(0) + " window=±" + halves[halves.length - 1].toFixed(0) +
      " cumulative=±" + FFF.cumulativeHalf(halves).toFixed(0));
    lockIdx += 1;
    if (lockIdx < ORDER.length) { drawSliderStates(); drawBar(null); }
    else resolveDay();
  }

  function resolveDay() {
    var out = FFF.resolveDay(state, delivered);
    console.log("resolve net=" + out.net.toFixed(0) + " p=" + out.p.toFixed(2) + " stim=" + out.stim.toFixed(2) +
      " gain=" + out.gain.toFixed(1) + " loss=" + out.loss.toFixed(1) + " lbs=" + out.lbs.toFixed(1) +
      " muscle=" + out.muscle.toFixed(1) + " +" + Math.round(out.dayPoints) + " pts");
    drawBarTruth();
    drawGauges(out);
    drawScore();
    $("commit").disabled = true;
    // Hold on the resolved bar long enough to read where it actually landed.
    setTimeout(function () {
      $("commit").disabled = false;
      if (state.day > T.DAYS) endRun(); else startDay();
    }, 1500);
  }

  function endRun() {
    var f = FFF.finalScore(state);
    if (f.final > best) { best = f.final; Arcade.save("best", best); Arcade.save("bestWon", f.won); }
    runsDone += 1;
    if (f.won) wins += 1;
    Arcade.save("runs", runsDone);
    Arcade.save("wins", wins);
    saveBrag();
    var bestWon = f.final === best ? f.won : !!Arcade.load("bestWon", false);
    $("c-lbs").textContent = Math.round(state.lbs) + "%";
    $("c-muscle").textContent = Math.round(state.muscle) + "%";
    $("c-cascade").textContent = FFF.fmt(f.running) + " × " + f.build.toFixed(2) + " × " + f.precision.toFixed(2);
    $("c-final").textContent = FFF.fmt(f.final, f.won);
    $("c-best").textContent = "best " + FFF.fmt(best, bestWon);
    var sp = $("spark"); sp.innerHTML = "";
    state.lbsHistory.forEach(function (v) {
      var b = document.createElement("span");
      b.style.height = Math.max(4, Math.min(100, (v - 60) / 80 * 100)) + "%";
      sp.appendChild(b);
    });
    $("overlay").classList.add("show");
    console.log("END", f);
  }

  // ---- drawing -----------------------------------------------------------
  function drawSliderStates() {
    ORDER.forEach(function (k, i) {
      var st = i < lockIdx ? "locked" : i === lockIdx ? "live" : "waiting";
      rows[k].className = "row " + st;
      locks[k].className = st;
      inputs[k].disabled = i !== lockIdx;
    });
  }

  function pct(kcal) { return (100 * kcal / T.BAR_MAX) + "%"; }

  // The five bar segments are persistent so their left/width can animate.
  var segs = {};
  Array.prototype.forEach.call(document.querySelectorAll("#bar .seg"), function (el) { segs[el.classList[1]] = el; });
  function place(el, a, b) { el.style.left = pct(Math.max(0, a)); el.style.width = pct(Math.max(0, b - a)); }

  // Lay out P/C/F stacked, warm overlay past the tick, T carved back from the
  // tip. Returns the frontier (net position of the tip).
  function layout(vals) {
    var x = 0;
    ["P", "C", "F"].forEach(function (k) { var c = vals[k] || 0; place(segs[k], x, x + c); x += c; });
    place(segs.warm, Math.max(0, T.MAINT), x > T.MAINT ? x : 0);
    var t = vals.T || 0;
    place(segs.T, x - t, x);
    return Math.max(0, x - t);
  }
  function setWindow(el, centre, half) {
    if (half > 0) { place(el, centre - half, Math.min(T.BAR_MAX, centre + half)); el.classList.add("on"); }
    else el.classList.remove("on");
  }

  // Draw the bar from nominal locked values, plus an optional pending
  // (released but uncommitted) value for the live slider, plus the window.
  function drawBar(pendingValue) {
    $("bar").classList.remove("snap");
    var vals = {}, tHalves = halves.slice(), pendingKey = null;
    ORDER.forEach(function (k, i) {
      if (i < lockIdx) vals[k] = FFF.contribution(k, nominal[k]);
      else if (i === lockIdx && pendingValue != null) {
        vals[k] = FFF.contribution(k, pendingValue); pendingKey = k;
        tHalves.push(FFF.windowHalf(k, pendingValue));
      }
    });
    ORDER.forEach(function (k) { segs[k].classList.toggle("pending", k === pendingKey); });
    var x = layout(vals);
    setWindow($("window"), x, FFF.cumulativeHalf(tHalves));
    // ghost: the cumulative window as it stood after the previous lock
    setWindow($("ghost"), x, pendingKey && halves.length ? FFF.cumulativeHalf(halves) : 0);
  }

  // After the fourth commit: snap to delivered truth, window collapses.
  function drawBarTruth() {
    var bar = $("bar");
    bar.classList.add("snap");
    ORDER.forEach(function (k) { segs[k].classList.remove("pending"); });
    var x = layout(delivered);
    var w = $("window");
    place(w, x, x); w.classList.remove("on");
    $("ghost").classList.remove("on");
  }

  function drawGauges(out) {
    // LBS: 60–140 sweep, 100 at 12 o'clock, neutral colour both sides.
    var lbs = state.lbs, deg = (lbs - 100) / 40 * 180;
    var rl = $("ring-lbs");
    rl.style.background = deg >= 0
      ? "conic-gradient(var(--fg) 0deg " + deg + "deg, rgba(255,255,255,0.12) " + deg + "deg 360deg)"
      : "conic-gradient(rgba(255,255,255,0.12) 0deg " + (360 + deg) + "deg, var(--fg) " + (360 + deg) + "deg 360deg)";
    $("lbs").textContent = Math.round(lbs) + "%";
    // MUSCLE: clockwise from 6 o'clock.
    var m = state.muscle, md = m / 100 * 360;
    var rm = $("ring-muscle");
    rm.style.background = "conic-gradient(from 180deg, var(--accent) 0deg " + md + "deg, rgba(255,255,255,0.12) " + md + "deg 360deg)";
    rm.className = "ring" + (out && out.proteinShort ? " grey" : "");
    $("muscle").textContent = Math.round(m) + "%";
    $("blob").style.transform = "scale(" + (lbs / 100) + ")";
  }
  function drawScore() { $("score").textContent = FFF.fmt(state.running); }

  // ---- input -------------------------------------------------------------
  ORDER.forEach(function (k) {
    var inp = inputs[k];
    // Nothing on the bar moves while the thumb is down. On release, the
    // window for this lock draws at the tip.
    function release() { if (k === liveKey()) drawBar(Number(inp.value)); }
    inp.addEventListener("change", release);
    inp.addEventListener("pointerup", release);
    inp.addEventListener("touchend", release);
  });
  $("commit").addEventListener("click", commit);
  $("again").addEventListener("click", newRun);

  Arcade.boot(newRun);
</script>
</body>
</html>
