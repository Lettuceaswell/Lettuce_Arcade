<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keto Krush — Lettuce Arcade</title>
<meta name="theme-color" content="#0b4d49">
<link rel="stylesheet" href="/shared/arcade.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 100vh;
    text-align: center;
    padding:
      calc(64px + var(--safe-top))
      calc(12px + var(--safe-right))
      calc(40px + var(--safe-bottom))
      calc(12px + var(--safe-left));
  }

  h1 { font-size: 1.35rem; letter-spacing: 0.02em; }

  #status {
    height: 1.4rem;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--fg-dim);
  }

  #scoreline {
    font-size: 1.05rem;
    font-weight: 700;
  }

  .board {
    position: relative;
    touch-action: none;
  }

  .tile {
    position: absolute;
    top: 0;
    left: 0;
    width: var(--cell);
    height: var(--cell);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--cell) * 0.58);
    line-height: 1;
    border-radius: calc(var(--cell) * 0.2);
    background: var(--bg-elevated);
    transition: transform 150ms ease, opacity 150ms ease, box-shadow 150ms ease;
    will-change: transform;
  }

  .tile.selected {
    box-shadow: 0 0 0 3px #ffe066 inset;
  }

  .tile.special-row {
    box-shadow: 0 0 0 3px #ffd23f inset, 0 0 10px 2px rgba(255, 210, 63, 0.65);
  }

  .tile.special-col {
    box-shadow: 0 0 0 3px #4fd6ff inset, 0 0 10px 2px rgba(79, 214, 255, 0.65);
  }

  .tile.special-cross {
    box-shadow: 0 0 0 3px #ff5fd6 inset, 0 0 10px 2px rgba(255, 95, 214, 0.7);
  }

  @keyframes hintPulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.15) inset; }
    50% { box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.85) inset; }
  }

  .tile.hint {
    animation: hintPulse 900ms ease-in-out infinite;
  }

  #stats { font-size: 0.85rem; color: var(--fg-dim); }

  #runover {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-top: 4px;
  }

  #runover.show { display: flex; }

  #runover .headline {
    font-size: 1.1rem;
    font-weight: 800;
  }

  #mute {
    position: fixed;
    top: calc(8px + var(--safe-top));
    right: calc(8px + var(--safe-right));
    min-height: 44px;
    min-width: 44px;
    font-size: 1.2rem;
    background: rgba(0, 0, 0, 0.5);
    z-index: 9999;
  }
</style>
</head>
<body>
<h1>🍖 Keto Krush</h1>

<div id="status" aria-live="polite"></div>
<div id="scoreline"></div>

<div class="board" id="board"></div>

<div id="runover">
  <div class="headline" id="runover-headline"></div>
  <button id="restart" class="btn">Play again</button>
</div>

<div id="stats"></div>

<button id="mute" class="btn" aria-label="Mute sound">🔊</button>

<script src="/shared/arcade.js"></script>
<script>
  Arcade.backButton();

  // ---- config ----------------------------------------------------------
  var N = 6; // 6x6 keeps every tile >=44px on the smallest supported phone
  var ICONS = ["🍖", "🧀", "🍕", "🥐", "🍪"];
  var PROTEIN_ICONS = { "🍖": true, "🧀": true };
  var GAP = 4;
  var SWAP_MS = 150;
  var CLEAR_MS = 160;
  var FALL_MS = 190;
  var HINT_IDLE_MS = 5000;

  var boardEl = document.getElementById("board");
  var statusEl = document.getElementById("status");
  var scorelineEl = document.getElementById("scoreline");
  var statsEl = document.getElementById("stats");
  var muteBtn = document.getElementById("mute");
  var runoverEl = document.getElementById("runover");
  var runoverHeadlineEl = document.getElementById("runover-headline");
  var restartBtn = document.getElementById("restart");

  function num(v) {
    var n = Number(v);
    return isFinite(n) ? n : 0;
  }

  var cleared = num(Arcade.load("cleared", 0)); // lifetime tiles cleared
  var highScore = num(Arcade.load("highScore", 0));
  var muted = Arcade.load("muted", false) === true;
  var CELL = 44;
  var grid = [];
  var nextId = 1;
  var busy = true; // stays true until the board first settles
  var selected = null;
  var pointerStart = null;
  var statusTimer = null;
  var score = 0;
  var comboStep = 0;
  var runOver = false;
  var hintTimer = null;
  var hintTiles = null;

  // ---- audio -------------------------------------------------------------
  function tone(freq, dur, delay, vol) {
    var ctx = Arcade.audioCtx;
    if (!ctx || muted) return;
    try {
      var t0 = ctx.currentTime + (delay || 0);
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol || 0.16, t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch (e) {
      /* audio unavailable; gameplay continues silently */
    }
  }

  function matchSound() { tone(659, 0.12, 0, 0.15); }
  function failSound() { tone(220, 0.1, 0, 0.1); }
  function specialSound() { tone(880, 0.18, 0, 0.18); }

  function renderMute() {
    muteBtn.textContent = muted ? "🔇" : "🔊";
    muteBtn.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound");
  }

  muteBtn.addEventListener("click", function () {
    muted = !muted;
    Arcade.save("muted", muted);
    renderMute();
  });

  // ---- status line --------------------------------------------------------
  function setStatus(text) {
    statusEl.textContent = text;
    if (statusTimer) clearTimeout(statusTimer);
    if (text) {
      statusTimer = setTimeout(function () { statusEl.textContent = ""; }, 2200);
    }
  }

  function renderStats() {
    statsEl.textContent = cleared.toLocaleString() + " tiles cleared (lifetime)";
  }

  function renderScoreline() {
    scorelineEl.textContent = "Score: " + score.toLocaleString() + "   Best: " + highScore.toLocaleString();
  }

  // ---- layout --------------------------------------------------------------
  function computeLayout() {
    var maxBoardWidth = Math.min(window.innerWidth - 24, 460);
    var cell = Math.floor((maxBoardWidth - GAP * (N - 1)) / N);
    if (cell < 44) cell = 44; // hard floor: minimum 44x44 tap target
    CELL = cell;
    var boardWidth = CELL * N + GAP * (N - 1);
    boardEl.style.width = boardWidth + "px";
    boardEl.style.height = boardWidth + "px";
    boardEl.style.setProperty("--cell", CELL + "px");

    for (var row = 0; row < N; row++) {
      for (var col = 0; col < N; col++) {
        var t = grid[row] && grid[row][col];
        if (t) setTilePosition(t, false);
      }
    }
  }

  var resizeTimer = null;
  window.addEventListener("resize", function () {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(computeLayout, 120);
  });

  // ---- tile helpers ----------------------------------------------------
  function randomIcon() {
    return ICONS[Math.floor(Math.random() * ICONS.length)];
  }

  function newTile(row, col, icon) {
    var el = document.createElement("div");
    el.className = "tile";
    el.textContent = icon;
    boardEl.appendChild(el);
    var t = { id: nextId++, row: row, col: col, icon: icon, el: el, type: "normal" };
    el.dataset.row = row;
    el.dataset.col = col;
    return t;
  }

  function setTilePosition(t, animate) {
    if (!animate) t.el.style.transition = "none";
    t.el.style.transform =
      "translate3d(" + (t.col * (CELL + GAP)) + "px," + (t.row * (CELL + GAP)) + "px,0)";
    if (!animate) {
      void t.el.offsetWidth;
      t.el.style.transition = "";
    }
  }

  function markSpecial(t, kind) {
    if (t.type === kind) return;
    if (t.type !== "normal" && t.type !== kind) kind = "cross";
    t.type = kind;
    t.el.classList.remove("special-row", "special-col", "special-cross");
    t.el.classList.add("special-" + kind);
  }

  // ---- board generation --------------------------------------------------
  function wouldMatch(row, col, icon) {
    if (col >= 2) {
      var a = grid[row][col - 1], b = grid[row][col - 2];
      if (a && b && a.icon === icon && b.icon === icon) return true;
    }
    if (row >= 2) {
      var c = grid[row - 1][col], d = grid[row - 2][col];
      if (c && d && c.icon === icon && d.icon === icon) return true;
    }
    return false;
  }

  function generateBoard() {
    do {
      while (boardEl.firstChild) boardEl.removeChild(boardEl.firstChild);
      grid = [];
      for (var row = 0; row < N; row++) {
        grid.push([]);
        for (var col = 0; col < N; col++) {
          var icon;
          do { icon = randomIcon(); } while (wouldMatch(row, col, icon));
          var t = newTile(row, col, icon);
          setTilePosition(t, false);
          grid[row].push(t);
        }
      }
    } while (!hasAnyMove());
  }

  // ---- matching ------------------------------------------------------------
  // Returns an array of runs: { positions: [{row,col},...], orientation: "row"|"col" }
  // for every straight run of 3+ identical icons currently on the board.
  function findMatchRuns() {
    var runs = [];
    var row, col, runStart, runIcon;

    for (row = 0; row < N; row++) {
      runStart = 0; runIcon = grid[row][0].icon;
      for (col = 1; col <= N; col++) {
        var icon = col < N ? grid[row][col].icon : null;
        if (col < N && icon === runIcon) continue;
        if (col - runStart >= 3) {
          var positions = [];
          for (var k = runStart; k < col; k++) positions.push({ row: row, col: k });
          runs.push({ positions: positions, orientation: "row" });
        }
        runStart = col; runIcon = icon;
      }
    }

    for (col = 0; col < N; col++) {
      runStart = 0; runIcon = grid[0][col].icon;
      for (row = 1; row <= N; row++) {
        var icon2 = row < N ? grid[row][col].icon : null;
        if (row < N && icon2 === runIcon) continue;
        if (row - runStart >= 3) {
          var positions2 = [];
          for (var k2 = runStart; k2 < row; k2++) positions2.push({ row: k2, col: col });
          runs.push({ positions: positions2, orientation: "col" });
        }
        runStart = row; runIcon = icon2;
      }
    }

    return runs;
  }

  function findMatches() {
    var runs = findMatchRuns();
    var seen = {};
    var out = [];
    runs.forEach(function (run) {
      run.positions.forEach(function (p) {
        var key = p.row + "," + p.col;
        if (!seen[key]) { seen[key] = true; out.push(p); }
      });
    });
    return out;
  }

  function swapEntries(a, b) {
    var ta = grid[a.row][a.col], tb = grid[b.row][b.col];
    grid[a.row][a.col] = tb; grid[b.row][b.col] = ta;
    ta.row = b.row; ta.col = b.col;
    tb.row = a.row; tb.col = a.col;
    ta.el.dataset.row = ta.row; ta.el.dataset.col = ta.col;
    tb.el.dataset.row = tb.row; tb.el.dataset.col = tb.col;
    setTilePosition(ta, true);
    setTilePosition(tb, true);
  }

  function hasAnyMove() {
    for (var row = 0; row < N; row++) {
      for (var col = 0; col < N; col++) {
        if (col + 1 < N) {
          swapCells(row, col, row, col + 1);
          var m1 = findMatches().length > 0;
          swapCells(row, col, row, col + 1);
          if (m1) return true;
        }
        if (row + 1 < N) {
          swapCells(row, col, row + 1, col);
          var m2 = findMatches().length > 0;
          swapCells(row, col, row + 1, col);
          if (m2) return true;
        }
      }
    }
    return false;
  }

  // Silent grid-only swap used for move-availability / hint probing (no DOM writes).
  function swapCells(r1, c1, r2, c2) {
    var tmp = grid[r1][c1];
    grid[r1][c1] = grid[r2][c2];
    grid[r2][c2] = tmp;
  }

  // ---- hints -----------------------------------------------------------
  // Scans every adjacent swap for one that produces a match, preferring a
  // meat/cheese ("protein") combo; falls back to any carb combo.
  function findHint() {
    var carbHint = null;
    for (var row = 0; row < N; row++) {
      for (var col = 0; col < N; col++) {
        var dirs = [];
        if (col + 1 < N) dirs.push({ row: row, col: col + 1 });
        if (row + 1 < N) dirs.push({ row: row + 1, col: col });
        for (var d = 0; d < dirs.length; d++) {
          var target = dirs[d];
          swapCells(row, col, target.row, target.col);
          var matches = findMatches();
          var isProtein = matches.some(function (p) { return PROTEIN_ICONS[grid[p.row][p.col].icon]; });
          swapCells(row, col, target.row, target.col);
          if (matches.length) {
            var pair = { a: { row: row, col: col }, b: target };
            if (isProtein) return pair;
            if (!carbHint) carbHint = pair;
          }
        }
      }
    }
    return carbHint;
  }

  function clearHint() {
    if (hintTiles) {
      hintTiles.forEach(function (t) { t.el.classList.remove("hint"); });
      hintTiles = null;
    }
  }

  function showHint() {
    if (busy || runOver) return;
    var pair = findHint();
    if (!pair) return;
    clearHint();
    var ta = grid[pair.a.row][pair.a.col];
    var tb = grid[pair.b.row][pair.b.col];
    ta.el.classList.add("hint");
    tb.el.classList.add("hint");
    hintTiles = [ta, tb];
  }

  function scheduleHint() {
    clearHint();
    if (hintTimer) clearTimeout(hintTimer);
    hintTimer = setTimeout(showHint, HINT_IDLE_MS);
  }

  // ---- resolve / cascade --------------------------------------------------
  function isAdjacent(a, b) {
    return Math.abs(a.row - b.row) + Math.abs(a.col - b.col) === 1;
  }

  function attemptSwap(a, b) {
    if (busy || runOver || !isAdjacent(a, b)) return;
    busy = true;
    clearHint();
    if (hintTimer) clearTimeout(hintTimer);
    swapEntries(a, b);
    setTimeout(function () {
      var runs = findMatchRuns();
      if (runs.length) {
        comboStep = 0;
        resolveCascade(runs);
      } else {
        failSound();
        swapEntries(a, b);
        setTimeout(function () { busy = false; scheduleHint(); }, SWAP_MS);
      }
    }, SWAP_MS);
  }

  function collapseColumn(col, spawned) {
    var existing = [];
    for (var row = 0; row < N; row++) {
      if (grid[row][col]) existing.push(grid[row][col]);
      grid[row][col] = null;
    }
    var writeRow = N - 1;
    for (var i = existing.length - 1; i >= 0; i--) {
      var t = existing[i];
      t.row = writeRow;
      t.el.dataset.row = writeRow;
      grid[writeRow][col] = t;
      setTilePosition(t, true);
      writeRow--;
    }
    var spawnIndex = 1;
    for (var row2 = writeRow; row2 >= 0; row2--) {
      var t2 = newTile(row2, col, randomIcon());
      var spawnRow = row2 - spawnIndex;
      t2.row = spawnRow;
      t2.el.dataset.row = spawnRow;
      setTilePosition(t2, false);
      grid[row2][col] = t2;
      spawned.push({ tile: t2, targetRow: row2 });
      spawnIndex++;
    }
  }

  function endRun() {
    runOver = true;
    busy = true;
    var beat = score > highScore;
    if (beat) {
      highScore = score;
      Arcade.save("highScore", highScore);
    }
    renderScoreline();
    runoverHeadlineEl.textContent = beat
      ? "New best! " + score.toLocaleString() + " points 🎉"
      : "Run over — " + score.toLocaleString() + " points";
    runoverEl.classList.add("show");
  }

  function resolveCascade(runs) {
    function step(currentRuns) {
      comboStep++;

      // Which positions clear this step, and which become new special tiles.
      var clearedSet = {};
      var newSpecials = {};
      currentRuns.forEach(function (run) {
        run.positions.forEach(function (p) { clearedSet[p.row + "," + p.col] = true; });
        if (run.positions.length >= 4) {
          var mid = run.positions[Math.floor(run.positions.length / 2)];
          var key = mid.row + "," + mid.col;
          var kind = run.orientation === "row" ? "row" : "col";
          if (newSpecials[key] && newSpecials[key] !== kind) newSpecials[key] = "cross";
          else if (!newSpecials[key]) newSpecials[key] = kind;
        }
      });

      // Chain-activate any existing special tiles swept up in this clear.
      var queue = Object.keys(clearedSet);
      var qi = 0;
      var triggeredSpecial = false;
      while (qi < queue.length) {
        var key = queue[qi++];
        var parts = key.split(",");
        var r = Number(parts[0]), c = Number(parts[1]);
        var t = grid[r] && grid[r][c];
        if (!t || newSpecials[key]) continue; // fresh specials-in-the-making don't self-detonate
        if (t.type === "row" || t.type === "cross") {
          triggeredSpecial = true;
          for (var cc = 0; cc < N; cc++) {
            var k2 = r + "," + cc;
            if (!clearedSet[k2]) { clearedSet[k2] = true; queue.push(k2); }
          }
        }
        if (t.type === "col" || t.type === "cross") {
          triggeredSpecial = true;
          for (var rr = 0; rr < N; rr++) {
            var k3 = rr + "," + c;
            if (!clearedSet[k3]) { clearedSet[k3] = true; queue.push(k3); }
          }
        }
      }

      var gained = Object.keys(clearedSet).length;
      cleared += gained;
      score += gained * comboStep;
      renderScoreline();

      if (triggeredSpecial) specialSound(); else matchSound();
      if (comboStep > 1) setStatus("🔥 x" + comboStep + " combo!");

      var cols = {};
      var toRemove = [];
      Object.keys(clearedSet).forEach(function (key) {
        var parts = key.split(",");
        var r = Number(parts[0]), c = Number(parts[1]);
        if (newSpecials[key]) {
          markSpecial(grid[r][c], newSpecials[key]);
          return; // stays on the board, converted rather than cleared
        }
        var t = grid[r][c];
        if (!t) return;
        t.el.style.transform = t.el.style.transform + " scale(0.3)";
        t.el.style.opacity = "0";
        toRemove.push(t.el);
        grid[r][c] = null;
        cols[c] = true;
      });

      setTimeout(function () {
        toRemove.forEach(function (el) { el.remove(); });

        var spawned = [];
        Object.keys(cols).forEach(function (colKey) { collapseColumn(Number(colKey), spawned); });

        requestAnimationFrame(function () {
          spawned.forEach(function (s) {
            s.tile.row = s.targetRow;
            s.tile.el.dataset.row = s.targetRow;
            setTilePosition(s.tile, true);
          });
        });

        setTimeout(function () {
          var next = findMatchRuns();
          if (next.length) {
            step(next);
          } else {
            Arcade.save("cleared", cleared);
            renderStats();
            if (!hasAnyMove()) {
              busy = false;
              endRun();
            } else {
              busy = false;
              scheduleHint();
            }
          }
        }, FALL_MS);
      }, CLEAR_MS);
    }
    step(runs);
  }

  // ---- input ---------------------------------------------------------------
  function coordsFromEl(el) {
    return { row: Number(el.dataset.row), col: Number(el.dataset.col) };
  }

  function select(coord) {
    if (selected) grid[selected.row][selected.col].el.classList.remove("selected");
    selected = coord;
    grid[coord.row][coord.col].el.classList.add("selected");
  }

  function deselect() {
    if (selected) grid[selected.row][selected.col].el.classList.remove("selected");
    selected = null;
  }

  var SWIPE_THRESHOLD = 20;

  boardEl.addEventListener("pointerdown", function (e) {
    clearHint();
    if (hintTimer) clearTimeout(hintTimer);
    var el = e.target.closest(".tile");
    if (!el || busy || runOver) return;
    el.setPointerCapture(e.pointerId);
    pointerStart = { x: e.clientX, y: e.clientY, coord: coordsFromEl(el) };
  });

  boardEl.addEventListener("pointerup", function (e) {
    if (!pointerStart) return;
    var start = pointerStart;
    pointerStart = null;
    if (busy || runOver) return;

    var dx = e.clientX - start.x;
    var dy = e.clientY - start.y;
    var dist = Math.sqrt(dx * dx + dy * dy);

    if (dist >= Math.max(SWIPE_THRESHOLD, CELL * 0.35)) {
      var dir;
      if (Math.abs(dx) > Math.abs(dy)) dir = dx > 0 ? { row: 0, col: 1 } : { row: 0, col: -1 };
      else dir = dy > 0 ? { row: 1, col: 0 } : { row: -1, col: 0 };
      var target = { row: start.coord.row + dir.row, col: start.coord.col + dir.col };
      if (target.row >= 0 && target.row < N && target.col >= 0 && target.col < N) {
        deselect();
        attemptSwap(start.coord, target);
      }
      return;
    }

    // tap
    var tapped = start.coord;
    if (!selected) {
      select(tapped);
    } else if (selected.row === tapped.row && selected.col === tapped.col) {
      deselect();
    } else if (isAdjacent(selected, tapped)) {
      var a = selected;
      deselect();
      attemptSwap(a, tapped);
    } else {
      select(tapped);
    }
  });

  restartBtn.addEventListener("click", function () {
    runOver = false;
    runoverEl.classList.remove("show");
    score = 0;
    comboStep = 0;
    renderScoreline();
    generateBoard();
    busy = false;
    scheduleHint();
  });

  // ---- boot ------------------------------------------------------------
  function start() {
    renderMute();
    computeLayout();
    generateBoard();
    renderStats();
    renderScoreline();
    busy = false;
    scheduleHint();
  }

  Arcade.boot(start);
</script>
</body>
</html>
