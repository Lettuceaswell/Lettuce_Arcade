<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Keto Krush — Lettuce Arcade</title>
<meta name="theme-color" content="#083734">
<link rel="stylesheet" href="/shared/arcade.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 100vh;
    text-align: center;
    padding:
      calc(64px + var(--safe-top))
      calc(12px + var(--safe-right))
      calc(40px + var(--safe-bottom))
      calc(12px + var(--safe-left));
  }

  h1 { font-size: 1.35rem; letter-spacing: 0.02em; }

  #status {
    height: 1.4rem;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--fg-dim);
  }

  #scoreline {
    font-size: 1.05rem;
    font-weight: 700;
  }

  .board {
    position: relative;
    touch-action: none;
  }

  .tile {
    position: absolute;
    top: 0;
    left: 0;
    width: var(--cell);
    height: var(--cell);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--cell) * 0.58);
    line-height: 1;
    border-radius: calc(var(--cell) * 0.2);
    background: var(--bg-elevated);
    transition: transform 150ms ease, opacity 150ms ease, box-shadow 150ms ease;
    will-change: transform;
  }

  .tile.selected {
    box-shadow: 0 0 0 3px #ffe066 inset;
  }

  .tile.special-row {
    box-shadow: 0 0 0 3px #ffd23f inset, 0 0 10px 2px rgba(255, 210, 63, 0.65);
  }

  .tile.special-col {
    box-shadow: 0 0 0 3px #4fd6ff inset, 0 0 10px 2px rgba(79, 214, 255, 0.65);
  }

  .tile.special-cross {
    box-shadow: 0 0 0 3px #ff5fd6 inset, 0 0 10px 2px rgba(255, 95, 214, 0.7);
  }

  /* Protein tiles get their own ground so a scan for meat or cheese is a
     colour read, not an emoji hunt. Warm complements to the teal carbs. */
  .tile.meat { background: #b8433a; }
  .tile.cheese { background: #b07d1a; }

  /* The hint pulses on a pseudo-element so it never clobbers the tile's own
     box-shadow — a powered-up tile keeps its special ring while it flashes. */
  @keyframes hintPulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.15) inset; }
    50% { box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.85) inset; }
  }

  .tile.hint::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    animation: hintPulse 900ms ease-in-out infinite;
  }

  #ketosis {
    width: 220px;
    max-width: 80vw;
    height: 12px;
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.12);
    overflow: hidden;
  }

  #ketosis-fill {
    height: 100%;
    width: 50%;
    background: #ffd23f;
    transition: width 200ms ease, background-color 200ms ease;
  }

  #ketosis-label {
    font-size: 0.75rem;
    color: var(--fg-dim);
  }

  body.ketosis #ketosis-fill { box-shadow: 0 0 8px 2px rgba(74, 222, 128, 0.7); }
  body.deep #ketosis-fill { box-shadow: 0 0 10px 3px rgba(56, 189, 248, 0.75); }
  body.carbcrash #ketosis-fill { box-shadow: 0 0 8px 2px rgba(255, 107, 107, 0.7); }

  @keyframes frenzyPulse {
    0%, 100% { box-shadow: 0 0 8px 2px rgba(192, 132, 252, 0.6); }
    50% { box-shadow: 0 0 16px 5px rgba(192, 132, 252, 1); }
  }

  body.frenzy #ketosis-fill { animation: frenzyPulse 700ms ease-in-out infinite; }
  body.frenzy #ketosis-label { color: #e9d5ff; font-weight: 700; }

  #stats { font-size: 0.85rem; color: var(--fg-dim); }

  /* Shown under the board only after the end card is dismissed to look at
     the final board: a way back to the card, and a way to play again. */
  #runover {
    display: none;
    gap: 10px;
    margin-top: 4px;
  }

  #runover.show { display: flex; }

  /* ---- end card ------------------------------------------------------------
     A dimmed overlay with an opaque card, sized to fit a small phone screen
     without scrolling so a screenshot catches the whole thing. */
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 9000;
    display: none;
    padding: calc(12px + var(--safe-top)) 12px calc(12px + var(--safe-bottom));
    background: rgba(3, 26, 24, 0.86);
    overflow-y: auto;
    opacity: 0;
    transition: opacity 250ms ease;
  }

  #overlay.show { display: flex; }
  #overlay.in { opacity: 1; }

  .card {
    width: 100%;
    max-width: 360px;
    margin: auto; /* centred when it fits, scrollable when it doesn't */
    background: #052926;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 18px;
    padding: 14px 16px 12px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 9px;
    text-align: center;
    transform: translateY(24px);
    transition: transform 320ms cubic-bezier(0.2, 0.9, 0.3, 1.1);
  }

  #overlay.in .card { transform: none; }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 0.9rem;
    color: var(--fg-dim);
  }

  .card-top .game { color: var(--fg); font-weight: 700; }

  /* The run arc: one bar per move, height = meter, colour = tier. The clip
     draws it left to right so the run replays itself in about a second. */
  .arcwrap { position: relative; height: 48px; margin-top: 4px; }
  .arcclip { height: 100%; clip-path: inset(0 100% 0 0); }
  .arcclip.in { clip-path: inset(0 0 0 0); transition: clip-path 1100ms linear; }
  .arc {
    display: block;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.28);
    border-radius: 8px;
  }
  .arc-mark {
    position: absolute;
    top: -9px;
    font-size: 0.8rem;
    line-height: 1;
    transform: translateX(-50%);
  }

  .legend {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 2px 10px;
    font-size: 0.68rem;
    color: var(--fg-dim);
    margin-top: -4px;
  }
  .legend i {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 3px;
  }

  .card-why { font-size: 0.85rem; color: var(--fg-dim); margin-bottom: -8px; }
  .card-why.best { color: var(--accent); font-weight: 700; }
  .card-score {
    font-size: 2.3rem;
    font-weight: 900;
    letter-spacing: 0.02em;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }

  /* Share of points earned at each tier, in the tier colours. */
  .tierbar {
    display: flex;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    background: rgba(0, 0, 0, 0.28);
  }
  .tierbar span { display: block; height: 100%; }

  .card-line { font-size: 0.95rem; color: var(--fg-dim); }
  .card-line b { color: var(--fg); }

  /* Protein against carbs cleared this run. */
  .plate {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--fg-dim);
  }
  .plate b { color: var(--fg); }
  .platebar {
    flex: 1;
    height: 10px;
    border-radius: 5px;
    overflow: hidden;
    background: var(--bg-elevated);
  }
  .platebar span { display: block; height: 100%; background: #b8433a; }

  .highlights { display: flex; flex-direction: column; gap: 3px; }
  .hl {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 0.9rem;
    color: var(--fg-dim);
    text-align: left;
  }
  .hl .lbl { flex: 1; }
  .hl b { color: var(--fg); }
  .hl .rec { min-width: 1.3em; text-align: right; }

  .card-title {
    font-size: 1.35rem;
    font-weight: 900;
    color: #ffd23f;
    margin-top: 2px;
  }

  .card-foot { font-size: 0.72rem; color: var(--fg-dim); opacity: 0.75; }

  .card-actions { display: flex; gap: 8px; margin-top: 2px; }
  .card-actions .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
  .card-hint { font-size: 0.8rem; color: var(--fg-dim); }
  .card-hint:empty { display: none; }

  .link {
    background: none;
    border: 0;
    color: var(--fg-dim);
    text-decoration: underline;
    font: inherit;
    font-size: 0.9rem;
    min-height: 44px;
    cursor: pointer;
  }

  /* Staged reveal. Elements start hidden; the ceremony adds .in one by one.
     .done short-circuits everything to its final state (skip, reduced motion,
     or reopening the card). */
  .reveal { opacity: 0; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes stamp { 0% { transform: scale(2); opacity: 0; } 60% { transform: scale(0.95); opacity: 1; } 100% { transform: none; opacity: 1; } }
  .reveal.in { animation: fadeUp 300ms ease-out both; }
  .reveal.stamp.in { animation: stamp 450ms cubic-bezier(0.2, 0.9, 0.3, 1.2) both; }
  .card.done .reveal { opacity: 1; animation: none; transform: none; }
  .card.done .arcclip { clip-path: none; transition: none; }

  #movebar {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--fg-dim);
  }

  #moves {
    display: inline-block;
    min-width: 2ch;
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--fg);
  }

  #moves.low { color: #ff6b6b; }

  @keyframes moveGain {
    0% { transform: scale(1); color: var(--fg); }
    35% { transform: scale(1.5); color: #4ade80; }
    100% { transform: scale(1); color: var(--fg); }
  }

  #moves.gain { animation: moveGain 600ms ease-out; }

  @media (prefers-reduced-motion: reduce) {
    #moves.gain { animation: none; }
    .reveal.in, .reveal.stamp.in { animation: none; opacity: 1; }
    .arcclip.in { transition: none; }
    #overlay, .card { transition: none; }
  }

  #mute {
    position: fixed;
    top: calc(8px + var(--safe-top));
    right: calc(8px + var(--safe-right));
    min-height: 44px;
    min-width: 44px;
    font-size: 1.2rem;
    background: rgba(0, 0, 0, 0.5);
    z-index: 9999;
  }
</style>
</head>
<body>
<h1>🍖 Keto Krush</h1>

<div id="status" aria-live="polite"></div>
<div id="scoreline"></div>
<div id="movebar">Moves left: <span id="moves">25</span></div>
<div id="ketosis"><div id="ketosis-fill"></div></div>
<div id="ketosis-label"></div>

<div class="board" id="board"></div>

<div id="runover">
  <button id="showcard" class="btn">Show card</button>
  <button id="restart" class="btn">Play again</button>
</div>

<div id="stats"></div>

<div id="overlay" role="dialog" aria-label="Run over">
  <div class="card" id="card">
    <div class="card-top">
      <span class="game">🍖 Keto Krush</span>
      <span id="card-date"></span>
    </div>
    <div class="arcwrap">
      <div class="arcclip" id="arcclip">
        <svg class="arc" id="arc" preserveAspectRatio="none" viewBox="0 0 1 40" aria-hidden="true"></svg>
      </div>
      <div class="arc-mark" id="arc-mark" hidden>🍩</div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="card-why" id="card-why"></div>
    <div class="card-score" id="card-score">0</div>
    <div class="tierbar reveal" id="tierbar"></div>
    <div class="card-line reveal" id="card-moves"></div>
    <div class="plate reveal">
      <span>🍖🧀 <b id="plate-protein"></b></span>
      <div class="platebar"><span id="plate-fill"></span></div>
      <span><b id="plate-carb"></b> 🍕🥐🍪</span>
    </div>
    <div class="highlights" id="highlights"></div>
    <div class="card-title reveal stamp" id="card-title"></div>
    <div class="card-foot reveal" id="card-foot"></div>
    <div class="card-actions reveal">
      <button id="share" class="btn">Share</button>
      <button id="again" class="btn">Play again</button>
    </div>
    <div class="card-hint" id="card-hint"></div>
    <button id="seeboard" class="link reveal">Look at the board</button>
  </div>
</div>

<button id="mute" class="btn" aria-label="Mute sound">🔊</button>

<script src="/shared/arcade.js"></script>
<script>
  Arcade.backButton();

  // ---- config ----------------------------------------------------------
  var N = 6; // 6x6 keeps every tile >=44px on the smallest supported phone
  var ICONS = ["🍖", "🧀", "🍕", "🥐", "🍪"];
  var PROTEIN_ICONS = { "🍖": true, "🧀": true };
  var GAP = 4;
  var SWAP_MS = 150;
  var CLEAR_MS = 160;
  var FALL_MS = 190;
  var HINT_IDLE_MS = 5000;
  var KETOSIS_START = 50;
  var KETOSIS_PROTEIN_GAIN = 4; // per protein tile cleared
  var KETOSIS_CARB_LOSS = 3;    // per carb tile cleared

  // Meter bands, low to high. `drain` is the upkeep charged once per resolved
  // move, so holding a high tier costs more than holding a low one — that's
  // what makes a keto chain worth sustaining rather than merely reaching.
  // 100 has no band of its own: hitting it fires the frenzy instead.
  var TIERS = [
    { name: "crash",  min: 0,  mult: 0.5, drain: 1 },
    { name: "normal", min: 16, mult: 1,   drain: 1 },
    { name: "keto",   min: 70, mult: 2,   drain: 3 },
    { name: "deep",   min: 85, mult: 3,   drain: 5 }
  ];
  var KETOSIS_DRAIN_FLOOR = 40; // drain never pushes you below this: only
                                // carbs can crash you, never attrition
  var SUGAR_RUSH = 1.5;     // score bonus on an all-carb clear step
  var FRENZY_MULT = 4;
  var FRENZY_MOVES = 5;     // Fat-Adapted duration, in player moves
  var FRENZY_LAND = 70;     // meter drops back to base ketosis on expiry
  var POINTS_PER_TILE = 10; // the tiers are unreadable at a base of 1

  // ---- the move budget -----------------------------------------------------
  // A refilling 6x6 board practically never locks: simulated to board lock,
  // a perfect-protein run lasts a median of 1,033 moves (p90 3,246) and fires
  // 73 frenzies. Nothing is scarce, so climbing costs nothing and the frenzy
  // stops being a payoff — it's just the weather. The budget is the scarcity.
  //
  // Refunds come only from the meter, which makes the thing the player fully
  // controls the thing that decides how long they play. They're tuned so a
  // climb never quite pays for itself — the margin is thin and the cliff is
  // real: raising the deep refund to 3 tips skilled play straight back into
  // runaway (median 676 moves, max 5,001, only 14% of runs ending on the
  // budget at all). At 2 the budget ends 90% of them.
  //
  // Simulated medians: ~31 moves casual, ~134 perfect-protein, ~170 for a
  // player taking the *biggest* protein match rather than merely a protein
  // one — matching well beats matching greedily, which is the right lesson.
  var MOVE_BUDGET = 25;
  var REFUND = { keto: 2, deep: 2, frenzy: 5 };

  // Bumping this resets the personal best: scores earned under an older
  // economy aren't comparable to scores earned under this one.
  var ECON = 3;

  var boardEl = document.getElementById("board");
  var statusEl = document.getElementById("status");
  var scorelineEl = document.getElementById("scoreline");
  var ketosisFillEl = document.getElementById("ketosis-fill");
  var ketosisLabelEl = document.getElementById("ketosis-label");
  var statsEl = document.getElementById("stats");
  var muteBtn = document.getElementById("mute");
  var runoverEl = document.getElementById("runover");
  var movesEl = document.getElementById("moves");
  var overlayEl = document.getElementById("overlay");
  var cardEl = document.getElementById("card");
  var arcEl = document.getElementById("arc");
  var arcClipEl = document.getElementById("arcclip");
  var arcMarkEl = document.getElementById("arc-mark");
  var cardScoreEl = document.getElementById("card-score");
  var cardHintEl = document.getElementById("card-hint");

  function $(id) { return document.getElementById(id); }

  function num(v) {
    var n = Number(v);
    return isFinite(n) ? n : 0;
  }

  var cleared = num(Arcade.load("cleared", 0)); // lifetime tiles cleared
  var frenzies = num(Arcade.load("frenzies", 0)); // lifetime Fat-Adapted runs
  var highScore = num(Arcade.load("highScore", 0));
  var muted = Arcade.load("muted", false) === true;

  // Per-run records the end card can award beyond the high score, so a low
  // scoring run can still set one. Combo and frenzies count events and
  // carry across economies; the biggest move is points and resets with them.
  var records = {
    move: num(Arcade.load("bestMove", 0)),
    combo: num(Arcade.load("bestCombo", 0)),
    frenzies: num(Arcade.load("bestFrenzies", 0))
  };

  // Lifetime tile count carries over — it counts tiles, not points — but the
  // best score doesn't survive an economy change.
  if (num(Arcade.load("econ", 1)) !== ECON) {
    highScore = 0;
    Arcade.save("highScore", 0);
    records.move = 0;
    Arcade.save("bestMove", 0);
    Arcade.save("econ", ECON);
  }

  var reducedMotion = window.matchMedia
    && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var CELL = 44;
  var grid = [];
  var nextId = 1;
  var busy = true; // stays true until the board first settles
  var selected = null;
  var pointerStart = null;
  var statusTimer = null;
  var score = 0;
  var comboStep = 0;
  var runOver = false;
  var hintTimer = null;
  var hintTiles = null;
  var ketosis = KETOSIS_START;
  var ketosisState = "normal"; // a TIERS name, or "frenzy"
  var frenzyMoves = 0;         // >0 while Fat-Adapted
  var frenzyJustStarted = false; // so the triggering move doesn't burn a turn
  var movesLeft = MOVE_BUDGET;
  var movesTaken = 0;
  // A tier refund is armed while you're below its threshold and spent when you
  // cross it, so one climb pays once. Without the arming, the frenzy landing at
  // exactly 70 would re-pay the ketosis refund on the way down.
  var armKeto = false;
  var armDeep = false;
  var pendingRefund = 0; // moves just granted, waiting to be announced

  // ---- per-run record ------------------------------------------------------
  // Everything the end card shows. Fed by the cascade and end-of-move paths,
  // read once when the run ends. Nothing in here changes how the game plays.
  var run = null;

  function resetRun() {
    run = {
      history: [],       // { k: meter, s: tier } after each resolved move
      byTier: { crash: 0, normal: 0, keto: 0, deep: 0, frenzy: 0 }, // points
      protein: 0,        // tiles cleared
      carb: 0,
      movePts: 0,        // points so far in the move being resolved
      bestMove: 0,
      maxCombo: 0,
      frenzies: 0,
      peak: KETOSIS_START,
      crashed: false,
      carbLoss: 0,       // meter lost to carbs in the move being resolved
      worstCarb: { move: -1, loss: 0 }
    };
  }

  // ---- audio -------------------------------------------------------------
  function tone(freq, dur, delay, vol) {
    var ctx = Arcade.audioCtx;
    if (!ctx || muted) return;
    try {
      var t0 = ctx.currentTime + (delay || 0);
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol || 0.16, t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch (e) {
      /* audio unavailable; gameplay continues silently */
    }
  }

  function matchSound() { tone(659, 0.12, 0, 0.15); }
  function failSound() { tone(220, 0.1, 0, 0.1); }
  function specialSound() { tone(880, 0.18, 0, 0.18); }
  function ketosisInSound() { tone(784, 0.14, 0, 0.16); tone(1046, 0.16, 0.08, 0.16); }
  function ketosisOutSound() { tone(196, 0.22, 0, 0.14); }
  function frenzyInSound() {
    tone(523, 0.12, 0, 0.17); tone(659, 0.12, 0.09, 0.17);
    tone(784, 0.12, 0.18, 0.17); tone(1046, 0.3, 0.27, 0.2);
  }
  function frenzyOutSound() { tone(587, 0.16, 0, 0.13); tone(392, 0.28, 0.12, 0.12); }

  function renderMute() {
    muteBtn.textContent = muted ? "🔇" : "🔊";
    muteBtn.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound");
  }

  muteBtn.addEventListener("click", function () {
    muted = !muted;
    Arcade.save("muted", muted);
    renderMute();
  });

  // ---- status line --------------------------------------------------------
  function setStatus(text) {
    statusEl.textContent = text;
    if (statusTimer) clearTimeout(statusTimer);
    if (text) {
      statusTimer = setTimeout(function () { statusEl.textContent = ""; }, 2200);
    }
  }

  function renderStats() {
    statsEl.textContent = cleared.toLocaleString() + " tiles cleared · "
      + frenzies.toLocaleString() + " fat-adapted (lifetime)";
  }

  function renderScoreline() {
    scorelineEl.textContent = "Score: " + score.toLocaleString() + "   Best: " + highScore.toLocaleString();
  }

  function renderMoves() {
    movesEl.textContent = movesLeft;
    movesEl.classList.toggle("low", movesLeft <= 5);
  }

  // Pays a tier refund at most once per climb. Called after the meter reacts
  // to a clear — so the moves you buy come from the tier you just reached,
  // not the one you were holding.
  function payRefunds() {
    if (ketosis < 70) armKeto = true;
    if (ketosis < 85) armDeep = true;
    if (ketosis >= 70 && armKeto) { grantMoves(REFUND.keto); armKeto = false; }
    if (ketosis >= 85 && armDeep) { grantMoves(REFUND.deep); armDeep = false; }
  }

  function grantMoves(n) {
    if (!n) return;
    movesLeft += n;
    pendingRefund = n; // consumed by the next tier announcement
    renderMoves();
    movesEl.classList.remove("gain");
    void movesEl.offsetWidth; // restart the flash if refunds land back to back
    movesEl.classList.add("gain");
  }

  // ---- ketosis tiers -------------------------------------------------------
  function tierFor(value) {
    var t = TIERS[0];
    for (var i = 1; i < TIERS.length; i++) {
      if (value >= TIERS[i].min) t = TIERS[i];
    }
    return t;
  }

  function currentMultiplier() {
    return frenzyMoves > 0 ? FRENZY_MULT : tierFor(ketosis).mult;
  }

  function currentStateName() {
    return frenzyMoves > 0 ? "frenzy" : tierFor(ketosis).name;
  }

  var TIER_LABELS = {
    crash: "🍩 Carb crash — 0.5x",
    keto: "🥑 Ketosis — 2x",
    deep: "🔥 Deep ketosis — 3x"
  };

  var TIER_COLORS = {
    crash: "#ff6b6b",
    normal: "#ffd23f",
    keto: "#4ade80",
    deep: "#38bdf8",
    frenzy: "#c084fc"
  };

  function renderKetosis() {
    var state = currentStateName();
    ketosisFillEl.style.width = (state === "frenzy" ? 100 : ketosis) + "%";
    ketosisFillEl.style.background = TIER_COLORS[state];
    if (state === "frenzy") {
      ketosisLabelEl.textContent = "⚡ Fat-adapted — 4x · " + frenzyMoves
        + (frenzyMoves === 1 ? " move" : " moves");
    } else {
      ketosisLabelEl.textContent = TIER_LABELS[state] || ("Ketosis " + ketosis + "%");
    }
  }

  // Fires the banner + sound when the meter crosses a band. Called after any
  // meter change — cascade gains, per-move drain, or frenzy expiry — so a
  // tier lost to upkeep announces itself the same way one lost to carbs does.
  function syncKetosisState(announce) {
    var next = currentStateName();
    if (next === ketosisState) return false;
    var prev = ketosisState;
    ketosisState = next;
    document.body.classList.toggle("ketosis", next === "keto");
    document.body.classList.toggle("deep", next === "deep");
    document.body.classList.toggle("carbcrash", next === "crash");
    document.body.classList.toggle("frenzy", next === "frenzy");
    if (!announce) return true;
    // Only a tier *reached* pays moves. Sliding back down into ketosis from
    // deep crosses the same boundary and must not claim a refund it didn't get.
    var bonus = pendingRefund > 0 ? " · +" + pendingRefund + " moves" : "";
    pendingRefund = 0;
    if (next === "frenzy") {
      frenzyInSound();
      // The 4x is already under the bar for the whole frenzy; the carb
      // immunity is stated nowhere else, so it keeps the banner slot.
      setStatus("⚡ Fat-adapted!" + bonus.replace(" · ", " ") + " · carbs can't touch you");
    } else if (prev === "frenzy") {
      frenzyOutSound();
      setStatus("Back down to ketosis");
    } else if (next === "deep") {
      ketosisInSound();
      setStatus("🔥 Deep ketosis — 3x" + bonus);
    } else if (next === "keto") {
      ketosisInSound();
      setStatus("🥑 Ketosis — 2x" + bonus);
    } else if (next === "crash") {
      ketosisOutSound();
      setStatus("🍩 Carb crash — 0.5x");
    } else {
      ketosisOutSound();
      setStatus("Out of ketosis");
    }
    return true;
  }

  function resetKetosis() {
    ketosis = KETOSIS_START;
    ketosisState = "normal";
    frenzyMoves = 0;
    frenzyJustStarted = false;
    movesLeft = MOVE_BUDGET;
    movesTaken = 0;
    armKeto = KETOSIS_START < 70;
    armDeep = KETOSIS_START < 85;
    pendingRefund = 0;
    document.body.classList.remove("ketosis", "deep", "carbcrash", "frenzy");
    movesEl.classList.remove("gain");
    renderMoves();
    renderKetosis();
  }

  // ---- layout --------------------------------------------------------------
  function computeLayout() {
    var maxBoardWidth = Math.min(window.innerWidth - 24, 460);
    var cell = Math.floor((maxBoardWidth - GAP * (N - 1)) / N);
    if (cell < 44) cell = 44; // hard floor: minimum 44x44 tap target
    CELL = cell;
    var boardWidth = CELL * N + GAP * (N - 1);
    boardEl.style.width = boardWidth + "px";
    boardEl.style.height = boardWidth + "px";
    boardEl.style.setProperty("--cell", CELL + "px");

    for (var row = 0; row < N; row++) {
      for (var col = 0; col < N; col++) {
        var t = grid[row] && grid[row][col];
        if (t) setTilePosition(t, false);
      }
    }
  }

  var resizeTimer = null;
  window.addEventListener("resize", function () {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(computeLayout, 120);
  });

  // ---- tile helpers ----------------------------------------------------
  function randomIcon() {
    return ICONS[Math.floor(Math.random() * ICONS.length)];
  }

  function newTile(row, col, icon) {
    var el = document.createElement("div");
    el.className = "tile" + (icon === "🍖" ? " meat" : icon === "🧀" ? " cheese" : "");
    el.textContent = icon;
    boardEl.appendChild(el);
    var t = { id: nextId++, row: row, col: col, icon: icon, el: el, type: "normal" };
    el.dataset.row = row;
    el.dataset.col = col;
    return t;
  }

  function setTilePosition(t, animate) {
    if (!animate) t.el.style.transition = "none";
    t.el.style.transform =
      "translate3d(" + (t.col * (CELL + GAP)) + "px," + (t.row * (CELL + GAP)) + "px,0)";
    if (!animate) {
      void t.el.offsetWidth;
      t.el.style.transition = "";
    }
  }

  function markSpecial(t, kind) {
    if (t.type === kind) return;
    if (t.type !== "normal" && t.type !== kind) kind = "cross";
    t.type = kind;
    t.el.classList.remove("special-row", "special-col", "special-cross");
    t.el.classList.add("special-" + kind);
  }

  // ---- board generation --------------------------------------------------
  function wouldMatch(row, col, icon) {
    if (col >= 2) {
      var a = grid[row][col - 1], b = grid[row][col - 2];
      if (a && b && a.icon === icon && b.icon === icon) return true;
    }
    if (row >= 2) {
      var c = grid[row - 1][col], d = grid[row - 2][col];
      if (c && d && c.icon === icon && d.icon === icon) return true;
    }
    return false;
  }

  function generateBoard() {
    do {
      while (boardEl.firstChild) boardEl.removeChild(boardEl.firstChild);
      grid = [];
      for (var row = 0; row < N; row++) {
        grid.push([]);
        for (var col = 0; col < N; col++) {
          var icon;
          do { icon = randomIcon(); } while (wouldMatch(row, col, icon));
          var t = newTile(row, col, icon);
          setTilePosition(t, false);
          grid[row].push(t);
        }
      }
    } while (!hasAnyMove());
  }

  // ---- matching ------------------------------------------------------------
  // Returns an array of runs: { positions: [{row,col},...], orientation: "row"|"col" }
  // for every straight run of 3+ identical icons currently on the board.
  function findMatchRuns() {
    var runs = [];
    var row, col, runStart, runIcon;

    for (row = 0; row < N; row++) {
      runStart = 0; runIcon = grid[row][0].icon;
      for (col = 1; col <= N; col++) {
        var icon = col < N ? grid[row][col].icon : null;
        if (col < N && icon === runIcon) continue;
        if (col - runStart >= 3) {
          var positions = [];
          for (var k = runStart; k < col; k++) positions.push({ row: row, col: k });
          runs.push({ positions: positions, orientation: "row" });
        }
        runStart = col; runIcon = icon;
      }
    }

    for (col = 0; col < N; col++) {
      runStart = 0; runIcon = grid[0][col].icon;
      for (row = 1; row <= N; row++) {
        var icon2 = row < N ? grid[row][col].icon : null;
        if (row < N && icon2 === runIcon) continue;
        if (row - runStart >= 3) {
          var positions2 = [];
          for (var k2 = runStart; k2 < row; k2++) positions2.push({ row: k2, col: col });
          runs.push({ positions: positions2, orientation: "col" });
        }
        runStart = row; runIcon = icon2;
      }
    }

    return runs;
  }

  function findMatches() {
    var runs = findMatchRuns();
    var seen = {};
    var out = [];
    runs.forEach(function (run) {
      run.positions.forEach(function (p) {
        var key = p.row + "," + p.col;
        if (!seen[key]) { seen[key] = true; out.push(p); }
      });
    });
    return out;
  }

  function swapEntries(a, b) {
    var ta = grid[a.row][a.col], tb = grid[b.row][b.col];
    grid[a.row][a.col] = tb; grid[b.row][b.col] = ta;
    ta.row = b.row; ta.col = b.col;
    tb.row = a.row; tb.col = a.col;
    ta.el.dataset.row = ta.row; ta.el.dataset.col = ta.col;
    tb.el.dataset.row = tb.row; tb.el.dataset.col = tb.col;
    setTilePosition(ta, true);
    setTilePosition(tb, true);
  }

  function hasAnyMove() {
    for (var row = 0; row < N; row++) {
      for (var col = 0; col < N; col++) {
        if (col + 1 < N) {
          swapCells(row, col, row, col + 1);
          var m1 = findMatches().length > 0;
          swapCells(row, col, row, col + 1);
          if (m1) return true;
        }
        if (row + 1 < N) {
          swapCells(row, col, row + 1, col);
          var m2 = findMatches().length > 0;
          swapCells(row, col, row + 1, col);
          if (m2) return true;
        }
      }
    }
    return false;
  }

  // Silent grid-only swap used for move-availability / hint probing (no DOM writes).
  function swapCells(r1, c1, r2, c2) {
    var tmp = grid[r1][c1];
    grid[r1][c1] = grid[r2][c2];
    grid[r2][c2] = tmp;
  }

  // ---- hints -----------------------------------------------------------
  // One scan evaluates every legal swap and ranks the results: a protein
  // (meat/cheese) combo beats a carb one, and within each class a bigger
  // combo beats a smaller one.
  //
  // Each candidate carries the tile objects that end up matched, captured
  // while the probe swap is in place. Those are the tiles the hint lights up:
  // the combo itself, not the tile being swapped out of its way.
  function scanMoves() {
    var bestProtein = null, bestCarb = null;
    for (var row = 0; row < N; row++) {
      for (var col = 0; col < N; col++) {
        var dirs = [];
        if (col + 1 < N) dirs.push({ row: row, col: col + 1 });
        if (row + 1 < N) dirs.push({ row: row + 1, col: col });
        for (var d = 0; d < dirs.length; d++) {
          var target = dirs[d];
          swapCells(row, col, target.row, target.col);
          var matches = findMatches();
          var tiles = matches.map(function (p) { return grid[p.row][p.col]; });
          swapCells(row, col, target.row, target.col);
          if (!matches.length) continue;
          var cand = {
            a: { row: row, col: col }, b: target,
            tiles: tiles, size: matches.length,
            protein: tiles.some(function (t) { return PROTEIN_ICONS[t.icon]; })
          };
          if (cand.protein) {
            if (!bestProtein || cand.size > bestProtein.size) bestProtein = cand;
          } else if (!bestCarb || cand.size > bestCarb.size) {
            bestCarb = cand;
          }
        }
      }
    }
    return { protein: bestProtein, carb: bestCarb };
  }

  function findHint() {
    var scan = scanMoves();
    return scan.protein || scan.carb;
  }

  function clearHint() {
    if (hintTiles) {
      hintTiles.forEach(function (t) { t.el.classList.remove("hint"); });
      hintTiles = null;
    }
  }

  function showHint() {
    if (busy || runOver) return;
    var move = findHint();
    if (!move) return;
    clearHint();
    move.tiles.forEach(function (t) { t.el.classList.add("hint"); });
    hintTiles = move.tiles;
  }

  function scheduleHint() {
    clearHint();
    if (hintTimer) clearTimeout(hintTimer);
    hintTimer = setTimeout(showHint, HINT_IDLE_MS);
  }

  // ---- resolve / cascade --------------------------------------------------
  function isAdjacent(a, b) {
    return Math.abs(a.row - b.row) + Math.abs(a.col - b.col) === 1;
  }

  function attemptSwap(a, b) {
    if (busy || runOver || !isAdjacent(a, b)) return;
    busy = true;
    clearHint();
    if (hintTimer) clearTimeout(hintTimer);
    swapEntries(a, b);
    setTimeout(function () {
      var runs = findMatchRuns();
      if (runs.length) {
        comboStep = 0;
        resolveCascade(runs);
      } else {
        failSound();
        swapEntries(a, b);
        setTimeout(function () { busy = false; scheduleHint(); }, SWAP_MS);
      }
    }, SWAP_MS);
  }

  function collapseColumn(col, spawned) {
    var existing = [];
    for (var row = 0; row < N; row++) {
      if (grid[row][col]) existing.push(grid[row][col]);
      grid[row][col] = null;
    }
    var writeRow = N - 1;
    for (var i = existing.length - 1; i >= 0; i--) {
      var t = existing[i];
      t.row = writeRow;
      t.el.dataset.row = writeRow;
      grid[writeRow][col] = t;
      setTilePosition(t, true);
      writeRow--;
    }
    var spawnIndex = 1;
    for (var row2 = writeRow; row2 >= 0; row2--) {
      var t2 = newTile(row2, col, randomIcon());
      var spawnRow = row2 - spawnIndex;
      t2.row = spawnRow;
      t2.el.dataset.row = spawnRow;
      setTilePosition(t2, false);
      grid[row2][col] = t2;
      spawned.push({ tile: t2, targetRow: row2 });
      spawnIndex++;
    }
  }

  function endRun() {
    runOver = true;
    busy = true;
    var beat = score > highScore;
    if (beat) {
      highScore = score;
      Arcade.save("highScore", highScore);
    }
    renderScoreline();
    buildCard(beat, claimRecords());
    showCard(true);
  }

  // ---- end card ------------------------------------------------------------
  // The card teaches with pictures, never sentences: the arc shows the climb
  // and the crash, the tier bar shows where the points came from, the plate
  // shows what was eaten. A player who never read the meter can see it here.

  function claimRecords() {
    var out = { move: false, combo: false, frenzies: false };
    if (run.bestMove > 0 && run.bestMove > records.move) {
      records.move = run.bestMove;
      Arcade.save("bestMove", records.move);
      out.move = true;
    }
    if (run.maxCombo >= 2 && run.maxCombo > records.combo) {
      records.combo = run.maxCombo;
      Arcade.save("bestCombo", records.combo);
      out.combo = true;
    }
    if (run.frenzies > 0 && run.frenzies > records.frenzies) {
      records.frenzies = run.frenzies;
      Arcade.save("bestFrenzies", records.frenzies);
      out.frenzies = true;
    }
    return out;
  }

  // Always a compliment or a joke, never a scold. A frenzy outranks a crash:
  // if you got there, that's the story of the run.
  function runTitle() {
    var total = run.protein + run.carb;
    var share = total ? run.protein / total : 0;
    if (run.frenzies >= 4) return "🧈 Butter Machine";
    if (run.frenzies >= 2) return "⚡ Metabolically Flexible";
    if (run.frenzies === 1) return "⚡ Fat-Adapted";
    if (run.crashed) return "🍩 Cheat Day";
    if (run.peak >= 95) return "🔥 So Close";
    if (run.peak >= 85) return "🔥 Slow Burner";
    if (run.peak >= 70) return "🥑 Keto Curious";
    if (share < 0.4) return "🍩 Carb Loader";
    return "🥓 Warming Up";
  }

  var STATE_EMOJI = { crash: "🍩", normal: "⬜", keto: "🥑", deep: "🔥", frenzy: "⚡" };
  var LEGEND = [
    ["crash", "crash"], ["normal", "normal"], ["keto", "keto"],
    ["deep", "deep"], ["frenzy", "fat-adapted"]
  ];

  function buildArc() {
    var h = run.history, n = h.length;
    var H = 40;
    while (arcEl.firstChild) arcEl.removeChild(arcEl.firstChild);
    arcEl.setAttribute("viewBox", "0 0 " + Math.max(n, 1) + " " + H);
    // Bars get a gap while there's room for one; a long run packs solid so
    // the arc reads as a shape instead of a picket fence.
    var w = n <= 60 ? 0.78 : 1;
    for (var i = 0; i < n; i++) {
      var bar = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      var height = Math.max(1.5, h[i].k / 100 * H);
      bar.setAttribute("x", i + (1 - w) / 2);
      bar.setAttribute("y", H - height);
      bar.setAttribute("width", w);
      bar.setAttribute("height", height);
      bar.setAttribute("fill", TIER_COLORS[h[i].s]);
      arcEl.appendChild(bar);
    }
    var worst = run.worstCarb;
    arcMarkEl.hidden = worst.move < 0;
    if (worst.move >= 0) arcMarkEl.style.left = ((worst.move + 0.5) / n * 100) + "%";
  }

  function highlightRow(label, value, record) {
    var row = document.createElement("div");
    row.className = "hl reveal";
    var lbl = document.createElement("span");
    lbl.className = "lbl";
    lbl.textContent = label;
    var val = document.createElement("b");
    val.textContent = value;
    var rec = document.createElement("span");
    rec.className = "rec";
    rec.textContent = record ? "🏆" : "";
    rec.setAttribute("aria-label", record ? "new record" : "");
    row.appendChild(lbl); row.appendChild(val); row.appendChild(rec);
    return row;
  }

  function frenzyGlyphs(n) {
    if (!n) return "—";
    var s = "";
    for (var i = 0; i < Math.min(n, 5); i++) s += "⚡";
    return n > 5 ? s + " ×" + n : s;
  }

  var cardBeat = false; // whether the card on screen is a new best

  function buildCard(beat, recs) {
    cardBeat = beat;
    $("card-date").textContent = new Date().toLocaleDateString(undefined, { month: "short", day: "numeric" });
    buildArc();

    var legend = $("legend");
    legend.innerHTML = "";
    LEGEND.forEach(function (pair) {
      var item = document.createElement("span");
      var dot = document.createElement("i");
      dot.style.background = TIER_COLORS[pair[0]];
      item.appendChild(dot);
      item.appendChild(document.createTextNode(pair[1]));
      legend.appendChild(item);
    });

    var why = $("card-why");
    why.textContent = beat ? "🎉 New best!" : (movesLeft <= 0 ? "Out of moves" : "Board locked");
    why.className = "card-why" + (beat ? " best" : "");
    cardScoreEl.textContent = "0";

    var tierbar = $("tierbar");
    tierbar.innerHTML = "";
    ["crash", "normal", "keto", "deep", "frenzy"].forEach(function (tier) {
      var pts = run.byTier[tier];
      if (!pts) return;
      var seg = document.createElement("span");
      seg.style.flexGrow = pts;
      seg.style.background = TIER_COLORS[tier];
      tierbar.appendChild(seg);
    });

    // The stretch is the brag: it's the part of the run the meter bought.
    var earned = movesTaken - MOVE_BUDGET;
    $("card-moves").innerHTML = "<b>" + movesTaken + "</b>" + (movesTaken === 1 ? " move" : " moves")
      + (earned > 0 ? " · " + MOVE_BUDGET + " + <b>" + earned + "</b> earned" : "");

    var total = run.protein + run.carb;
    var pct = total ? Math.round(run.protein / total * 100) : 0;
    $("plate-protein").textContent = pct + "%";
    $("plate-carb").textContent = (100 - pct) + "%";
    $("plate-fill").style.width = pct + "%";

    var hl = $("highlights");
    hl.innerHTML = "";
    hl.appendChild(highlightRow("Biggest move", run.bestMove.toLocaleString(), recs.move));
    hl.appendChild(highlightRow("Longest cascade", "x" + Math.max(run.maxCombo, 1), recs.combo));
    hl.appendChild(highlightRow("Fat-adapted", frenzyGlyphs(run.frenzies), recs.frenzies));

    $("card-title").textContent = runTitle();
    $("card-foot").textContent = "Best " + highScore.toLocaleString() + " · lifetime "
      + cleared.toLocaleString() + " tiles · " + frenzies.toLocaleString() + " fat-adapted";
    cardHintEl.textContent = "";
  }

  // ---- ceremony ------------------------------------------------------------
  // Card rises; the arc draws while the score counts up; the stats fade in
  // one by one; the title stamps; the buttons arrive last. A tap anywhere
  // skips to the end. Reduced motion goes straight there.
  var ceremony = { timers: [], raf: null, active: false };

  function at(ms, fn) { ceremony.timers.push(setTimeout(fn, ms)); }

  function countUp(duration) {
    var start = null, lastTick = 0;
    function frame(now) {
      if (start === null) start = now;
      var p = Math.min(1, (now - start) / duration);
      var eased = 1 - Math.pow(1 - p, 3);
      cardScoreEl.textContent = Math.round(score * eased).toLocaleString();
      if (score > 0 && now - lastTick > 70 && p < 1) {
        lastTick = now;
        tone(440 + 520 * eased, 0.04, 0, 0.045);
      }
      if (p < 1) ceremony.raf = requestAnimationFrame(frame);
      else ceremony.raf = null;
    }
    ceremony.raf = requestAnimationFrame(frame);
  }

  function finishCeremony() {
    ceremony.timers.forEach(clearTimeout);
    ceremony.timers = [];
    if (ceremony.raf) cancelAnimationFrame(ceremony.raf);
    ceremony.raf = null;
    ceremony.active = false;
    cardScoreEl.textContent = score.toLocaleString();
    cardEl.classList.add("done");
  }

  function showCard(animate) {
    runoverEl.classList.remove("show");
    overlayEl.classList.add("show");
    void overlayEl.offsetWidth; // let display:flex land before the fade starts
    overlayEl.classList.add("in");
    overlayEl.scrollTop = 0;
    if (!animate || reducedMotion) { finishCeremony(); return; }

    cardEl.classList.remove("done");
    arcClipEl.classList.remove("in");
    var reveals = cardEl.querySelectorAll(".reveal");
    Array.prototype.forEach.call(reveals, function (el) { el.classList.remove("in"); });
    ceremony.active = true;

    at(350, function () { arcClipEl.classList.add("in"); countUp(1100); });
    var t = 1550;
    Array.prototype.forEach.call(reveals, function (el) {
      var stamp = el.classList.contains("stamp");
      if (stamp) t += 200;
      (function (el, stamp) {
        at(t, function () {
          el.classList.add("in");
          if (stamp) { if (cardBeat) frenzyInSound(); else ketosisInSound(); }
        });
      })(el, stamp);
      t += stamp ? 400 : 140;
    });
    at(t, finishCeremony);
  }

  function hideCard() {
    overlayEl.classList.remove("in", "show");
    cardEl.classList.add("done");
  }

  overlayEl.addEventListener("pointerdown", function () {
    if (ceremony.active) finishCeremony();
  });

  // ---- share ---------------------------------------------------------------
  // The arc compressed to a Wordle-style strip: at most 16 emoji, each the
  // tier held for most of its slice of the run.
  function arcEmoji() {
    var h = run.history, n = h.length;
    var buckets = Math.min(n, 16), out = "";
    for (var b = 0; b < buckets; b++) {
      var from = Math.floor(b * n / buckets), to = Math.floor((b + 1) * n / buckets);
      var counts = {}, best = null;
      for (var i = from; i < to; i++) {
        var s = h[i].s;
        counts[s] = (counts[s] || 0) + 1;
        if (!best || counts[s] >= counts[best]) best = s;
      }
      out += STATE_EMOJI[best] || "⬜";
    }
    return out;
  }

  function shareText() {
    return "🍖 Keto Krush · " + score.toLocaleString() + "\n"
      + arcEmoji() + "\n"
      + movesTaken + " moves"
      + (run.frenzies ? " · ⚡×" + run.frenzies : "")
      + " · " + runTitle();
  }

  $("share").addEventListener("click", function () {
    var text = shareText();
    function copied() { cardHintEl.textContent = "Copied — paste it in the chat"; }
    function fallback() { cardHintEl.textContent = "Screenshot the card to share it"; }
    if (navigator.share) {
      navigator.share({ text: text }).catch(function () { /* user cancelled */ });
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(copied, fallback);
    } else {
      fallback();
    }
  });

  $("seeboard").addEventListener("click", function () {
    hideCard();
    runoverEl.classList.add("show");
  });

  $("showcard").addEventListener("click", function () { showCard(false); });

  // Charged once per resolved move — never per cascade step, since taxing a
  // cascade would punish the best outcome in the game. Holding a high tier
  // costs more than holding a low one, so a keto chain has to be sustained
  // rather than merely reached.
  function endOfMove() {
    if (frenzyMoves > 0) {
      if (frenzyJustStarted) {
        frenzyJustStarted = false;
      } else {
        frenzyMoves--;
        if (frenzyMoves === 0) ketosis = FRENZY_LAND; // you earned base ketosis
      }
    } else if (ketosis > KETOSIS_DRAIN_FLOOR) {
      // Upkeep is ambient — your metabolism runs whatever the board offers.
      ketosis = Math.max(KETOSIS_DRAIN_FLOOR, ketosis - tierFor(ketosis).drain);
    }
    // Re-arms the tier refunds as the meter falls. Drain and frenzy expiry only
    // ever lower it, so nothing can be paid out here — this is arming only.
    payRefunds();
    movesLeft--;
    movesTaken++;
    renderMoves();
    syncKetosisState(true);
    pendingRefund = 0; // never let an unannounced refund leak into the next move
    renderKetosis();

    // One bar of the card's run arc per resolved move, plus the per-move
    // bests. The worst carb move only counts if it cost at least a full carb
    // 3-match, so a stray carb swept up in a cascade doesn't get the marker.
    var state = currentStateName();
    run.history.push({ k: state === "frenzy" ? 100 : ketosis, s: state });
    if (run.movePts > run.bestMove) run.bestMove = run.movePts;
    run.movePts = 0;
    if (run.carbLoss >= 3 * KETOSIS_CARB_LOSS && run.carbLoss > run.worstCarb.loss) {
      run.worstCarb = { move: run.history.length - 1, loss: run.carbLoss };
    }
    run.carbLoss = 0;
  }

  function resolveCascade(runs) {
    function step(currentRuns) {
      comboStep++;

      // Which positions clear this step, and which become new special tiles.
      var clearedSet = {};
      var newSpecials = {};
      currentRuns.forEach(function (run) {
        run.positions.forEach(function (p) { clearedSet[p.row + "," + p.col] = true; });
        if (run.positions.length >= 4) {
          var mid = run.positions[Math.floor(run.positions.length / 2)];
          var key = mid.row + "," + mid.col;
          var kind = run.orientation === "row" ? "row" : "col";
          if (newSpecials[key] && newSpecials[key] !== kind) newSpecials[key] = "cross";
          else if (!newSpecials[key]) newSpecials[key] = kind;
        }
      });

      // Chain-activate any existing special tiles swept up in this clear.
      var queue = Object.keys(clearedSet);
      var qi = 0;
      var triggeredSpecial = false;
      while (qi < queue.length) {
        var key = queue[qi++];
        var parts = key.split(",");
        var r = Number(parts[0]), c = Number(parts[1]);
        var t = grid[r] && grid[r][c];
        if (!t || newSpecials[key]) continue; // fresh specials-in-the-making don't self-detonate
        if (t.type === "row" || t.type === "cross") {
          triggeredSpecial = true;
          for (var cc = 0; cc < N; cc++) {
            var k2 = r + "," + cc;
            if (!clearedSet[k2]) { clearedSet[k2] = true; queue.push(k2); }
          }
        }
        if (t.type === "col" || t.type === "cross") {
          triggeredSpecial = true;
          for (var rr = 0; rr < N; rr++) {
            var k3 = rr + "," + c;
            if (!clearedSet[k3]) { clearedSet[k3] = true; queue.push(k3); }
          }
        }
      }

      var gained = 0, proteinCount = 0, carbCount = 0;
      Object.keys(clearedSet).forEach(function (key) {
        var parts = key.split(",");
        var t = grid[Number(parts[0])][Number(parts[1])];
        if (!t) return;
        gained++;
        if (PROTEIN_ICONS[t.icon]) proteinCount++; else carbCount++;
      });
      cleared += gained;

      // Score at the tier you were holding when you committed this clear,
      // BEFORE the meter reacts to it. Order matters more than it looks: if
      // the meter moved first, a carb run taken from deep ketosis would lose
      // the tier *and* score at the lower one — a double penalty that makes
      // carbs strictly worse and kills the temptation the rush exists to
      // create. Sugar rush: an all-carb clear pays 50% more right now,
      // against the compounding tier you give up to take it.
      var rush = (gained > 0 && proteinCount === 0) ? SUGAR_RUSH : 1;
      var pts = Math.round(gained * POINTS_PER_TILE * comboStep * currentMultiplier() * rush);
      score += pts;
      // Card bookkeeping. The tier is read here, before the meter reacts, for
      // the same reason the multiplier is: it's the tier these points were
      // earned at.
      run.movePts += pts;
      run.byTier[currentStateName()] += pts;
      run.protein += proteinCount;
      run.carb += carbCount;
      if (comboStep > run.maxCombo) run.maxCombo = comboStep;

      // Then pay the metabolic price. Gains always land; losses don't while
      // Fat-Adapted (you burn carbs). There is deliberately no waiver for a
      // board with no protein move: a protein-starved board is the result of
      // the protein you already spent, and waiving carbs there let runs coast
      // far past the budget's intent (playtest: "almost always enough keto
      // options to stay afloat").
      if (frenzyMoves === 0) {
        var loss = carbCount * KETOSIS_CARB_LOSS;
        ketosis = Math.max(0, Math.min(100, ketosis + proteinCount * KETOSIS_PROTEIN_GAIN - loss));
        run.carbLoss += loss;
        if (ketosis > run.peak) run.peak = ketosis;
        if (tierFor(ketosis).name === "crash") run.crashed = true;
        if (ketosis >= 100) {
          frenzyMoves = FRENZY_MOVES;
          frenzyJustStarted = true; // the triggering move shouldn't burn a turn
          frenzies++;
          run.frenzies++;
          grantMoves(REFUND.frenzy);
          armKeto = false; // the climb is paid out; re-arm on the way back down
          armDeep = false;
        } else {
          payRefunds();
        }
      }

      renderScoreline();
      renderKetosis();

      if (triggeredSpecial) specialSound(); else matchSound();
      if (!syncKetosisState(true)) {
        if (comboStep > 1) setStatus("🔥 x" + comboStep + " combo!");
        else if (rush > 1) setStatus("🍩 Sugar rush +50%");
      }

      var cols = {};
      var toRemove = [];
      Object.keys(clearedSet).forEach(function (key) {
        var parts = key.split(",");
        var r = Number(parts[0]), c = Number(parts[1]);
        if (newSpecials[key]) {
          markSpecial(grid[r][c], newSpecials[key]);
          return; // stays on the board, converted rather than cleared
        }
        var t = grid[r][c];
        if (!t) return;
        t.el.style.transform = t.el.style.transform + " scale(0.3)";
        t.el.style.opacity = "0";
        toRemove.push(t.el);
        grid[r][c] = null;
        cols[c] = true;
      });

      setTimeout(function () {
        toRemove.forEach(function (el) { el.remove(); });

        var spawned = [];
        Object.keys(cols).forEach(function (colKey) { collapseColumn(Number(colKey), spawned); });

        requestAnimationFrame(function () {
          spawned.forEach(function (s) {
            s.tile.row = s.targetRow;
            s.tile.el.dataset.row = s.targetRow;
            setTilePosition(s.tile, true);
          });
        });

        setTimeout(function () {
          var next = findMatchRuns();
          if (next.length) {
            step(next);
          } else {
            endOfMove();
            Arcade.save("cleared", cleared);
            Arcade.save("frenzies", frenzies);
            renderStats();
            if (movesLeft <= 0 || !hasAnyMove()) {
              busy = false;
              endRun();
            } else {
              busy = false;
              scheduleHint();
            }
          }
        }, FALL_MS);
      }, CLEAR_MS);
    }
    step(runs);
  }

  // ---- input ---------------------------------------------------------------
  function coordsFromEl(el) {
    return { row: Number(el.dataset.row), col: Number(el.dataset.col) };
  }

  function select(coord) {
    if (selected) grid[selected.row][selected.col].el.classList.remove("selected");
    selected = coord;
    grid[coord.row][coord.col].el.classList.add("selected");
  }

  function deselect() {
    if (selected) grid[selected.row][selected.col].el.classList.remove("selected");
    selected = null;
  }

  var SWIPE_THRESHOLD = 20;

  boardEl.addEventListener("pointerdown", function (e) {
    clearHint();
    if (hintTimer) clearTimeout(hintTimer);
    var el = e.target.closest(".tile");
    if (!el || busy || runOver) return;
    el.setPointerCapture(e.pointerId);
    pointerStart = { x: e.clientX, y: e.clientY, coord: coordsFromEl(el) };
  });

  boardEl.addEventListener("pointerup", function (e) {
    if (!pointerStart) return;
    var start = pointerStart;
    pointerStart = null;
    if (busy || runOver) return;

    var dx = e.clientX - start.x;
    var dy = e.clientY - start.y;
    var dist = Math.sqrt(dx * dx + dy * dy);

    if (dist >= Math.max(SWIPE_THRESHOLD, CELL * 0.35)) {
      var dir;
      if (Math.abs(dx) > Math.abs(dy)) dir = dx > 0 ? { row: 0, col: 1 } : { row: 0, col: -1 };
      else dir = dy > 0 ? { row: 1, col: 0 } : { row: -1, col: 0 };
      var target = { row: start.coord.row + dir.row, col: start.coord.col + dir.col };
      if (target.row >= 0 && target.row < N && target.col >= 0 && target.col < N) {
        deselect();
        attemptSwap(start.coord, target);
      }
      return;
    }

    // tap
    var tapped = start.coord;
    if (!selected) {
      select(tapped);
    } else if (selected.row === tapped.row && selected.col === tapped.col) {
      deselect();
    } else if (isAdjacent(selected, tapped)) {
      var a = selected;
      deselect();
      attemptSwap(a, tapped);
    } else {
      select(tapped);
    }
  });

  function restartRun() {
    finishCeremony();
    hideCard();
    runOver = false;
    runoverEl.classList.remove("show");
    score = 0;
    comboStep = 0;
    renderScoreline();
    generateBoard();
    resetKetosis();
    resetRun();
    busy = false;
    scheduleHint();
  }

  $("restart").addEventListener("click", restartRun);
  $("again").addEventListener("click", restartRun);

  // ---- boot ------------------------------------------------------------
  function start() {
    renderMute();
    computeLayout();
    generateBoard();
    renderStats();
    renderScoreline();
    resetKetosis();
    resetRun();
    busy = false;
    scheduleHint();
  }

  Arcade.boot(start);
</script>
</body>
</html>
