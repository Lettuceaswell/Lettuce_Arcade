<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lettuce Slots — Lettuce Arcade</title>
<meta name="theme-color" content="#083734">
<link rel="stylesheet" href="/shared/arcade.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    text-align: center;
    padding:
      calc(56px + var(--safe-top))
      calc(16px + var(--safe-right))
      calc(32px + var(--safe-bottom))
      calc(16px + var(--safe-left));
  }

  /* margin:auto centres when there's room and never clips the top when there isn't. */
  main {
    margin: auto 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 100%;
  }

  h1 { font-size: 1.3rem; letter-spacing: 0.02em; }

  /* Mode pill: top of the page, far from the thumb, so a small child on the
     SPIN button never reaches it. Each half is a full 44px target. */
  #modes {
    display: inline-flex;
    padding: 3px;
    border-radius: 14px;
    background: rgba(0, 0, 0, 0.35);
  }
  #modes button {
    min-height: 44px;
    min-width: 76px;
    padding: 8px 18px;
    border: none;
    border-radius: 11px;
    background: transparent;
    color: var(--fg-dim);
    font-size: 1rem;
    font-weight: 800;
    letter-spacing: 0.03em;
    cursor: pointer;
  }
  #modes button.on { background: var(--accent); color: #fff; }
  #modes button:disabled { opacity: 0.6; cursor: default; }

  #sub { font-size: 0.95rem; color: var(--fg-dim); font-weight: 600; }
  #sub b { color: var(--fg); }

  /* Spin mode: the run's counter and SERVE go away; the readout and footer
     carry the lifetime stats instead. */
  body.mode-spin #sub,
  body.mode-spin #serve { display: none; }

  .stage { position: relative; margin-top: 4px; }
  .reels { display: flex; gap: 10px; }

  .reel {
    width: clamp(84px, 28vw, 110px);
    height: clamp(92px, 29vw, 118px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(52px, 17vw, 72px);
    line-height: 1;
    background: var(--bg-elevated);
    border-radius: 16px;
    border: 3px solid transparent;
    transition: opacity 120ms;
  }
  .reel.hot { border-color: #ffe066; }
  .reel.hot.leaf { border-color: #7dff9a; box-shadow: 0 0 18px rgba(125, 255, 154, 0.35); }
  .reel.bunny { border-color: #ff8a7a; }
  .reel.fade { opacity: 0.35; }
  /* The two matched reels breathe while the third one crawls. */
  .reel.breathe { animation: breathe 0.9s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.07); }
  }
  /* The bunny sliding past on a lettuce near-miss. */
  .reel.pass { animation: pass 260ms ease-out; }
  @keyframes pass {
    0%   { border-color: #ff8a7a; background: #7a3a38; }
    100% { border-color: transparent; }
  }

  /* Floats over the reels so it can be loud without moving anything. */
  .payout {
    position: absolute;
    left: 0; right: 0; bottom: calc(100% - 10px);
    font-size: clamp(40px, 13vw, 60px);
    font-weight: 900;
    line-height: 1;
    opacity: 0;
    pointer-events: none;
    text-shadow: 0 3px 14px rgba(0, 0, 0, 0.6);
  }
  .payout.jackpot { color: #ffe066; }
  .payout.match { color: #eafffb; }
  .payout.bust { color: #ff8a7a; }
  .payout.pop { animation: payout-pop 1.15s ease-out forwards; }
  @keyframes payout-pop {
    0%   { opacity: 0; transform: translateY(30%) scale(0.5); }
    18%  { opacity: 1; transform: translateY(-10%) scale(1.3); }
    34%  { opacity: 1; transform: translateY(-4%) scale(1.05); }
    100% { opacity: 0; transform: translateY(-70%) scale(1.02); }
  }

  /* Heartbeat: one dot lights per reel tick, slowing with the tension tail. */
  #ticks { display: flex; gap: 7px; height: 8px; margin-top: 2px; }
  #ticks i {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.12);
    transition: background 90ms, transform 90ms;
  }
  #ticks i.on { background: var(--accent); transform: scale(1.35); }
  #ticks.hot i.on { background: #ffe066; }
  #ticks.leaf i.on { background: #7dff9a; }

  /* Run only: the last sixteen spins, live, same glyphs as the end card. */
  #hist {
    height: 1.3rem;
    font-size: 1rem;
    line-height: 1.3rem;
    letter-spacing: 0.06em;
    color: var(--fg-dim);
    opacity: 0.85;
  }
  body.mode-spin #hist { display: none; }

  /* Fixed height so results never reflow the reels. */
  #status {
    height: 2.6rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--fg-dim);
  }
  #status.jackpot { color: #ffe066; font-size: 1.3rem; }
  #status.match   { color: var(--accent); }
  #status.near    { color: #ffb4a2; }
  #status.leaf    { color: #7dff9a; font-size: 1.2rem; }
  #status.legend  { color: var(--fg-dim); opacity: 0.6; font-weight: 600; font-size: 0.95rem; }
  #status.bust    { color: #ff8a7a; }
  #status.serve   { color: var(--accent); }

  #readout { font-size: 1rem; color: var(--fg-dim); }
  #readout b { color: var(--fg); font-size: 1.15rem; }
  #readout .bowl { display: inline-block; }
  #readout .bowl.wobble { animation: wobble 0.5s ease-in-out infinite; }
  #readout .bowl.hop { animation: hop 320ms ease-out; }
  @keyframes wobble {
    0%, 100% { transform: rotate(-12deg); }
    50%      { transform: rotate(12deg); }
  }
  @keyframes hop {
    0%   { transform: translateY(0) scale(1); }
    40%  { transform: translateY(-8px) scale(1.25); }
    100% { transform: translateY(0) scale(1); }
  }

  /* Thin bars: spins left under the counter, ladder progress above the footer. */
  .bar {
    width: min(360px, 82vw);
    height: 5px;
    border-radius: 3px;
    background: rgba(0, 0, 0, 0.35);
    overflow: hidden;
  }
  .bar i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 3px;
    background: var(--accent);
    transition: width 320ms ease-out;
  }
  #sub { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  #ladder i { background: #ffe066; }
  #footer-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #footer.pulse { animation: footer-pulse 700ms ease-out; }
  @keyframes footer-pulse {
    0%   { transform: scale(1); color: var(--fg-dim); }
    30%  { transform: scale(1.12); color: #ffe066; }
    100% { transform: scale(1); }
  }
  body.mode-spin #ladder { display: none; }

  /* The bowl on its way from SERVE to the served total. */
  .fly {
    position: fixed;
    z-index: 9997;
    font-size: 1.4rem;
    font-weight: 900;
    color: #ffe066;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    pointer-events: none;
    transition: transform 520ms cubic-bezier(0.2, 0.7, 0.3, 1), opacity 520ms;
  }

  #serve, #spin {
    width: min(360px, 82vw);
    font-weight: 800;
    letter-spacing: 0.04em;
  }
  #serve { height: 60px; font-size: 1.2rem; background: var(--bg-elevated); }
  #serve:disabled { opacity: 0.35; }
  #spin { height: 72px; font-size: 1.5rem; transition: background 120ms; }
  /* Mid-spin the button stays live: a tap stops the next reel. */
  #spin.stop { background: var(--bg-elevated); letter-spacing: 0.12em; }
  #spin.stop.beat { animation: beat 140ms ease-out; }
  @keyframes beat {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.035); }
    100% { transform: scale(1); }
  }

  #footer { font-size: 0.95rem; color: var(--fg-dim); font-weight: 600; }
  #footer b { color: var(--fg); }

  #mute {
    position: fixed;
    top: calc(8px + var(--safe-top));
    right: calc(60px + var(--safe-right)); /* the shared ☰ menu sits at 8px */
    min-height: 44px; min-width: 44px;
    font-size: 1.2rem;
    background: rgba(0, 0, 0, 0.5);
    z-index: 9999;
  }

  /* Cards: full-screen so nothing underneath stays tappable. */
  #card {
    position: fixed; inset: 0;
    background: rgba(8, 55, 52, 0.97);
    display: none;
    align-items: center;
    justify-content: center;
    padding: calc(56px + var(--safe-top)) 20px calc(24px + var(--safe-bottom));
    z-index: 9998;
    overflow-y: auto;
  }
  #card.show { display: flex; }
  .box {
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    text-align: center;
  }
  .box h2 { font-size: 1.6rem; line-height: 1.2; }
  .box .big { font-size: 2rem; font-weight: 900; }
  .box .tier { font-size: 1.4rem; font-weight: 800; color: #ffe066; }
  .box p { color: var(--fg-dim); font-size: 1rem; }
  .box ul { text-align: left; color: var(--fg); padding-left: 1.2em; font-size: 1rem; }
  .box li { margin: 6px 0; }
  .box .btn { width: 100%; min-height: 64px; font-size: 1.25rem; font-weight: 800; }
  .box .btn.quiet { background: var(--bg-elevated); }

  /* The end card proper: a bordered panel inside the sheet so a screenshot
     has an edge, a date, and a footer that says where it came from. */
  .box .panel {
    width: 100%;
    background: #052926;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 18px;
    padding: 14px 16px 12px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .box .panel-top { width: 100%; display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--fg-dim); }
  .box .panel-top .game { color: var(--fg); font-weight: 700; }
  .box .why { font-size: 0.9rem; color: var(--fg-dim); margin-bottom: -4px; }
  .box .why.best { color: #ffe066; font-weight: 700; }
  .box .strip { font-size: 1.25rem; line-height: 1.3; letter-spacing: 0.04em; word-break: break-all; }
  .box .foot { font-size: 0.72rem; color: var(--fg-dim); opacity: 0.75; }
  .box .hint { font-size: 0.8rem; color: var(--fg-dim); min-height: 1.1em; }
  .box .row { display: flex; gap: 8px; width: 100%; }
  .box .row .btn { flex: 1; min-height: 56px; font-size: 1.1rem; padding-left: 8px; padding-right: 8px; }

  @media (prefers-reduced-motion: reduce) {
    .payout.pop { animation: none; opacity: 1; }
    .reel.breathe, .reel.pass, #readout .bowl.wobble, #readout .bowl.hop,
    #spin.stop.beat, #footer.pulse { animation: none; }
    .fly { transition: none; }
  }
</style>
</head>
<body>
<main>
  <h1>🥬 Lettuce Slots</h1>
  <div id="modes" role="tablist" aria-label="Mode">
    <button id="mode-spin" role="tab" aria-selected="true">Spin</button>
    <button id="mode-run" role="tab" aria-selected="false">Run</button>
  </div>
  <div id="sub"><b id="spins-left"></b><div class="bar" id="spinbar" aria-hidden="true"><i></i></div></div>

  <div class="stage" aria-hidden="true">
    <div class="reels">
      <div class="reel" id="reel0">🥬</div>
      <div class="reel" id="reel1">🍅</div>
      <div class="reel" id="reel2">🥕</div>
    </div>
    <div class="payout" id="payout"></div>
  </div>
  <div id="ticks" aria-hidden="true"></div>
  <div id="hist" aria-hidden="true"></div>

  <div id="status" aria-live="polite"></div>
  <div id="readout"></div>

  <button id="serve" class="btn" disabled>SERVE 0</button>
  <button id="spin" class="btn">SPIN</button>

  <div id="footer-wrap">
    <div class="bar" id="ladder" aria-hidden="true"><i></i></div>
    <div id="footer"></div>
  </div>
</main>

<button id="mute" class="btn" aria-label="Mute sound">🔊</button>
<div id="card" role="dialog" aria-modal="true"><div class="box" id="box"></div></div>

<script src="/shared/arcade.js"></script>
<script>
  Arcade.backButton();

  // ---- constants --------------------------------------------------------
  var SYMBOLS = ["🍅", "🥕", "🧀", "🫒", "🥬"];          // reels 1 and 2, and reel 3 in Spin
  var STRIP3_RUN = ["🍅", "🥕", "🧀", "🫒", "🥬", "🐰"]; // reel 3 in Run: the bunny lives here
  var LETTUCE = 4;
  var BUNNY = 5;
  var SPINS = 75;
  var LADDER = [
    { at: 0, name: "Side salad" },
    { at: 100, name: "Garden salad" },
    { at: 200, name: "Chef's salad" },
    { at: 300, name: "Feast" },
    { at: 450, name: "Legendary" }
  ];
  // Three lines on the start card, zero taps to read.
  var RULES = [
    "Every spin adds more than the last.",
    "The 🐰 eats the bowl. SERVE keeps it.",
    SPINS + " spins. Whatever's left at the end is served."
  ];
  // The whole rulebook, behind the ☰ menu, for whoever asks. Two modes, two
  // sections: the pill at the top of the screen switches between them.
  var HELP = [
    "# Any time",
    "Tap SPIN again while the reels turn to stop the next one. What lands was decided the moment you spun.",
    "# Spin",
    "The toy. Just spin — nothing is at stake and nothing ends.",
    "One point a spin, fifty for a match, five hundred for 🥬🥬🥬.",
    "Points add up forever. No bunny in this mode.",
    "# Run",
    "The game. " + SPINS + " spins, then it's over.",
    "Every spin adds more to the bowl than the last: +1, +2, +3…",
    "SERVE keeps the bowl and starts the count again at +1.",
    "The 🐰 on the third reel eats whatever's in the bowl.",
    "A MATCH doubles the bowl. 🥬🥬🥬 triples it and adds 50.",
    "Whatever's still in the bowl after the last spin is served. Serve more than anyone."
  ];
  // First run only: the status line teaches for the first three leaves of a
  // streak, then stops for good (or after ten spins, whichever comes first).
  var COACH = [
    "+1 · every spin adds more than the last",
    "+2 · SERVE keeps the bowl",
    "+3 · the 🐰 eats it. Serve, or spin?"
  ];

  // ?turbo skips every animation and delay so the economy can be driven
  // by keyboard and measured against the GDD table. Outcomes are untouched.
  var TURBO = /[?&]turbo\b/.test(location.search);
  var REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---- tick schedules ---------------------------------------------------
  function steady(count, ms) { var a = []; for (var i = 0; i < count; i++) a.push(ms); return a; }
  var REEL1 = steady(10, 60);                                      // lands  600ms
  var REEL2 = steady(17, 60);                                      // lands 1020ms
  var REEL3_NORMAL = steady(30, 60);                               // lands 1800ms
  var REEL3_TENSION = steady(18, 60)                               // lands ~3100ms
    .concat([80, 110, 150, 200, 260, 330, 410, 500]);
  // Two lettuce is the only pair that can pay the jackpot, so it crawls longer.
  var REEL3_TENSION_LEAF = steady(18, 60)                          // lands ~3900ms
    .concat([80, 110, 150, 200, 260, 330, 410, 500, 600, 700]);
  var TENSION_TAIL_FROM = 18;
  // A tap this soon after SPIN is a double-tap, not a stop.
  var STOP_GRACE_MS = 150;
  var TICK_DOTS = 9;
  var LEGEND_SPIN = "any three +50 · 🥬🥬🥬 +500";
  var LEGEND_RUN = "any three ×2 · 🥬🥬🥬 ×3 +50 · 🐰 eats the bowl";

  // ---- audio ------------------------------------------------------------
  var muted = Arcade.load("muted", false) === true;

  function tone(freq, dur, delay, vol) {
    var ctx = Arcade.audioCtx;
    if (!ctx || muted) return;
    try {
      var t0 = ctx.currentTime + (delay || 0);
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol || 0.18, t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch (e) { /* audio unavailable; play on silently */ }
  }

  var STOP_TONES = [440, 554, 659];
  function jackpotSound() { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.3, i * 0.11, 0.22); }); }
  function matchSound() { tone(523, 0.22, 0, 0.2); tone(784, 0.26, 0.12, 0.2); }
  function serveSound(amount) {
    if (amount < 30) { tone(523, 0.2, 0, 0.16); return; }
    [523, 659, 784].forEach(function (f, i) { tone(f, 0.22, i * 0.09, 0.18); });
  }
  // Three crunches, not a buzzer.
  function bunnySound() { tone(240, 0.09, 0, 0.16); tone(180, 0.09, 0.1, 0.16); tone(130, 0.12, 0.2, 0.16); }

  // ---- elements ---------------------------------------------------------
  function $(id) { return document.getElementById(id); }
  var reelEls = [$("reel0"), $("reel1"), $("reel2")];
  var statusEl = $("status"), payoutEl = $("payout");
  var spinBtn = $("spin"), serveBtn = $("serve"), muteBtn = $("mute");
  var modeSpinBtn = $("mode-spin"), modeRunBtn = $("mode-run");
  var readoutEl = $("readout"), footerEl = $("footer"), spinsLeftEl = $("spins-left");
  var cardEl = $("card"), boxEl = $("box");
  var ticksEl = $("ticks"), histEl = $("hist");
  var spinbarFill = $("spinbar").firstElementChild, ladderFill = $("ladder").firstElementChild;
  for (var d = 0; d < TICK_DOTS; d++) ticksEl.appendChild(document.createElement("i"));
  var tickDots = ticksEl.children, tickAt = -1;

  // ---- heartbeat + skill stop ------------------------------------------
  // One dot lights per reel tick, on any reel, so the row's rhythm is the
  // spin's rhythm: fast while everything moves, slowing with the tension tail.
  function beat() {
    if (tickAt >= 0) tickDots[tickAt].classList.remove("on");
    tickAt = (tickAt + 1) % TICK_DOTS;
    tickDots[tickAt].classList.add("on");
  }
  function clearBeat() {
    if (tickAt >= 0) tickDots[tickAt].classList.remove("on");
    tickAt = -1;
    ticksEl.className = "";
  }
  function pulseSpinBtn() {
    spinBtn.classList.remove("beat");
    void spinBtn.offsetWidth;
    spinBtn.classList.add("beat");
  }
  // The reels still in motion, in landing order. A tap mid-spin lands the
  // first one now. Outcomes were drawn before anything moved, so this only
  // ever changes how long the reveal takes.
  var live = [];
  var spinStartedAt = 0;
  function stopNext() {
    if (!spinning || Date.now() - spinStartedAt < STOP_GRACE_MS) return;
    var r = live.shift();
    if (r) r.stop();
  }

  // ---- state ------------------------------------------------------------
  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }
  var ui = "spin";     // "spin" (the toy) | "run" (the game)
  var run = null;      // the run in progress, mirrored to storage
  var rng = null;      // the run's seeded stream: three draws per spin, nothing else
  var phase = "card";  // "card" | "play"
  var spinning = false;

  // Spin mode's lifetime stats. These are v1's keys, never deleted, so a
  // phone that played v1 gets its totals back exactly.
  var points = num(Arcade.load("points", 0));
  var jackpots = num(Arcade.load("jackpots", 0));
  var matches = num(Arcade.load("matches", 0));
  var dry = num(Arcade.load("dry", 0));
  function saveStats() {
    Arcade.save("points", points);
    Arcade.save("jackpots", jackpots);
    Arcade.save("matches", matches);
    Arcade.save("dry", dry);
    saveBrag();
  }

  // Run mode's lifetime tallies, for the index's stats sheet.
  var runs = num(Arcade.load("runs", 0));
  var serves = num(Arcade.load("serves", 0));
  var bunnies = num(Arcade.load("bunnies", 0));
  function saveRunStats() {
    Arcade.save("runs", runs);
    Arcade.save("serves", serves);
    Arcade.save("bunnies", bunnies);
  }

  // One best for Run. v2/v3 kept a daily best and a free-play best; the
  // higher of the two carries over.
  var best = Math.max(num(Arcade.load("best", 0)), num(Arcade.load("bestDaily", 0)), num(Arcade.load("bestFree", 0)));

  function newSeedString() {
    // The only place Math.random touches a run, and it only picks the seed.
    return "run:" + Date.now().toString(36) + ":" + Math.random().toString(36).slice(2, 10);
  }

  function newRun() {
    run = {
      seed: newSeedString(),
      spin: 0, bowl: 0, streak: 0, served: 0, biggest: 0, bunnies: 0, jackpots: 0,
      hist: [], // one letter per event, for the end card's strip: l b m j s
      coach: Arcade.load("coached", false) !== true
    };
    rng = Arcade.seededRandom(run.seed);
    saveRun();
    runs += 1;
    saveRunStats();
  }

  function saveRun() { Arcade.save("run", run); }

  function loadRun() {
    var r = Arcade.load("run", null);
    if (!r || typeof r !== "object" || typeof r.seed !== "string") return null;
    if (r.bunnies == null) r.bunnies = r.snails; // v2 runs called it a snail
    ["spin", "bowl", "streak", "served", "biggest", "bunnies", "jackpots"].forEach(function (k) { r[k] = num(r[k]); });
    r.coach = r.coach === true;
    if (!Array.isArray(r.hist)) r.hist = [];
    if (r.spin >= SPINS || r.spin < 0) { Arcade.save("run", null); return null; }
    rng = Arcade.seededRandom(r.seed);
    for (var i = 0; i < r.spin * 3; i++) rng(); // replay the draws already spent
    return r;
  }

  function strip3() { return ui === "run" ? STRIP3_RUN : SYMBOLS; }

  function draw() {
    return {
      r1: Math.floor(rng() * SYMBOLS.length),
      r2: Math.floor(rng() * SYMBOLS.length),
      r3: Math.floor(rng() * STRIP3_RUN.length)
    };
  }
  // Spin mode has no run and nothing at stake, so it rolls from Math.random
  // over five symbols. The seeded stream is only ever touched by draw().
  function toyDraw() {
    return {
      r1: Math.floor(Math.random() * SYMBOLS.length),
      r2: Math.floor(Math.random() * SYMBOLS.length),
      r3: Math.floor(Math.random() * SYMBOLS.length)
    };
  }

  function classify(r1, r2, r3) {
    if (r3 === BUNNY) return "bust";
    if (r1 === r2 && r2 === r3) return r1 === LETTUCE ? "jackpot" : "match";
    return "miss";
  }

  function tierFor(served) {
    var t = LADDER[0];
    LADDER.forEach(function (l) { if (served >= l.at) t = l; });
    return t;
  }
  function nextRung(served) {
    for (var i = 0; i < LADDER.length; i++) if (served < LADDER[i].at) return LADDER[i];
    return null;
  }

  function plural(n, word) { return n.toLocaleString() + " " + word + (n === 1 ? "" : "s"); }

  // ---- render -----------------------------------------------------------
  function render() {
    // Mid-spin the button is the STOP button, never disabled.
    spinBtn.textContent = spinning ? "STOP" : "SPIN";
    spinBtn.classList.toggle("stop", spinning);
    modeSpinBtn.disabled = spinning;
    modeRunBtn.disabled = spinning;
    // The status line shows what pays whenever it has nothing else to say.
    if (!spinning && statusEl.textContent === "") setStatus(ui === "spin" ? LEGEND_SPIN : LEGEND_RUN, "legend");
    if (ui === "spin") {
      readoutEl.innerHTML = "<b>" + plural(jackpots, "jackpot") + "</b> · " +
        matches.toLocaleString() + " match" + (matches === 1 ? "" : "es");
      footerEl.innerHTML = "<b>" + dry.toLocaleString() + " since last 🥬</b> · " + points.toLocaleString() + " pts";
      return;
    }
    if (!run) return;
    var left = SPINS - run.spin;
    spinsLeftEl.textContent = left + (left === 1 ? " spin left" : " spins left");
    spinbarFill.style.width = (100 * left / SPINS) + "%";
    readoutEl.innerHTML = "<span class=\"bowl\">🥗</span> <b>" + run.bowl + "</b> · streak <b>" + run.streak + "</b> · <b>+" + (run.streak + 1) + "</b> next";
    serveBtn.textContent = "SERVE " + run.bowl;
    serveBtn.disabled = spinning || run.bowl <= 0;
    histEl.textContent = run.hist.slice(-16).map(function (h) { return GLYPH[h] || "🟩"; }).join("");
    var nr = nextRung(run.served);
    var prev = tierFor(run.served);
    ladderFill.style.width = (nr ? 100 * (run.served - prev.at) / (nr.at - prev.at) : 100) + "%";
    footerEl.innerHTML = "served " + run.served + " · " + (nr
      ? "<b>" + nr.name + "</b> at " + nr.at + " · " + (nr.at - run.served) + " to go"
      : "<b>" + tierFor(run.served).name + "</b>");
  }
  function bowlEl() { return readoutEl.querySelector(".bowl"); }
  function setBowl(cls, on) { var b = bowlEl(); if (b) b.classList.toggle(cls, !!on); }

  function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ""; }

  function showPayout(text, cls) {
    payoutEl.textContent = text;
    payoutEl.className = "payout " + cls;
    void payoutEl.offsetWidth;
    payoutEl.classList.add("pop");
  }

  function clearRings() { reelEls.forEach(function (el) { el.classList.remove("hot", "bunny", "leaf", "breathe", "pass"); }); }

  // ---- reel animation ---------------------------------------------------
  // Walks the strip one slot per tick, starting at (final - ticks) so the reel
  // arrives on finalIndex with every intermediate step contiguous.
  // Returns a handle whose stop() lands the reel on finalIndex right now.
  function spinReel(el, strip, intervals, finalIndex, onTick, onDone) {
    var n = strip.length;
    var timer = null, landed = false;
    function land() {
      if (landed) return;
      landed = true;
      clearTimeout(timer);
      el.textContent = strip[finalIndex];
      el.classList.remove("fade");
      onDone();
    }
    if (REDUCED) {
      // Reduced motion: a short fade instead of the walk; sounds and words stay.
      el.classList.add("fade");
      timer = setTimeout(land, Math.min(900, intervals.length * 20));
      return { stop: land };
    }
    var ticks = intervals.length;
    var idx = ((finalIndex - ticks) % n + n) % n;
    function step(i) {
      timer = setTimeout(function () {
        if (landed) return;
        idx = (idx + 1) % n;
        el.textContent = strip[idx];
        if (onTick) onTick(i, strip[idx]);
        if (i + 1 < ticks) step(i + 1);
        else land();
      }, intervals[i]);
    }
    step(0);
    return { stop: land };
  }

  // ---- the spin ---------------------------------------------------------
  function spin() {
    if (spinning || phase !== "play") return;
    if (ui === "run" && (!run || run.spin >= SPINS)) return;
    spinning = true;
    spinStartedAt = Date.now();
    setStatus("");
    render();
    payoutEl.className = "payout";
    clearRings();
    clearBeat();

    var strip = strip3();
    var d = ui === "spin" ? toyDraw() : draw();
    var r1 = d.r1, r2 = d.r2, r3 = d.r3;
    var outcome = classify(r1, r2, r3);
    var tension = (r1 === r2);
    var done = ui === "spin" ? resolveSpin : resolve;

    // Presentation only. On half of near-misses, land reel 3 just past the
    // target so the winning symbol is the last thing replaced. In Run, one
    // past lettuce is the bunny, so a lettuce near-miss goes two past, onto
    // tomato: the reel crawls through the lettuce, then the bunny, then
    // stops. This may only ever change which losing symbol shows.
    var shown = r3;
    if (tension && outcome === "miss" && Math.random() < 0.5) {
      shown = (r1 + (strip[(r1 + 1) % strip.length] === "🐰" ? 2 : 1)) % strip.length;
      if (classify(r1, r2, shown) !== "miss") {
        console.error("near-miss reindex changed the outcome; showing the rolled symbol");
        shown = r3;
      }
    }

    if (TURBO) {
      reelEls[0].textContent = SYMBOLS[r1];
      reelEls[1].textContent = SYMBOLS[r2];
      reelEls[2].textContent = strip[shown];
      done(r1, r2, shown, outcome, tension);
      return;
    }

    var leafPair = tension && r1 === LETTUCE;
    var third = leafPair ? REEL3_TENSION_LEAF : tension ? REEL3_TENSION : REEL3_NORMAL;

    live = [];
    live.push(spinReel(reelEls[0], SYMBOLS, REEL1, r1, beat, function () {
      tone(STOP_TONES[0], 0.09, 0, 0.16);
      pulseSpinBtn();
    }));
    live.push(spinReel(reelEls[1], SYMBOLS, REEL2, r2, beat, function () {
      tone(STOP_TONES[1], 0.09, 0, 0.16);
      pulseSpinBtn();
      if (tension) {
        var tier = leafPair ? "leaf" : "hot";
        reelEls[0].classList.add("hot", "breathe", tier);
        reelEls[1].classList.add("hot", "breathe", tier);
        ticksEl.className = tier;
        var staked = ui === "run" && run.bowl > 0;
        if (leafPair) setStatus("TWO 🥬 — JACKPOT?" + (staked ? " bowl " + run.bowl + " ×3…" : ""), "leaf");
        else setStatus("TWO " + SYMBOLS[r1] + (staked ? " — bowl " + run.bowl + " on the line…" : " — one to go…"), "near");
        if (staked) setBowl("wobble", true);
      }
    }));
    live.push(spinReel(reelEls[2], strip, third, shown, function (i, sym) {
      beat();
      if (tension && i >= TENSION_TAIL_FROM) {
        tone(leafPair ? 360 : 300, 0.05, 0, 0.08);
        pulseSpinBtn();
        // A lettuce near-miss in Run crawls past the bunny before it stops.
        if (sym === "🐰") {
          reelEls[2].classList.remove("pass");
          void reelEls[2].offsetWidth;
          reelEls[2].classList.add("pass");
          tone(160, 0.08, 0, 0.1);
        }
      }
    }, function () {
      tone(STOP_TONES[2], 0.09, 0, 0.16);
      live = [];
      reelEls[0].classList.remove("breathe");
      reelEls[1].classList.remove("breathe");
      reelEls[2].classList.remove("pass");
      setBowl("wobble", false);
      clearBeat();
      done(r1, r2, shown, outcome, tension);
    }));
  }

  // Spin mode: v1's economy, verbatim. Points only ever go up.
  function resolveSpin(r1, r2, r3, outcome, tension) {
    if (outcome === "jackpot") {
      points += 500;
      jackpots += 1;
      dry = 0;
      setStatus("JACKPOT! 🥬🥬🥬 +500", "jackpot");
      showPayout("+500", "jackpot");
      reelEls.forEach(function (el) { el.classList.add("hot"); });
      jackpotSound();
    } else if (outcome === "match") {
      points += 50;
      matches += 1;
      dry += 1;
      setStatus("MATCH " + SYMBOLS[r1] + SYMBOLS[r1] + SYMBOLS[r1] + " +50", "match");
      showPayout("+50", "match");
      reelEls.forEach(function (el) { el.classList.add("hot"); });
      matchSound();
    } else {
      points += 1;
      dry += 1;
      setStatus(tension ? "so close — one off" : "", tension ? "near" : "");
      if (tension) reelEls.forEach(function (el) { el.classList.remove("leaf"); });
    }
    saveStats();
    if (outcome !== "miss") saveBrag();
    spinning = false;
    render();
  }

  function resolve(r1, r2, r3, outcome, tension) {
    run.spin += 1;

    run.hist.push(outcome === "bust" ? "b" : outcome === "jackpot" ? "j" : outcome === "match" ? "m" : "l");

    if (outcome === "bust") {
      var lost = run.bowl;
      run.bunnies += 1;
      bunnies += 1;
      saveRunStats();
      run.bowl = 0;
      run.streak = 0;
      reelEls[2].classList.add("bunny");
      if (lost > 0) {
        setStatus("the bunny ate " + lost, "bust");
        showPayout("🐰 −" + lost, "bust");
      } else {
        setStatus("he found an empty bowl", "bust");
      }
      bunnySound();
    } else {
      run.streak += 1;
      var leaf = run.streak;
      run.bowl += leaf;
      if (outcome === "jackpot") {
        run.bowl = run.bowl * 3 + 50;
        run.jackpots += 1;
        setStatus("JACKPOT! 🥬🥬🥬 — bowl " + run.bowl, "jackpot");
        showPayout("JACKPOT", "jackpot");
        reelEls.forEach(function (el) { el.classList.add("hot"); });
        jackpotSound();
      } else if (outcome === "match") {
        run.bowl = run.bowl * 2;
        setStatus("MATCH — bowl doubled to " + run.bowl, "match");
        showPayout("×2", "match");
        reelEls.forEach(function (el) { el.classList.add("hot"); });
        matchSound();
      } else if (run.coach && run.streak <= COACH.length) {
        // First run: the first three leaves of a streak teach in the status
        // line. Keyed on the streak, not the spin, so an early bunny (which
        // explains itself) doesn't cancel the lesson.
        setStatus(COACH[run.streak - 1], "");
      } else if (tension) {
        setStatus("so close — one off · +" + leaf, "near");
      } else {
        setStatus("+" + leaf + " leaf · bowl " + run.bowl, "");
      }
    }
    if (outcome !== "jackpot") reelEls.forEach(function (el) { el.classList.remove("leaf"); });

    if (run.coach && (run.streak >= COACH.length || run.spin >= 10)) { run.coach = false; Arcade.save("coached", true); }
    if (run.bowl > run.biggest) run.biggest = run.bowl;

    if (run.spin >= SPINS) {
      // Last call: whatever is still in the bowl is served.
      if (run.bowl > 0) {
        run.served += run.bowl;
        run.hist.push("s");
        serves += 1;
        saveRunStats();
        setStatus("last call — served " + run.bowl, "serve");
        serveSound(run.bowl);
        run.bowl = 0;
        run.streak = 0;
      }
      saveRun();
      spinning = false;
      render();
      if (TURBO) finishRun(); else setTimeout(finishRun, 1400);
      return;
    }

    saveRun();
    spinning = false;
    render();
    if (outcome !== "bust") setBowl("hop", true);
  }

  // The bowl flies from the SERVE button down to the served total, and the
  // total pulses when it lands. Reaching a rung of the ladder gets a stamp.
  function flyBowl(amount, onLand) {
    if (TURBO || REDUCED) { onLand(); return; }
    var from = serveBtn.getBoundingClientRect(), to = footerEl.getBoundingClientRect();
    var f = el("div", "fly", "🥗 +" + amount);
    f.style.left = (from.left + from.width / 2) + "px";
    f.style.top = (from.top + from.height / 2) + "px";
    f.style.transform = "translate(-50%, -50%)";
    document.body.appendChild(f);
    void f.offsetWidth;
    f.style.transform = "translate(-50%, -50%) translate(0, " + (to.top + to.height / 2 - (from.top + from.height / 2)) + "px) scale(0.7)";
    f.style.opacity = "0";
    setTimeout(function () { f.remove(); onLand(); }, 540);
  }

  function serve() {
    if (spinning || phase !== "play" || ui !== "run" || !run || run.bowl <= 0) return;
    var amount = run.bowl;
    var before = tierFor(run.served);
    run.served += amount;
    run.hist.push("s");
    serves += 1;
    saveRunStats();
    run.bowl = 0;
    run.streak = 0;
    clearRings();
    var after = tierFor(run.served);
    var rung = after !== before;
    setStatus(rung ? "🥗 " + after.name + "!" : "served " + amount, rung ? "jackpot" : "serve");
    serveSound(amount);
    saveRun();
    render();
    flyBowl(amount, function () {
      footerEl.classList.remove("pulse");
      void footerEl.offsetWidth;
      footerEl.classList.add("pulse");
      if (rung) {
        Arcade.stampIn(footerEl);
        Arcade.confetti(["#ffe066", "#4adec5", "#eafffb"]);
      }
    });
  }

  function finishRun() {
    var result = {
      served: run.served, tier: tierFor(run.served).name,
      biggest: run.biggest, bunnies: run.bunnies, jackpots: run.jackpots,
      hist: run.hist.slice(), prevBest: best, beat: run.served > best && run.served > 0
    };
    if (result.beat) { best = result.served; Arcade.save("best", best); }
    saveBrag();
    run = null;
    rng = null;
    Arcade.save("run", null);
    showEndCard(result);
  }

  // ---- cards ------------------------------------------------------------
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function button(label, cls, onClick) {
    var b = el("button", cls, label);
    b.addEventListener("click", onClick);
    return b;
  }
  function openCard(children) {
    phase = "card";
    boxEl.innerHTML = "";
    children.forEach(function (c) { boxEl.appendChild(c); });
    cardEl.classList.add("show");
  }
  function closeCard() { cardEl.classList.remove("show"); phase = "play"; }

  // The rules live on the start card, under the button. No gate, no "Got it".
  function rulesList() {
    var ul = el("ul");
    RULES.forEach(function (t) { ul.appendChild(el("li", null, t)); });
    return ul;
  }

  function showStartCard(resume) {
    var kids = [el("h2", null, resume ? "Run in progress" : SPINS + "-spin run")];
    if (resume) {
      kids.push(el("p", null, (SPINS - run.spin) + " spins left · " + run.served + " served so far"));
    } else {
      kids.push(el("p", null, "your best " + best));
    }
    kids.push(button(resume ? "RESUME" : "START", "btn", function () {
      if (!resume) newRun();
      closeCard();
      clearRings();
      setStatus("");
      render();
    }));
    if (!resume) kids.push(rulesList());
    openCard(kids);
  }

  // The run as a strip of at most 16 glyphs. Each slot shows the most
  // notable thing that happened in its slice of the run: a jackpot beats a
  // serve beats a bunny beats a match beats a plain leaf.
  var GLYPH = { l: "🟩", b: "🐰", m: "✨", j: "🥬", s: "🥗" };
  var RANK = { l: 0, m: 1, b: 2, s: 3, j: 4 };
  function stripFor(hist) {
    var n = hist.length;
    if (!n) return "";
    var buckets = Math.min(n, 16), out = "";
    for (var b = 0; b < buckets; b++) {
      var from = Math.floor(b * n / buckets), to = Math.floor((b + 1) * n / buckets);
      var top = hist[from];
      for (var i = from + 1; i < to; i++) if ((RANK[hist[i]] || 0) > (RANK[top] || 0)) top = hist[i];
      out += GLYPH[top] || "🟩";
    }
    return out;
  }

  function resultLine(r) {
    var line = "🥬 Lettuce Slots · " + r.served + " served · " + r.tier + "\n" +
      stripFor(r.hist) + "\n" +
      "biggest bowl " + r.biggest + " · 🐰 " + r.bunnies;
    if (r.jackpots > 0) line += " · 🥬 ×" + r.jackpots;
    line += r.beat ? " · new best!" : " · best " + best;
    return line;
  }

  function saveBrag() {
    if (best > 0) Arcade.brag("Best run " + best + " · " + tierFor(best).name);
    else if (points > 0) Arcade.brag(points.toLocaleString() + " pts" + (jackpots > 0 ? " · " + plural(jackpots, "jackpot") : ""));
    else Arcade.brag("");
    if (best > 0 || runs > 0 || points > 0) {
      Arcade.stats([
        "# Run",
        ["Best run", best > 0 ? best + " · " + tierFor(best).name : "—"],
        ["Runs started", runs],
        ["Bowls served", serves],
        ["Bunnies fed", bunnies],
        "# Spin",
        ["Points", points],
        ["Jackpots", jackpots],
        ["Matches", matches],
        ["Dry spins", dry]
      ]);
    } else Arcade.stats(null);
  }

  function showEndCard(r) {
    var why = el("div", "why" + (r.beat ? " best" : ""),
      r.beat ? "🎉 New best!" : (best > r.served ? (best - r.served) + " short of your best" : "Run over"));
    var big = el("div", "big", r.served + " served");
    var panel = el("div", "panel");
    var top = el("div", "panel-top");
    top.appendChild(el("span", "game", "🥬 Lettuce Slots"));
    top.appendChild(el("span", null, Arcade.cardDate()));
    panel.appendChild(top);
    panel.appendChild(why);
    panel.appendChild(big);
    panel.appendChild(el("div", "tier", "🥗 " + r.tier));
    panel.appendChild(el("div", "strip", stripFor(r.hist)));
    panel.appendChild(el("p", null, "biggest bowl " + r.biggest + " · 🐰 " + r.bunnies + (r.jackpots > 0 ? " · 🥬 jackpot ×" + r.jackpots : "")));
    panel.appendChild(el("p", null, r.beat && r.prevBest > 0 ? "previous best " + r.prevBest : "your best " + best));
    panel.appendChild(el("div", "foot", "lettuce arcade"));

    var hint = el("div", "hint");
    var row = el("div", "row");
    var shareBtn = el("button", "btn quiet", "Share");
    Arcade.shareButton(shareBtn, hint, function () { return { text: resultLine(r), title: "Lettuce Slots" }; });
    row.appendChild(shareBtn);
    row.appendChild(button("Play again", "btn", function () { showStartCard(false); }));

    openCard([panel, row, hint]);
    if (r.beat) {
      Arcade.stampIn(big);
      Arcade.confetti(["#ffe066", "#4adec5", "#eafffb", "#ff8a7a", "#ffffff"]);
      jackpotSound();
    }
    // Idle reels behind the card.
    reelEls[0].textContent = SYMBOLS[LETTUCE];
    reelEls[1].textContent = SYMBOLS[LETTUCE];
    reelEls[2].textContent = SYMBOLS[LETTUCE];
  }

  // ---- modes ------------------------------------------------------------
  // Run mode picks up wherever the run was: a run in progress resumes,
  // otherwise the start card.
  function enterRun() {
    if (!run) run = loadRun();
    clearRings();
    setStatus("");
    payoutEl.className = "payout";
    if (run) { render(); showStartCard(true); return; }
    showStartCard(false);
  }

  function setUi(mode) {
    if (spinning) return;
    ui = mode;
    Arcade.save("uiMode", mode);
    document.body.classList.toggle("mode-spin", mode === "spin");
    modeSpinBtn.classList.toggle("on", mode === "spin");
    modeRunBtn.classList.toggle("on", mode === "run");
    modeSpinBtn.setAttribute("aria-selected", mode === "spin" ? "true" : "false");
    modeRunBtn.setAttribute("aria-selected", mode === "run" ? "true" : "false");
    if (mode === "spin") {
      // The run, if any, stays saved exactly where it is.
      closeCard();
      clearRings();
      setStatus("");
      payoutEl.className = "payout";
      if (reelEls[2].textContent === "🐰") reelEls[2].textContent = SYMBOLS[LETTUCE];
      render();
    } else {
      enterRun();
    }
  }

  modeSpinBtn.addEventListener("click", function () { if (ui !== "spin") setUi("spin"); });
  modeRunBtn.addEventListener("click", function () { if (ui !== "run") setUi("run"); });

  Arcade.menuButton({
    rules: HELP,
    canOpen: function () { return !spinning; },
    // Bailing is free: a run only counts once it's served, so nothing here
    // can touch the best. Drops straight onto a fresh start card.
    actions: [{ label: "New run", confirm: "This run is gone. Your best stays.", pinned: true,
      show: function () { return ui === "run" && !!run && phase === "play"; },
      // Begging: fifteen spins in with nothing to show, or well behind the
      // pace of the best run. Serving beats sulking.
      nudge: function () {
        if (!run || run.spin < 15) return false;
        var have = run.served + run.bowl;
        if (have === 0) return true;
        return best > 0 && have < (best * run.spin / SPINS) * 0.4;
      },
      onClick: function () {
      run = null;
      rng = null;
      Arcade.save("run", null);
      if (ui !== "run") setUi("run"); else enterRun();
    } }],
    describeSave: function () {
      return points.toLocaleString() + " lifetime pts · " + plural(jackpots, "jackpot") +
        " · best run " + best + (run ? " · the run in progress" : "") + ".";
    }
  });

  // ---- input ------------------------------------------------------------
  function renderMute() {
    muteBtn.textContent = muted ? "🔇" : "🔊";
    muteBtn.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound");
  }
  muteBtn.addEventListener("click", function () { muted = !muted; Arcade.save("muted", muted); renderMute(); });

  spinBtn.addEventListener("pointerdown", function (e) { e.preventDefault(); if (spinning) stopNext(); else spin(); });
  serveBtn.addEventListener("click", serve);

  document.addEventListener("keydown", function (e) {
    if (e.repeat) return;
    if (phase === "play") {
      if (e.key === " " || e.code === "Space") { e.preventDefault(); if (spinning) stopNext(); else spin(); }
      else if (e.key === "s" || e.key === "S") { e.preventDefault(); serve(); }
    } else if (e.key === "Enter") {
      var primary = boxEl.querySelector("#box .btn:not(.quiet)");
      if (primary) { e.preventDefault(); primary.click(); }
    }
  });

  // ---- boot -------------------------------------------------------------
  function start() {
    renderMute();
    saveBrag();
    // First boot opens on the toy. After that, wherever you left it.
    setUi(Arcade.load("uiMode", "spin") === "run" ? "run" : "spin");
  }

  Arcade.boot(start);
</script>
</body>
</html>
