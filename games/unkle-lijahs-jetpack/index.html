<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Unkle Lijah's Jetpack — Lettuce Arcade</title>
<meta name="theme-color" content="#083734">
<link rel="stylesheet" href="/shared/arcade.css">
<style>
  /* Design direction for the first cut: flat vector shapes on a warm diner
     sky. No image assets. Everything Lijah is drawn in code so the ragdoll
     can bend it. */
  :root {
    --sky-top: #f7c46a;
    --sky-bottom: #f18f5a;
    --diner: #2b1a2e;
    --bun: #e0a75b;
    --patty: #6b3a24;
    --cheese: #ffd23f;
    --ketchup: #e63b2e;
    --mustard: #f2c218;
    --pickle: #5aa839;
    --onion: #f0d9a8;
  }
  html, body { height: 100%; overflow: hidden; }
  body {
    display: flex;
    flex-direction: column;
    padding: calc(52px + var(--safe-top)) 0 var(--safe-bottom);
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }

  /* HUD: one row, under the shared buttons. */
  #hud {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px 6px;
    font-weight: 800; font-variant-numeric: tabular-nums;
  }
  #act { font-size: 0.85rem; letter-spacing: 0.08em; color: var(--fg-dim); text-transform: uppercase; }
  #act.rush { color: #ffe066; }
  #clock { font-size: 1.05rem; }
  #banked { font-size: 1.15rem; }
  #banked.pop { animation: pop 380ms ease-out; }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.35); color: #ffe066; } 100% { transform: scale(1); } }
  #timebar { height: 5px; margin: 0 14px 4px; border-radius: 3px; background: rgba(0, 0, 0, 0.35); overflow: hidden; }
  #timebar i { display: block; height: 100%; width: 100%; background: var(--accent); border-radius: 3px; }
  #timebar.rush i { background: #ffe066; }

  /* The play space: the upper two thirds. Walls are its edges. */
  #stage { flex: 1; position: relative; min-height: 0; margin: 0 8px; }
  canvas#play { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 18px; display: block; }
  #toast {
    position: absolute; left: 0; right: 0; top: 38%;
    text-align: center; font-size: clamp(28px, 9vw, 44px); font-weight: 900;
    pointer-events: none; opacity: 0; text-shadow: 0 3px 14px rgba(0, 0, 0, 0.5);
  }
  #toast.show { animation: toast 1s ease-out forwards; }
  @keyframes toast {
    0% { opacity: 0; transform: translateY(20px) scale(0.6); }
    20% { opacity: 1; transform: translateY(0) scale(1.15); }
    40% { transform: scale(1); }
    100% { opacity: 0; transform: translateY(-40px); }
  }
  #toast.bank { color: #ffe066; }
  #toast.spill { color: #ff8a7a; }
  #toast.bell { color: #fff; }

  /* The thrust pad: the bottom third. Inset from both edges so a thumb
     never starts a drag inside iOS's back-swipe zone. */
  #pad {
    height: 30vh; min-height: 190px;
    margin: 8px 24px 8px;
    border-radius: 22px;
    background: rgba(0, 0, 0, 0.35);
    position: relative;
    touch-action: none;
  }
  #pad .hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--fg-dim); font-weight: 700; font-size: 0.95rem; opacity: 0.7; pointer-events: none; }
  #pad.live .hint { opacity: 0; }
  #stick { position: absolute; width: 96px; height: 96px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.25); transform: translate(-50%, -50%); display: none; pointer-events: none; }
  #knob { position: absolute; width: 52px; height: 52px; border-radius: 50%; background: var(--accent); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4); transform: translate(-50%, -50%); display: none; pointer-events: none; }
  #pad.live #stick, #pad.live #knob { display: block; }

  /* Cards. */
  #card {
    position: fixed; inset: 0; background: rgba(8, 55, 52, 0.96);
    display: none; align-items: flex-start; justify-content: center;
    padding: calc(56px + var(--safe-top)) 18px calc(20px + var(--safe-bottom));
    z-index: 9998; overflow-y: auto;
  }
  #card.show { display: flex; }
  /* margin:auto centres a short box and never clips a tall one. */
  .box { width: 100%; max-width: 380px; margin: auto; display: flex; flex-direction: column; align-items: stretch; gap: 10px; text-align: center; }
  .box h2 { font-size: 1.5rem; line-height: 1.2; }
  .box p { color: var(--fg-dim); font-size: 0.98rem; }
  .box .big { font-size: 2.4rem; font-weight: 900; }
  .box .btn { min-height: 60px; font-size: 1.15rem; font-weight: 800; }
  .box .btn.quiet { background: var(--bg-elevated); }
  .box .btn.gold { background: #ffe066; color: #3a2d00; }
  .box .btn:disabled { opacity: 0.45; }
  .box .row { display: flex; gap: 8px; }
  .box .row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
  .box ul { text-align: left; color: var(--fg); padding-left: 1.2em; font-size: 0.98rem; }
  .box li { margin: 5px 0; }
  .box .panel { background: #052926; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .box .panel-top { display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--fg-dim); }
  .box .panel-top .game { color: var(--fg); font-weight: 700; }
  .box .hint { font-size: 0.8rem; color: var(--fg-dim); min-height: 1.1em; }
  .box .foot { font-size: 0.72rem; color: var(--fg-dim); opacity: 0.75; }

  /* Loadout: Lijah on top, the pack below. Portrait, so stacked. */
  canvas#idle { width: 100%; height: 220px; border-radius: 18px; background: linear-gradient(var(--sky-top), var(--sky-bottom)); display: block; touch-action: none; }
  .shop { display: flex; flex-direction: column; gap: 6px; text-align: left; }
  .shop h3 { font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; color: #ffe066; margin-top: 6px; }
  .shop .item { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 10px; border-radius: 12px; background: rgba(0, 0, 0, 0.25); }
  .shop .item .sw { width: 26px; height: 26px; border-radius: 8px; flex: none; border: 2px solid rgba(255, 255, 255, 0.25); }
  .shop .item .t { flex: 1; font-size: 0.95rem; font-weight: 700; }
  .shop .item .t small { display: block; color: var(--fg-dim); font-weight: 600; font-size: 0.8rem; }
  .shop .item .btn { min-height: 44px; min-width: 92px; font-size: 0.9rem; padding: 6px 10px; }
  .shop .item.on { outline: 2px solid var(--accent); }
  .pile { display: flex; justify-content: space-between; align-items: center; color: var(--fg-dim); font-weight: 700; }
  .pile b { color: #ffe066; font-size: 1.3rem; }
  canvas#pilecv { width: 100%; height: 56px; display: block; }

  @media (prefers-reduced-motion: reduce) {
    #banked.pop, #toast.show { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
<div id="hud">
  <span id="act">Open</span>
  <span id="clock">1:30</span>
  <span id="banked">🍔 0</span>
</div>
<div id="timebar"><i></i></div>
<div id="stage">
  <canvas id="play"></canvas>
  <div id="toast"></div>
</div>
<div id="pad">
  <div class="hint">thumb here · slide to thrust</div>
  <div id="stick"></div><div id="knob"></div>
</div>
<div id="card" role="dialog" aria-modal="true"><div class="box" id="box"></div></div>

<script src="/shared/arcade.js"></script>
<script>
  Arcade.backButton();
  Arcade.trapBack(); // dragging a thumb near the edge must never leave the game

  // ---- constants --------------------------------------------------------
  var RUN_SECONDS = 90;
  var ACTS = [
    { name: "Open", from: 0 },
    { name: "Lunch", from: 30 },
    { name: "Dinner Rush", from: 75 }
  ];
  var CATCH_AT_STACK_TOP = true;   // open call A
  var BUZZER_FREE_BUN = true;      // open call B
  var GRAVITY = 900;               // px/s²
  var ROD = 74;                    // pack → head
  var LAYER_H = 13;                // stack layer spacing
  var HEAD_R = 17;

  // Ingredient order. `next` says what may land on a stack whose top is `k`.
  var ING = ["bun_b", "patty", "cheese", "bun_t"];
  function nextLegal(top) {
    if (!top) return ["bun_b"];
    if (top === "bun_b" || top === "cheese") return top === "cheese" ? ["patty", "bun_t"] : ["patty"];
    if (top === "patty") return ["cheese"];
    return [];
  }
  var CONDIMENTS = ["ketchup", "mustard", "pickle", "onion"];

  // Parts: every one is a trade. Numbers are multipliers on stock.
  var PARTS = {
    stock:  { name: "Stock pack",      blurb: "The one he came with.",               cost: 0,  thrust: 1,    catchR: 1,    stiff: 1,    swing: 1 },
    brim:   { name: "Wide Brim",       blurb: "Bigger hat, easier catch. Higher pivot, more wobble.", cost: 12, thrust: 1, catchR: 1.4, stiff: 0.8, swing: 1.25 },
    fins:   { name: "Stabilizer Fins", blurb: "Settles fast, swings less. Slower.", cost: 18, thrust: 0.78, catchR: 1, stiff: 1.6, swing: 0.7 },
    burner: { name: "Afterburner",     blurb: "Much more thrust. Much wilder swing.", cost: 25, thrust: 1.45, catchR: 1, stiff: 0.85, swing: 1.5 }
  };
  var PAINTS = [
    { id: "teal", name: "Diner teal", cost: 0, color: "#18aca4" },
    { id: "red", name: "Ketchup red", cost: 6, color: "#e63b2e" },
    { id: "mustard", name: "Mustard", cost: 6, color: "#f2c218" },
    { id: "night", name: "Midnight", cost: 10, color: "#2b2d42" },
    { id: "gold", name: "Gold", cost: 40, color: "#f5c542" }
  ];
  var EXHAUSTS = [
    { id: "flame", name: "Flame", cost: 0, color: "#ff9f1c" },
    { id: "blue", name: "Blue jet", cost: 8, color: "#4cc9f0" },
    { id: "pink", name: "Bubblegum", cost: 8, color: "#ff7ab6" },
    { id: "green", name: "Pickle juice", cost: 12, color: "#8be04e" }
  ];
  var HATS = [
    { id: "cap", name: "Paper cap", cost: 0 },
    { id: "none", name: "Bald and proud", cost: 3 },
    { id: "chef", name: "Chef's toque", cost: 15 },
    { id: "crown", name: "Crown", cost: 60 }
  ];

  var HELP = [
    "# The idea",
    "Unkle Lijah wears a jetpack. You fly the pack. He hangs under it and swings.",
    "Burger parts fall. Catch them on his head in order: bottom bun, patty, cheese, top bun.",
    "# Banking",
    "The top bun banks the stack: one 🍔 per cheese layer.",
    "After a cheese you can skip the top bun and stack another patty + cheese. Taller pays more and wobbles more.",
    "# Condiments",
    "Ketchup, mustard, pickles, onion rings. Touch one and the stack spills. Nothing else happens. Keep flying.",
    "# The run",
    RUN_SECONDS + " seconds. Open, Lunch, then the Dinner Rush. At the buzzer a free top bun banks a legal stack.",
    "# Daily",
    "Same run for the whole family, stock jetpack, once a day. Free Play uses whatever you've equipped."
  ];

  // Test hooks. All no-ops unless the URL asks.
  var Q = new URLSearchParams(location.search);
  var TURBO = Q.has("turbo");
  var SPEED = TURBO ? 8 : Math.max(0.25, Math.min(16, Number(Q.get("speed")) || 1));
  var BOT = TURBO || Q.has("bot");
  var FORCED_SEED = Q.get("seed");
  var REDUCED = Arcade.reducedMotion ? Arcade.reducedMotion() : false;

  // ---- schedule (pure) --------------------------------------------------
  // @schedule-begin
  // makeSchedule(rng, opts) → sorted [{ t, kind, x, vx, col }]. `rng` is a
  // () → [0,1) function. `x` is 0..1 of the play width. `col` marks the
  // items of a clean column. This block is lifted verbatim by the sim in
  // gdd/sim/unkle-lijahs-jetpack/, so it must stay self-contained.
  function makeSchedule(rng, opts) {
    opts = opts || {};
    var RUN = 90;
    var acts = [
      { from: 0,  to: 30, gap: 1.35, cond: opts.firstRun ? 0 : 0.12 },
      { from: 30, to: 75, gap: 0.85, cond: 0.36 },
      { from: 75, to: 90, gap: 0.42, cond: 0.4 }
    ];
    // Equal weights: a rarer top bun sounded like tension and played like
    // waiting. Greed is taxed by the wobble and the sauce, not by scarcity.
    var ingW = [["bun_b", 25], ["patty", 25], ["cheese", 25], ["bun_t", 25]];
    var conds = ["ketchup", "mustard", "pickle", "onion"];
    function pick(w) {
      var total = 0, i;
      for (i = 0; i < w.length; i++) total += w[i][1];
      var r = rng() * total;
      for (i = 0; i < w.length; i++) { r -= w[i][1]; if (r < 0) return w[i][0]; }
      return w[w.length - 1][0];
    }
    var out = [];
    var t = 1.2;
    acts.forEach(function (a) {
      if (t < a.from) t = a.from;
      while (t < a.to) {
        var isCond = rng() < a.cond;
        var kind = isCond ? conds[Math.floor(rng() * conds.length)] : pick(ingW);
        var x = 0.08 + rng() * 0.84;
        out.push({ t: +t.toFixed(3), kind: kind, x: +x.toFixed(3), vx: isCond && kind === "pickle" ? (rng() < 0.5 ? -1 : 1) : 0, col: false });
        var r = rng();
        var gap = a.gap * (0.45 + 1.1 * rng());
        if (r < 0.14) gap = 0.16 + rng() * 0.16;          // a cluster
        else if (r < 0.24) gap = a.gap * 2.4;             // a lull
        t += gap;
      }
    });
    // The rare clean column: bun, patty, cheese, top bun in one line.
    var wantColumn = opts.firstRun || rng() < 0.09;
    if (wantColumn) {
      var ct = opts.firstRun ? 6 : 8 + rng() * 60;
      var cx = 0.25 + rng() * 0.5;
      // Clear a window around it so nothing lands in the column's lane.
      out = out.filter(function (e) { return e.t < ct - 0.6 || e.t > ct + 2.6 || Math.abs(e.x - cx) > 0.22; });
      ["bun_b", "patty", "cheese", "bun_t"].forEach(function (k, i) {
        out.push({ t: +(ct + i * 0.58).toFixed(3), kind: k, x: +cx.toFixed(3), vx: 0, col: true });
      });
    }
    out.sort(function (a, b) { return a.t - b.t; });
    return out;
  }
  // @schedule-end

  // ---- elements ---------------------------------------------------------
  function $(id) { return document.getElementById(id); }
  var cv = $("play"), ctx = cv.getContext("2d");
  var padEl = $("pad"), stickEl = $("stick"), knobEl = $("knob");
  var actEl = $("act"), clockEl = $("clock"), bankedEl = $("banked"), timebar = $("timebar"), timefill = timebar.firstElementChild;
  var toastEl = $("toast"), cardEl = $("card"), boxEl = $("box");
  var W = 360, H = 520, DPR = 1;

  function resize() {
    var r = cv.getBoundingClientRect();
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = Math.max(200, r.width); H = Math.max(200, r.height);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);

  // ---- save -------------------------------------------------------------
  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }
  var burgers = num(Arcade.load("burgers", 0));
  var bestDaily = num(Arcade.load("bestDaily", 0));
  var bestFree = num(Arcade.load("bestFree", 0));
  var runs = num(Arcade.load("runs", 0));
  var spills = num(Arcade.load("spills", 0));
  var firstRun = Arcade.load("firstRun", true) !== false;
  var equipped = Arcade.load("equipped", "stock"); if (!PARTS[equipped]) equipped = "stock";
  var owned = Arcade.load("owned", ["stock", "teal", "flame", "cap"]); if (!Array.isArray(owned)) owned = ["stock", "teal", "flame", "cap"];
  var paint = Arcade.load("paint", "teal"), exhaust = Arcade.load("exhaust", "flame"), hat = Arcade.load("hat", "cap");
  function saveAll() {
    Arcade.save("burgers", burgers); Arcade.save("bestDaily", bestDaily); Arcade.save("bestFree", bestFree);
    Arcade.save("runs", runs); Arcade.save("spills", spills); Arcade.save("firstRun", firstRun);
    Arcade.save("equipped", equipped); Arcade.save("owned", owned);
    Arcade.save("paint", paint); Arcade.save("exhaust", exhaust); Arcade.save("hat", hat);
    Arcade.brag(bestDaily > 0 ? "Best Daily " + bestDaily + " 🍔" : burgers > 0 ? burgers + " 🍔 banked" : "");
    if (runs > 0) Arcade.stats([
      "# Runs", ["Best Daily", bestDaily], ["Best Free Play", bestFree], ["Runs", runs], ["Spills", spills],
      "# Pack", ["Burgers banked", burgers], ["Equipped", PARTS[equipped].name]
    ]); else Arcade.stats(null);
  }
  function has(id) { return owned.indexOf(id) >= 0; }
  function findC(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return list[0]; }

  // ---- physics ----------------------------------------------------------
  // Two Verlet points (pack, head) joined by a rod, then a chain of layer
  // points above the head. The pack is driven; everything else hangs.
  var pack, head, layers, debris, items, run, thrust, params;
  var phase = "card"; // card | play | buzzer
  var last = 0, acc = 0;
  var DT = 1 / 120;

  function mkPoint(x, y) { return { x: x, y: y, px: x, py: y }; }
  function partParams(id) {
    var p = PARTS[id] || PARTS.stock;
    return { thrust: 1900 * p.thrust, catchR: 24 * p.catchR, stiff: 0.32 * p.stiff, swingDamp: 0.985 + (1 - p.swing) * 0.01, pivot: p.catchR > 1 ? 6 : 0 };
  }

  function resetLijah() {
    pack = { x: W / 2, y: H * 0.42, vx: 0, vy: 0 };
    head = mkPoint(W / 2, H * 0.42 + ROD);
    layers = [];
    debris = [];
    items = [];
  }

  function stepPhysics(dt) {
    var tx = thrust.x * params.thrust, ty = thrust.y * params.thrust;
    if (BOT && phase === "play") { var b = botThrust(); tx = b.x * params.thrust; ty = b.y * params.thrust; }
    // pack: gravity vs thrust, drag, walls, never lands
    pack.vx += tx * dt; pack.vy += (GRAVITY + ty) * dt;
    pack.vx *= Math.pow(0.35, dt); pack.vy *= Math.pow(0.35, dt);
    pack.x += pack.vx * dt; pack.y += pack.vy * dt;
    if (pack.x < 26) { pack.x = 26; pack.vx = Math.abs(pack.vx) * 0.3; }
    if (pack.x > W - 26) { pack.x = W - 26; pack.vx = -Math.abs(pack.vx) * 0.3; }
    if (pack.y < 30) { pack.y = 30; pack.vy = Math.max(0, pack.vy); }
    var floorY = H - 40 - ROD;
    if (pack.y > floorY) { pack.y = floorY; pack.vy = Math.min(0, pack.vy) * 0.2; }

    // head: verlet with gravity, then rod constraint to the pack
    verlet(head, dt, params.swingDamp);
    constrain(head, pack.x, pack.y - params.pivot, ROD);
    // Lijah is a body, not a point: keep him below the pack a little.
    if (head.y < pack.y + ROD * 0.35) head.y = pack.y + ROD * 0.35;

    // stack: each layer hangs upward off the one below via a stiff spring
    // to the upright position, plus a distance constraint. Taller = floppier.
    var prevX = head.x, prevY = head.y - HEAD_R;
    for (var i = 0; i < layers.length; i++) {
      var L = layers[i];
      verlet(L, dt, 0.96);
      var upX = prevX, upY = prevY - LAYER_H;
      var k = params.stiff / (1 + i * 0.35);
      L.x += (upX - L.x) * k; L.y += (upY - L.y) * k;
      constrain(L, prevX, prevY, LAYER_H);
      prevX = L.x; prevY = L.y;
    }
    // debris
    for (var d = debris.length - 1; d >= 0; d--) {
      var D = debris[d];
      D.vy += GRAVITY * dt; D.x += D.vx * dt; D.y += D.vy * dt; D.rot += D.vr * dt;
      if (D.y > H + 40) debris.splice(d, 1);
    }
  }
  function verlet(p, dt, damp) {
    var vx = (p.x - p.px) * damp, vy = (p.y - p.py) * damp;
    p.px = p.x; p.py = p.y;
    p.x += vx; p.y += vy + GRAVITY * dt * dt;
  }
  function constrain(p, ax, ay, len) {
    var dx = p.x - ax, dy = p.y - ay, d = Math.sqrt(dx * dx + dy * dy) || 0.0001;
    var f = (d - len) / d;
    p.x -= dx * f; p.y -= dy * f;
  }
  function topOfStack() {
    if (layers.length) { var L = layers[layers.length - 1]; return { x: L.x, y: L.y - LAYER_H / 2 }; }
    return { x: head.x, y: head.y - HEAD_R };
  }
  function catchPoint() { return CATCH_AT_STACK_TOP ? topOfStack() : { x: head.x, y: head.y - HEAD_R }; }

  // ---- items ------------------------------------------------------------
  var SPEEDS = { bun_b: 230, patty: 240, cheese: 235, bun_t: 225, ketchup: 520, mustard: 140, pickle: 250, onion: 135 };
  function spawn(e) {
    var it = { kind: e.kind, x: e.x * W, y: -24, vx: 0, vy: SPEEDS[e.kind], r: 15, age: 0, col: e.col, wob: Math.random() * 6.28 };
    if (e.kind === "pickle") it.vx = 220 * (e.vx || 1);
    if (e.kind === "mustard") it.r = 14;
    if (e.kind === "onion") it.r = 17;
    items.push(it);
  }
  function stepItems(dt) {
    var cp = catchPoint();
    var legal = nextLegal(layers.length ? layers[layers.length - 1].kind : null);
    for (var i = items.length - 1; i >= 0; i--) {
      var it = items[i];
      it.age += dt;
      if (it.kind === "mustard") it.vx = Math.sin(it.age * 2.1 + it.wob) * 70;
      if (it.kind === "onion" && it.age > 1.1 && it.age < 2.2) {
        var tgt = topOfStack();
        it.vx += Math.max(-350, Math.min(350, (tgt.x - it.x) * 3)) * dt;
        it.vy += Math.max(-200, Math.min(200, (tgt.y - it.y) * 1.5)) * dt;
      }
      it.x += it.vx * dt; it.y += it.vy * dt;
      if (it.kind === "pickle") {
        if (it.x < it.r) { it.x = it.r; it.vx = Math.abs(it.vx); }

    var top = el("div", "panel-top"); top.appendChild(el("span", "game", "🍔 Unkle Lijah's Jetpack")); top.appendChild(el("span", null, Arcade.cardDate())); panel.appendChild(top);
    panel.appendChild(el("p", null, (r.mode === "daily" ? "Daily" : "Free Play · " + PARTS[equipped].name) + (r.score >= best && r.score > 0 ? " · 🎉 best" : "")));
    panel.appendChild(el("div", "big", r.score + " 🍔"));
    panel.appendChild(el("p", null, r.caught + " caught · " + r.spills + " spill" + (r.spills === 1 ? "" : "s")));
    panel.appendChild(el("div", "foot", "lettuce arcade"));
    var hint = el("div", "hint");
    var row = el("div", "row");
    var share = el("button", "btn quiet", "Share");
    Arcade.shareButton(share, hint, function () { return { text: "🍔 Unkle Lijah's Jetpack · " + (r.mode === "daily" ? "Daily " : "") + r.score + " burgers · " + r.spills + " spills", title: "Unkle Lijah's Jetpack" }; });
    row.appendChild(share);
    row.appendChild(button("Again", "primary", showStart));
    openCard([panel, row, hint]);
    if (r.score > 0 && r.score >= best) { Arcade.confetti(["#ffe066", "#e0a75b", "#ffd23f", "#fff"]); }
  }

  // ---- loadout ----------------------------------------------------------
  var idleCv, idleTimer = null, iPack, iHead, iLayers;
  function showLoadout() {
    var kids = [el("h2", null, "Loadout")];
    idleCv = el("canvas"); idleCv.id = "idle";
    kids.push(idleCv);
    var pile = el("div", "pile"); pile.appendChild(el("span", null, "banked")); var pb = el("b", null, burgers + " 🍔"); pile.appendChild(pb); kids.push(pile);
    var pcv = el("canvas"); pcv.id = "pilecv"; kids.push(pcv);
    var shop = el("div", "shop");
    shop.appendChild(el("h3", null, "Pack parts · one equipped"));
    Object.keys(PARTS).forEach(function (id) { shop.appendChild(shopItem(PARTS[id].name, PARTS[id].blurb, PARTS[id].cost, id, null, equipped === id, function () { equipped = id; })); });
    shop.appendChild(el("h3", null, "Paint"));
    PAINTS.forEach(function (p) { shop.appendChild(shopItem(p.name, null, p.cost, p.id, p.color, paint === p.id, function () { paint = p.id; })); });
    shop.appendChild(el("h3", null, "Exhaust"));
    EXHAUSTS.forEach(function (p) { shop.appendChild(shopItem(p.name, null, p.cost, p.id, p.color, exhaust === p.id, function () { exhaust = p.id; })); });
    shop.appendChild(el("h3", null, "Hat"));
    HATS.forEach(function (p) { shop.appendChild(shopItem(p.name, null, p.cost, p.id, null, hat === p.id, function () { hat = p.id; })); });
    kids.push(shop);
    kids.push(button("Back", "primary", showStart));
    openCard(kids);
    startIdle();
    drawPile(pcv);
  }
  function shopItem(name, blurb, cost, id, swatch, on, equip) {
    var row = el("div", "item" + (on ? " on" : ""));
    if (swatch) { var sw = el("span", "sw"); sw.style.background = swatch; row.appendChild(sw); }
    var t = el("div", "t", name); if (blurb) t.appendChild(el("small", null, blurb)); row.appendChild(t);
    var b;
    if (on) { b = button("Equipped", "quiet", function () {}); b.disabled = true; }
    else if (has(id)) b = button("Equip", "", function () { equip(); saveAll(); showLoadout(); });
    else { b = button(cost + " 🍔", "quiet", function () { if (burgers < cost) return; burgers -= cost; owned.push(id); equip(); saveAll(); showLoadout(); }); if (burgers < cost) b.disabled = true; }
    row.appendChild(b);
    return row;
  }
  function drawPile(pcv) {
    var r = pcv.getBoundingClientRect(); var dpr = Math.min(2, window.devicePixelRatio || 1);
    pcv.width = Math.round(r.width * dpr); pcv.height = Math.round(56 * dpr);
    var c = pcv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = Math.min(burgers, 300), perRow = Math.floor(r.width / 14), saved = ctx; ctx = c;
    for (var i = 0; i < n; i++) {
      var row = Math.floor(i / perRow), col = i % perRow;
      var x = 8 + col * 14 + (row % 2) * 7, y = 48 - row * 9;
      ctx.save(); ctx.translate(x, y); ctx.scale(0.32, 0.32);
      drawItem("bun_b", 0, 8, 0, 1); drawItem("patty", 0, 0, 0, 1); drawItem("cheese", 0, -6, 0, 1); drawItem("bun_t", 0, -14, 0, 1);
      ctx.restore();
    }
    ctx = saved;
  }
  // Lijah idles on the loadout screen and flops when tugged.
  function startIdle() {
    stopIdle();
    var r = idleCv.getBoundingClientRect(); var dpr = Math.min(2, window.devicePixelRatio || 1);
    idleCv.width = Math.round(r.width * dpr); idleCv.height = Math.round(220 * dpr);
    var c = idleCv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    var iw = r.width;
    iPack = { x: iw / 2, y: 60 }; iHead = mkPoint(iw / 2, 60 + ROD * 1.5); iLayers = [];
    var prm = partParams(equipped), t = 0;
    idleCv.addEventListener("pointerdown", function (e) { var rr2 = idleCv.getBoundingClientRect(); iHead.px = iHead.x - (e.clientX - rr2.left - iHead.x) * 0.4; iHead.py = iHead.y + 6; });
    idleTimer = setInterval(function () {
      t += 1 / 60;
      iPack.x = iw / 2 + Math.sin(t * 0.9) * 10; iPack.y = 58 + Math.sin(t * 1.7) * 4;
      verlet(iHead, 1 / 60, 0.99); constrain(iHead, iPack.x, iPack.y, ROD * 1.5);
      c.clearRect(0, 0, iw, 220);
      drawLijah(c, iPack, iHead, iLayers, { x: 0, y: -0.3 }, prm, true);
    }, 1000 / 60);
  }
  function stopIdle() { if (idleTimer) { clearInterval(idleTimer); idleTimer = null; } }

  // ---- menu -------------------------------------------------------------
  Arcade.menuButton({
    rules: HELP,
    canOpen: function () { return phase !== "play"; },
    actions: [{ label: "New run", confirm: "This run is gone. Nothing banked is lost.", onClick: function () { phase = "card"; showStart(); } }],
    describeSave: function () { return burgers + " 🍔 banked · best daily " + bestDaily + " · " + PARTS[equipped].name + " equipped."; }
  });

  // ---- boot -------------------------------------------------------------
  window.__lijah = { get params() { return params; }, get run() { return run; }, get layers() { return layers; }, get items() { return items; }, get head() { return head; }, get pack() { return pack; }, get cp() { return catchPoint(); }, get legal() { return nextLegal(layers.length ? layers[layers.length - 1].kind : null); }, makeSchedule: makeSchedule };
  function start() {
    resize();
    saveAll();
    resetLijah();
    thrust = { x: 0, y: 0 };
    params = partParams(equipped);
    draw();
    showStart();
    if (TURBO) startRun(Q.get("mode") === "daily" ? "daily" : "free");
  }
  Arcade.boot(start);
</script>
