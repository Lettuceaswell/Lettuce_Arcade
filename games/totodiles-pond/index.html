<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Totodile's Pond — Lettuce Arcade</title>
<meta name="theme-color" content="#083734">
<link rel="stylesheet" href="/shared/arcade.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    overflow: hidden;
    padding: 0;
  }

  /* ---- the pond scene ------------------------------------------------ */

  .scene {
    position: relative;
    flex: 1 1 auto;
    overflow: hidden;
    transition: background 1.2s linear;
  }

  .water {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 60%;
    transition: background 1.2s linear;
  }

  /* The pond is the screen, so the water needs to read as deep rather than as
     a flat slab: a bright surface line and a darkening toward the bottom. */
  .water::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 3px;
    background: rgba(255, 255, 255, 0.35);
  }

  .depthfade {
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(0, 0, 0, 0) 20%, rgba(0, 0, 0, 0.38));
    pointer-events: none;
  }

  /* Three offset ripple bands. Cheap, and it reads as moving water. */
  .ripple {
    position: absolute;
    height: 2px;
    background: rgba(255, 255, 255, 0.18);
    border-radius: 50%;
    animation: drift-x 7s ease-in-out infinite alternate;
  }

  .ripple.r1 { top: 6%;  left: 8%;  width: 32%; animation-duration: 7s; }
  .ripple.r2 { top: 13%; left: 54%; width: 28%; animation-duration: 9s; animation-direction: alternate-reverse; }
  .ripple.r3 { top: 22%; left: 26%; width: 22%; animation-duration: 11s; opacity: 0.55; }

  @keyframes drift-x {
    from { transform: translateX(-6%); }
    to   { transform: translateX(6%); }
  }

  /* Sun by day, moon by night, and it moves. The palette alone tells you
     roughly when it is; a disc that climbs and sets tells you exactly. */
  .disc {
    position: absolute;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
    transition: background 1.2s linear, top 1.2s linear, left 1.2s linear,
                box-shadow 1.2s linear;
  }

  /* A silhouetted far bank. Reads correctly in every phase because it's a
     shape, not a colour, and it gives the sky something to end against. */
  .bank {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(60% - 2px);
    height: 30px;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(58% 100% at 14% 100%, #14403a 0 99%, transparent 100%),
      radial-gradient(72% 128% at 60% 100%, #10352f 0 99%, transparent 100%),
      radial-gradient(48% 88% at 93% 100%, #14403a 0 99%, transparent 100%);
    background-repeat: no-repeat;
  }

  /* ---- header readouts ----------------------------------------------- */

  .topbar {
    position: relative;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    padding: calc(10px + var(--safe-top)) calc(12px + var(--safe-right)) 6px 12px;
    font-size: 0.85rem;
    color: var(--fg-dim);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
  }

  .topbar .day { font-weight: 700; color: var(--fg); }
  .topbar .mood { font-style: italic; }

  .mute {
    background: rgba(0, 0, 0, 0.28);
    border: none;
    color: var(--fg);
    font-size: 1rem;
    min-width: 44px;
    min-height: 44px;
    border-radius: 12px;
    cursor: pointer;
  }

  /* ---- the creature --------------------------------------------------- */

  .creature-slot {
    position: absolute;
    left: 50%;
    bottom: 48%;
    transform: translateX(-50%);
    z-index: 2;
    text-align: center;
  }

  .creature-slot.hidden { display: none; }

  .creature {
    display: block;
    width: 168px;
    height: 168px;
    /* 80x80 source upscaled — keep the sprite edges hard, not smeared. */
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    -ms-interpolation-mode: nearest-neighbor;
    animation: bob 3.4s ease-in-out infinite;
    transform-origin: 50% 100%;
  }

  .creature.big { width: 198px; height: 198px; }
  .creature.huge { width: 228px; height: 228px; }

  @keyframes bob {
    0%, 100% { transform: translateY(0) scaleY(1); }
    50%      { transform: translateY(-7px) scaleY(1.03); }
  }

  .creature.happy { animation: hop 0.55s ease-out 3; }

  @keyframes hop {
    0%   { transform: translateY(0) scale(1, 1); }
    25%  { transform: translateY(-26px) scale(0.94, 1.08); }
    55%  { transform: translateY(0) scale(1.08, 0.92); }
    100% { transform: translateY(0) scale(1, 1); }
  }

  .creature.wiggle { animation: wiggle 0.5s ease-in-out 5; }

  @keyframes wiggle {
    0%, 100% { transform: rotate(0deg); }
    25%      { transform: rotate(-7deg); }
    75%      { transform: rotate(7deg); }
  }

  .creature.asleep {
    animation: snooze 5s ease-in-out infinite;
    transform: rotate(16deg) translateY(10px);
    filter: brightness(0.6) saturate(0.7);
  }

  @keyframes snooze {
    0%, 100% { transform: rotate(16deg) translateY(10px) scaleY(1); }
    50%      { transform: rotate(16deg) translateY(6px) scaleY(1.05); }
  }

  .zzz {
    position: absolute;
    top: -6px;
    right: -6px;
    font-size: 1.4rem;
    opacity: 0;
    animation: zzz-rise 4s ease-out infinite;
  }

  @keyframes zzz-rise {
    0%   { opacity: 0; transform: translate(0, 0) scale(0.7); }
    30%  { opacity: 0.9; }
    100% { opacity: 0; transform: translate(16px, -34px) scale(1.2); }
  }

  /* A chip, not bare text — it sits over whatever he's standing next to. */
  .name-tag {
    display: inline-block;
    margin-top: 4px;
    padding: 2px 10px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.35);
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--fg);
  }

  /* ---- he's down there ------------------------------------------------- */

  .divespot {
    position: absolute;
    left: 50%;
    bottom: 30%;
    transform: translateX(-50%);
    z-index: 2;
    display: none;
    text-align: center;
    width: 220px;
  }

  .divespot.on { display: block; }

  .bub {
    display: inline-block;
    width: 12px;
    height: 12px;
    margin: 0 5px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.42);
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.85);
    animation: rise 2.6s ease-in infinite;
  }

  .bub:nth-child(2) { width: 8px; height: 8px; animation-delay: 0.7s; }
  .bub:nth-child(3) { width: 16px; height: 16px; animation-delay: 1.4s; }

  @keyframes rise {
    0%   { transform: translateY(14px); opacity: 0; }
    25%  { opacity: 0.85; }
    100% { transform: translateY(-52px); opacity: 0; }
  }

  .divespot .lbl {
    display: inline-block;
    margin-top: 10px;
    padding: 3px 12px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.35);
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--fg);
  }

  /* ---- decor and traces -------------------------------------------------- */

  .decor {
    position: absolute;
    font-size: 1.9rem;
    line-height: 1;
    z-index: 1;
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.35));
    animation: bob 5s ease-in-out infinite;
  }

  /* Traces are things he did, not things you bought. Slightly smaller. */
  .decor.trace { font-size: 1.5rem; opacity: 0.95; }

  /* ---- weather -------------------------------------------------------- */

  .weather-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 4;
    overflow: hidden;
  }

  .drop {
    position: absolute;
    top: -12%;
    width: 2px;
    height: 16px;
    background: rgba(220, 245, 255, 0.55);
    animation: fall linear infinite;
  }

  @keyframes fall {
    to { transform: translateY(120vh); }
  }

  .fog {
    position: absolute;
    inset: 0;
    background: rgba(220, 240, 245, 0.16);
    backdrop-filter: blur(1px);
  }

  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 4s ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.25; }
    50%      { opacity: 1; }
  }

  /* ---- reaction + drift ------------------------------------------------ */

  .reaction {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 18%;
    z-index: 5;
    text-align: center;
    font-size: 1.05rem;
    font-weight: 600;
    min-height: 1.5em;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    pointer-events: none;
    transition: opacity 0.5s linear;
  }

  .reaction.fade { opacity: 0; }

  .card-wrap {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(4, 24, 26, 0.72);
  }

  .card-wrap.on { display: flex; }

  .card {
    background: var(--bg-elevated);
    border-radius: 18px;
    padding: 22px 20px;
    max-width: 340px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  }

  .card .art { font-size: 2.6rem; line-height: 1; margin-bottom: 10px; }
  .card .body { font-size: 1.05rem; line-height: 1.45; }
  .card .sub { margin-top: 10px; font-size: 0.9rem; color: var(--fg-dim); }
  .card .tap { margin-top: 16px; font-size: 0.8rem; opacity: 0.65; }

  /* ---- readouts + buttons ---------------------------------------------- */

  .readouts {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 14px;
    padding: 8px 12px;
    font-size: 0.9rem;
    background: rgba(0, 0, 0, 0.22);
  }

  .readouts span { white-space: nowrap; }
  .readouts .hungry { color: #ffd166; font-weight: 700; }
  .readouts .ready { color: #9dffb0; font-weight: 700; }
  .readouts .off { display: none; }

  .actions {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    padding: 8px calc(8px + var(--safe-right)) calc(10px + var(--safe-bottom)) calc(8px + var(--safe-left));
    background: rgba(0, 0, 0, 0.3);
  }

  .act {
    min-height: 64px;
    border: none;
    border-radius: 14px;
    background: var(--accent);
    color: #04302c;
    font-size: 0.76rem;
    font-weight: 800;
    letter-spacing: 0.02em;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
    padding: 4px 2px;
  }

  .act .ico { font-size: 1.3rem; line-height: 1; }
  .act:active { background: var(--accent-dim); }
  .act:disabled { opacity: 0.38; cursor: default; }
  .act.alert { background: #ffd166; }

  /* ---- picker sheet (feed / play / dive / cast) -------------------------- */

  .wheel-wrap {
    position: fixed;
    inset: 0;
    z-index: 25;
    display: none;
    align-items: flex-end;
    justify-content: center;
    background: rgba(4, 24, 26, 0.7);
  }

  .wheel-wrap.on { display: flex; }

  .wheel {
    width: 100%;
    max-width: 460px;
    max-height: 86%;
    overflow-y: auto;
    background: var(--bg-elevated);
    border-radius: 18px 18px 0 0;
    padding: 16px 12px calc(16px + var(--safe-bottom));
  }

  .wheel h2 { font-size: 1rem; text-align: center; margin-bottom: 12px; }

  .wheel-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .wheel-grid.wide { grid-template-columns: 1fr; }

  .pick {
    min-height: 72px;
    border: none;
    border-radius: 14px;
    background: rgba(0, 0, 0, 0.25);
    color: var(--fg);
    font-size: 0.78rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    padding: 8px 6px;
    text-align: center;
  }

  .wheel-grid.wide .pick {
    flex-direction: row;
    justify-content: flex-start;
    gap: 12px;
    text-align: left;
    min-height: 62px;
  }

  .wheel-grid.wide .pick .txt { flex: 1; }
  .wheel-grid.wide .pick .nm { font-size: 0.95rem; font-weight: 700; }

  .pick .ico { font-size: 1.7rem; line-height: 1; }
  .pick .sub { font-size: 0.72rem; color: var(--fg-dim); font-weight: 400; }
  .pick:active { background: rgba(0, 0, 0, 0.45); }
  .pick:disabled { opacity: 0.42; cursor: default; }
  .pick .heart { color: #ff8fa3; font-size: 0.72rem; }

  /* ---- pond overlay ------------------------------------------------------ */

  .sheet-wrap {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: none;
    background: #06282b;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .sheet-wrap.on { display: block; }

  .sheet {
    max-width: 460px;
    margin: 0 auto;
    padding: calc(64px + var(--safe-top)) 14px calc(96px + var(--safe-bottom));
  }

  .sheet h2 { font-size: 1.1rem; margin: 18px 0 8px; }
  .sheet h2:first-child { margin-top: 0; }
  .sheet .hint { font-size: 0.85rem; color: var(--fg-dim); margin-bottom: 10px; }

  .who {
    text-align: center;
    padding: 4px 0 10px;
  }

  .who .nm { font-size: 1.4rem; font-weight: 800; }
  .who .sub { font-size: 0.88rem; color: var(--fg-dim); margin-top: 2px; }
  .who .trait { margin-top: 8px; font-size: 0.92rem; }
  .who .trait b { color: #ffd166; }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .slot {
    aspect-ratio: 1;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.07);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    gap: 2px;
    padding: 2px;
  }

  .slot.empty { color: rgba(255, 255, 255, 0.18); font-size: 1.2rem; }
  .slot .lbl { font-size: 0.55rem; color: var(--fg-dim); text-align: center; line-height: 1.1; }

  .keep-row, .shop-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.06);
    margin-bottom: 8px;
  }

  .keep-row .ico, .shop-row .ico { font-size: 1.6rem; }
  .shop-row .nm { flex: 1; font-size: 0.95rem; }
  .keep-row .txt { flex: 1; font-size: 0.88rem; line-height: 1.35; }
  .keep-row .txt em { color: var(--fg-dim); font-style: italic; }
  .keep-row .txt .when { display: block; font-size: 0.75rem; color: var(--fg-dim); margin-top: 3px; }

  .jrn {
    font-size: 0.9rem;
    line-height: 1.4;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.09);
  }

  .jrn .when { font-size: 0.72rem; color: var(--fg-dim); display: block; }

  .buy {
    min-height: 44px;
    min-width: 72px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #04302c;
    font-weight: 800;
    font-size: 0.85rem;
    cursor: pointer;
  }

  .buy:disabled { opacity: 0.4; cursor: default; }
  .buy.owned { background: transparent; color: var(--fg-dim); font-weight: 600; }

  .sheet-close {
    position: sticky;
    bottom: calc(10px + var(--safe-bottom));
    display: block;
    width: 100%;
    margin-top: 22px;
    box-shadow: 0 0 0 10px #06282b, 0 -10px 20px rgba(6, 40, 43, 0.95);
  }

  /* ---- naming (first run) ------------------------------------------------ */

  .naming {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    background: rgba(4, 24, 26, 0.96);
    text-align: center;
  }

  .naming.on { display: flex; }
  .naming img { width: 140px; height: 140px; image-rendering: pixelated; }
  .naming p { font-size: 1.05rem; }

  .naming input {
    width: 100%;
    max-width: 280px;
    min-height: 52px;
    border-radius: 12px;
    border: 2px solid var(--accent);
    background: rgba(0, 0, 0, 0.3);
    color: var(--fg);
    font-size: 1.2rem;
    text-align: center;
    padding: 8px;
  }

  /* ---- evolution ---------------------------------------------------------- */

  .evo {
    position: fixed;
    inset: 0;
    z-index: 45;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(255, 255, 255, 0.96);
    color: #04302c;
    text-align: center;
    padding: 24px;
  }

  .evo.on { display: flex; }
  .evo img { width: 180px; height: 180px; image-rendering: pixelated; animation: evo-pulse 1.1s ease-in-out infinite; }
  .evo h2 { font-size: 1.6rem; }
  .evo p { white-space: pre-line; }

  @keyframes evo-pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.09); }
  }

  @media (prefers-reduced-motion: reduce) {
    .creature, .decor, .ripple, .drop, .star, .zzz, .evo img, .bub {
      animation-duration: 8s !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>

<div class="topbar">
  <span id="clock"></span>
  <span class="day" id="daycount"></span>
  <span class="mood" id="moodline"></span>
  <button class="mute" id="mute" aria-label="Toggle sound">&#128266;</button>
</div>

<div class="scene" id="scene">
  <div class="weather-layer" id="weather"></div>
  <div class="disc" id="disc"></div>
  <div class="bank"></div>
  <div class="water" id="water">
    <div class="ripple r1"></div>
    <div class="ripple r2"></div>
    <div class="ripple r3"></div>
    <div class="depthfade"></div>
  </div>

  <div class="creature-slot" id="creatureslot">
    <img class="creature" id="sprite" src="totodile.png" alt="Totodile" width="140" height="140">
    <span class="zzz" id="zzz" aria-hidden="true">z</span>
    <div class="name-tag" id="nametag"></div>
  </div>

  <div class="divespot" id="divespot">
    <span class="bub"></span><span class="bub"></span><span class="bub"></span>
    <span class="lbl" id="divelbl"></span>
  </div>

  <div class="reaction" id="reaction" aria-live="polite"></div>
</div>

<div class="card-wrap" id="cardwrap">
    <div class="card">
      <div class="art" id="cardart"></div>
      <div class="body" id="cardbody"></div>
      <div class="sub" id="cardsub"></div>
      <div class="tap">tap to continue</div>
    </div>
  </div>

  <div class="wheel-wrap" id="wheelwrap">
    <div class="wheel">
      <h2 id="wheeltitle"></h2>
      <div class="wheel-grid" id="wheelgrid"></div>
    </div>
  </div>

  <div class="sheet-wrap" id="sheetwrap">
    <div class="sheet">
      <div class="who">
        <div class="nm" id="whoname"></div>
        <div class="sub" id="whosub"></div>
        <div class="trait" id="whotrait"></div>
      </div>

      <h2>Today</h2>
      <div class="hint" id="todayline"></div>

      <h2>What he likes</h2>
      <div class="hint" id="likesline"></div>

      <h2>Keepsakes</h2>
      <div class="hint" id="keephint"></div>
      <div id="keeplist"></div>

      <h2>Collection</h2>
      <div class="hint" id="collhint"></div>
      <div class="grid" id="collgrid"></div>

      <h2>The pond</h2>
      <div class="hint" id="dropline"></div>
      <div id="shoplist"></div>

      <h2>Journal</h2>
      <div class="hint" id="jrnhint"></div>
      <div id="jrnlist"></div>

      <button class="btn sheet-close" id="sheetclose">Close</button>
    </div>
  </div>

  <div class="naming" id="naming">
    <img src="totodile.png" alt="Totodile" width="140" height="140">
    <p>A little Totodile has moved into your pond.<br>What will you call him?</p>
    <input id="nameinput" maxlength="12" value="Totodile" aria-label="Name">
    <button class="btn" id="namego">That's his name</button>
  </div>

  <div class="evo" id="evo">
    <h2 id="evotitle"></h2>
    <img id="evoimg" src="totodile.png" alt="">
    <p id="evobody"></p>
    <button class="btn" id="evogo">Wow</button>
</div>

<div class="readouts">
  <span id="r-appetite"></span>
  <span id="r-line"></span>
  <span id="r-dive"></span>
  <span id="r-drops"></span>
</div>

<div class="actions">
  <button class="act" id="a-feed"><span class="ico">&#127830;</span><span class="lbl">FEED</span></button>
  <button class="act" id="a-play"><span class="ico">&#127994;</span><span class="lbl">PLAY</span></button>
  <button class="act" id="a-dive"><span class="ico">&#127754;</span><span class="lbl">DIVE</span></button>
  <button class="act" id="a-cast"><span class="ico">&#127907;</span><span class="lbl">CAST</span></button>
  <button class="act" id="a-pond"><span class="ico">&#129704;</span><span class="lbl">POND</span></button>
</div>

<script src="/shared/arcade.js"></script>
<script>
(function () {
  "use strict";

  var HOUR = 3600000;
  var DAY = 86400000;
  var MIN = 60000;
  var SAVE_V = 2;

  function clamp(n, lo, hi) { return n < lo ? lo : (n > hi ? hi : n); }

  function byId(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function pickWeighted(list, rnd) {
    var total = 0, i;
    for (i = 0; i < list.length; i++) total += list[i].w;
    var roll = rnd() * total;
    for (i = 0; i < list.length; i++) {
      roll -= list[i].w;
      if (roll <= 0) return list[i];
    }
    return list[list.length - 1];
  }

  // Sleep window in local hours. inWindow() wraps midnight, so SLEEP_FROM may
  // be later than SLEEP_TO (23 -> 5) or earlier (1 -> 5); these two numbers are
  // the only thing to edit when the window moves.
  var SLEEP_FROM = 1, SLEEP_TO = 5;

  function inWindow(h, from, to) {
    return from <= to ? (h >= from && h < to) : (h >= from || h < to);
  }

  function phase() {
    var h = new Date().getHours();
    if (inWindow(h, SLEEP_FROM, SLEEP_TO)) return "night";
    if (h >= 20 || h < SLEEP_FROM) return "evening";
    if (h < 8) return "dawn";
    if (h < 12) return "morning";
    if (h < 17) return "afternoon";
    return "dusk";
  }

  function asleep() { return phase() === "night"; }

  // One "night" spans midnight, so it's keyed off the day the evening began.
  function nightKey() { return dayKey(Date.now() - SLEEP_TO * HOUR); }

  function blip(freq, dur, type, vol) {
    var ctx = Arcade.audioCtx;

    try {

      var gain = ctx.createGain();
      osc.type = type || "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol || 0.14, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + (dur || 0.18));
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + (dur || 0.18));
    } catch (e) { /* no audio; game continues silently */ }
  }

    var p = SKY[phase()];
    scene.style.background = p.sky;
    water.style.background = p.water;
    var d = $("disc");
    d.style.background = p.disc;
    d.style.left = p.x + "%";
    d.style.top = p.y + "%";
    d.style.boxShadow = "0 0 44px 14px " + p.glow;
  }

  function paintWeather() {
    var layer = $("weather");
    layer.innerHTML = "";
    var wx = weatherToday();
    var i, el;

    if (phase() === "night") {
      for (i = 0; i < 26; i++) {
        el = document.createElement("div");
        el.className = "star";
        el.style.left = (Math.random() * 100) + "%";
        el.style.top = (Math.random() * 45) + "%";
        el.style.animationDelay = (Math.random() * 4) + "s";
        layer.appendChild(el);
      }
    }

    if (wx === "rain") {
      for (i = 0; i < 34; i++) {
        el = document.createElement("div");
        el.className = "drop";
        el.style.left = (Math.random() * 100) + "%";
        el.style.animationDuration = (0.5 + Math.random() * 0.5) + "s";
        el.style.animationDelay = (Math.random() * 1.2) + "s";
        layer.appendChild(el);
      }
    } else if (wx === "fog") {
      el = document.createElement("div");
      el.className = "fog";
      layer.appendChild(el);
    }
  }

  function paintDecor() {
    var old = scene.querySelectorAll(".decor");
    for (var i = 0; i < old.length; i++) old[i].remove();

    function place(def, extraCls, idx) {
      var el = document.createElement("div");
      el.className = "decor" + extraCls;
      el.textContent = def.ico;
      el.style.left = def.x + "%";
      el.style.top = def.y + "%";
      el.style.animationDelay = (idx * 0.4) + "s";
      el.setAttribute("aria-hidden", "true");
      scene.appendChild(el);
    }

    S.decor.forEach(function (id, idx) {
      var d = byId(DECOR, id);
      if (d) place(d, "", idx);
    });
    S.traces.forEach(function (id, idx) {
      var t = byId(TRACES, id);
      if (t) place(t, " trace", idx + 3);
    });
  }

  function paintSprite() {
    var st = STAGES[stage()];
    var diving = !!S.dive;
    var sleeping = asleep();
    var key = [st.id, sleeping ? 1 : 0, diving ? 1 : 0, animCls, S.name].join("|");
    if (key === lastSpriteKey) return;   // never restart a running animation
    lastSpriteKey = key;

    $("creatureslot").className = "creature-slot" + (diving ? " hidden" : "");
    $("divespot").className = "divespot" + (diving ? " on" : "");

    if (diving) return;
    if (sprite.getAttribute("src") !== st.file) sprite.src = st.file;
    sprite.alt = S.name + " the " + st.name;
    sprite.className = "creature " + st.cls + (sleeping ? " asleep" : "") + (animCls ? " " + animCls : "");
    $("zzz").style.display = sleeping ? "block" : "none";
    $("nametag").textContent = S.name;
  }

  function react(text, anim) {
    var el = $("reaction");
    el.textContent = text;
    el.className = "reaction";
    if (reactTimer) clearTimeout(reactTimer);
    reactTimer = setTimeout(function () { el.className = "reaction fade"; }, 6000);

    if (anim && !asleep() && !S.dive) {
      animCls = anim;
      paintSprite();
      if (animTimer) clearTimeout(animTimer);
      animTimer = setTimeout(function () { animCls = ""; paintSprite(); }, 2600);
    }
  }

  function lineLeft() { return S.line ? S.line.castAt + S.line.ms - Date.now() : 0; }
  function diveLeft() { return S.dive ? S.dive.startAt + S.dive.ms - Date.now() : 0; }

  function paintReadouts() {
    var ap = appetite();
    var apEl = $("r-appetite");
    apEl.textContent = "🍖 " + APPETITE_WORD[ap];
    apEl.className = ap === 2 ? "hungry" : "";

    var lnEl = $("r-line");
    if (!S.line) {
      lnEl.textContent = "🎣 no line";
      lnEl.className = "";
    } else if (lineLeft() <= 0) {
      lnEl.textContent = "🎣 ready!";
      lnEl.className = "ready";
    } else {
      lnEl.textContent = "🎣 " + fmtLeft(lineLeft());
      lnEl.className = "";
    }

    var dvEl = $("r-dive");
    if (!S.dive) {
      dvEl.className = "off";
    } else if (diveLeft() <= 0) {
      dvEl.textContent = "🫧 surfacing";
      dvEl.className = "ready";
    } else {
      dvEl.textContent = "🫧 " + fmtLeft(diveLeft());
      dvEl.className = "";
    }

    $("r-drops").textContent = "💧 " + S.drops;

    var d = new Date();
    $("clock").textContent = weatherIcon() + " " +
      String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    $("daycount").textContent = "day " + ageDays();
    $("moodline").textContent = mood();

    if (S.dive) {
      $("divelbl").textContent = diveLeft() <= 0
        ? "coming up!"
        : S.name + " is in " + byId(TIERS, S.dive.tier).name;
    }

    paintActions();
  }

  function ageDays() {
    if (!S.born) return 1;
    return Math.max(1, Math.floor((Date.now() - S.born) / DAY) + 1);
  }

  function setBtn(id, ico, label, cls, disabled) {
    var b = $(id);
    b.querySelector(".ico").textContent = ico;
    b.querySelector(".lbl").textContent = label;
    b.className = "act" + (cls ? " " + cls : "");
    b.disabled = !!disabled;
  }

  function paintActions() {
    var sleeping = asleep();
    var diving = !!S.dive;
    var ap = appetite();

    // FEED — off while he's asleep or underwater; highlighted when he's hungry.
    setBtn("a-feed", "🍖", "FEED", (!sleeping && !diving && ap === 2) ? "alert" : "",
      sleeping || diving);

    // PLAY becomes TUCK at night. Casting and tucking are the two things the
    // night screen is for, so neither is ever disabled without cause.
    if (sleeping) {
      var tucked = S.tuckNight === nightKey();
      setBtn("a-play", "🛌", "TUCK", tucked ? "" : "alert", tucked);
    } else {
      setBtn("a-play", "🎽", "PLAY", "", diving);
    }

    // DIVE
    if (!diving) {
      setBtn("a-dive", "🌊", "DIVE", "", sleeping);
    } else if (diveLeft() > 0) {
      setBtn("a-dive", "🫧", "DOWN", "", true);
    } else {
      setBtn("a-dive", "❗", "UP!", "alert", false);
    }

    // CAST
    if (!S.line) {
      setBtn("a-cast", "🎣", "CAST", "", false);
    } else if (lineLeft() > 0) {
      setBtn("a-cast", "🎣", "WAIT", "", true);
    } else {
      setBtn("a-cast", "❗", "REEL", "alert", false);
    }

    setBtn("a-pond", "🪷", "POND", "", false);
  }

  // ---- cards ---------------------------------------------------------------

  var cardQueue = [];

  function showCard(art, body, sub) {
    cardQueue.push({ art: art, body: body, sub: sub || "" });
    if (!$("cardwrap").classList.contains("on")) nextCard();
  }

  function nextCard() {
    if (cardQueue.length === 0) {
      $("cardwrap").classList.remove("on");
      return;
    }
    var c = cardQueue.shift();
    $("cardart").textContent = c.art;
    $("cardbody").textContent = c.body;
    $("cardsub").textContent = c.sub;
    $("cardwrap").classList.add("on");
  }

  $("cardwrap").addEventListener("click", nextCard);

  // ---- the open sequence ----------------------------------------------------

  // Everything he did while you were gone. This is the engine: it must produce
  // content for absence, and some of that content must be a physical object.
  function doDrift() {
    if (!S.lastSeen) return;
    var away = Date.now() - S.lastSeen;
    if (away < 0) { S.lastSeen = Date.now(); return; }  // clock moved back
    away = Math.min(away, 10 * DAY);                     // cap tampering
    var hrs = away / HOUR;

    var bucket;
    if (hrs < 1) bucket = "t0";
    else if (hrs < 6) bucket = "t1";
    else if (hrs < 24) bucket = "t6";
    else if (hrs < 72) bucket = "t24";
    else bucket = "t72";

    var rnd = Arcade.seededRandom("drift:" + S.lastSeen + ":" + S.born);
    var ev;

    // A night peek gets its own quiet pool — but only for a short absence. If
    // you've been gone a day or three, the big card fires at 2am the same as
    // it would at noon. v1 threw that content away entirely; never again.
    if (asleep() && (bucket === "t0" || bucket === "t1")) {
      ev = DRIFT.night[Math.floor(rnd() * DRIFT.night.length)];
    } else {
      // History-aware lines get a real share of the draw for short and medium
      // absences — they're the whole reason the pond feels like it remembers
      // you. They are NEVER allowed to substitute for the 1-day and 3-day
      // cards: those are the payoff for being away, and a callback landing
      // instead of "he's just glad you're back" is a worse game.
      var dyn = (bucket === "t24" || bucket === "t72") ? [] : dynamicDrift();
      if (dyn.length && rnd() < 0.4) {
        ev = dyn[Math.floor(rnd() * dyn.length)];
      } else {
        var pool = DRIFT[bucket];
        ev = pool[Math.floor(rnd() * pool.length)];
      }
    }

    var gained = ev.drops || 0;
    if (gained && trait().id === "shy") gained += 1;
    if (gained) S.drops += gained;
    if (ev.trace) addTrace(ev.trace);

    var sub = gained ? "+" + gained + " 💧" : "";
    var gift = null;
    if ((bucket === "t24" || bucket === "t72") && rnd() < 0.3) {
      gift = giveKeepsake();
    }

    showCard(ev.art, ev.txt, sub);
    if (gift) {
      showCard(gift.ico, "He'd been keeping " + gift.name + " for you.", gift.note);
    }

    if (bucket === "t72") {
      react("It missed you.", "wiggle");
      journal("You were away three days. He waited.");
    } else if (bucket === "t24") {
      react("You're back!", "happy");
    }
  }

  // Built fresh at open time out of live state. This is the memory layer
  // surfacing in the place the player already looks.
  function dynamicDrift() {
    var out = [];

    if (S.line) {
      out.push(lineLeft() <= 0
        ? { art: "🎣", txt: "Your line's been tight for a while. He keeps looking at it, then at you." }
        : { art: "🎣", txt: "He's been watching your float. He has not blinked." });
    }

    if (S.dive && diveLeft() > 0) {
      out.push({ art: "🫧", txt: "Still down there. You can see the bubbles from here." });
    }

    if (S.keepsakes.length) {
      var k = byId(KEEPSAKES, S.keepsakes[S.keepsakes.length - 1].id);
      if (k) out.push({ art: k.ico, txt: "He's still got " + k.name + ". He keeps it where he can see it." });
    }

    if (S.decor.length) {
      var d = byId(DECOR, S.decor[S.decor.length - 1]);
      if (d) out.push({ art: d.ico, txt: "He's moved the " + d.name.toLowerCase() + ". It is not where you left it.", drops: 1 });
    }

    if (S.favSeen.food) {
      var f = byId(FOODS, favourites().food);
      if (f) out.push({ art: f.ico, txt: "He's been sitting where the " + f.name.toLowerCase() + " usually turns up." });
    }

    if (S.traces.length >= 3) {
      out.push({ art: "🪺", txt: "He has been busy. The pond is entirely his now.", drops: 3 });
    }

    if (S.careDays >= EVO_AT[0] - 1 && stage() === 0) {
      out.push({ art: "❔", txt: "He feels different today. You can't say how." });
    }

    return out;
  }

  function doDream() {
    var today = Arcade.dailySeed();
    if (S.dreamDay === today) return;
    if (new Date().getHours() < SLEEP_TO) return;  // not awake yet
    S.dreamDay = today;

    var pool = DREAMS.concat(trait().id === "dreamy" ? DREAMY_EXTRA : []);
    var r = Arcade.seededRandom("dream:" + today + ":" + S.born);
    var dream = pool[Math.floor(r() * pool.length)];

    if (dream.boost) {
      S.boostDay = today;
      S.boostTier = dream.boost;
    }
    showCard("💭", dream.txt, dream.boost ? "he keeps looking at the water" : "last night");
  }

  function checkEvolution() {
    var st = stage();
    if (st <= S.stageSeen) return;
    S.stageSeen = st;
    var info = STAGES[st];
    journal(S.name + " became a " + info.name + ".");
    var gift = giveKeepsake();
    save();
    $("evotitle").textContent = "What?";
    $("evoimg").src = info.file;
    $("evoimg").alt = info.name;
    $("evobody").textContent = S.name + " evolved into " + info.name + "!" +
      (gift ? "\n\nHe gave you " + gift.name + "." : "");
    $("evo").classList.add("on");
    melody([523, 659, 784, 1047], 170);
  }

  $("evogo").addEventListener("click", function () {
    $("evo").classList.remove("on");
    lastSpriteKey = "";
    paintSprite();
    paintReadouts();
  });

  // ---- care-days ------------------------------------------------------------

  // A care-day needs *two different* kinds of care in one day. v1 banked one
  // for any single tap, which made evolution an attendance sheet.
  function markCare(kind) {
    var today = Arcade.dailySeed();
    if (S.actDay !== today) { S.actDay = today; S.actKinds = []; }
    if (S.actKinds.indexOf(kind) === -1) S.actKinds.push(kind);
    S.lastCareAt = Date.now();
    if (S.actKinds.length >= 2 && S.lastCareDay !== today) {
      S.lastCareDay = today;
      S.careDays += 1;
      return true;
    }
    return false;
  }

  function careLine() {
    var today = Arcade.dailySeed();
    if (S.lastCareDay === today) return "Day banked. " + S.careDays + " care-days so far.";
    var got = S.actDay === today ? S.actKinds.length : 0;
    return got === 0
      ? "Two different kinds of care today banks a day towards growing up."
      : "One more kind of care today banks the day. (" + S.actKinds.join(", ") + ")";
  }

  // ---- picker sheet ------------------------------------------------------------

  // items: { ico, name, sub, heart, disabled, data }
  function openWheel(title, items, wide, onPick) {
    $("wheeltitle").textContent = title;
    var grid = $("wheelgrid");
    grid.className = "wheel-grid" + (wide ? " wide" : "");
    grid.innerHTML = "";
    items.forEach(function (it) {
      var b = document.createElement("button");
      b.className = "pick";
      b.disabled = !!it.disabled;

      var ico = document.createElement("span");
      ico.className = "ico";
      ico.textContent = it.ico;
      b.appendChild(ico);

      var wrap = document.createElement("span");
      wrap.className = "txt";
      var nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = it.name;
      wrap.appendChild(nm);
      if (it.sub) {
        var sub = document.createElement("span");
        sub.className = "sub";
        sub.textContent = " " + it.sub;
        wrap.appendChild(document.createElement("br"));
        wrap.appendChild(sub);
      }
      b.appendChild(wrap);

      if (it.heart) {
        var h = document.createElement("span");
        h.className = "heart";
        h.textContent = "♥";
        b.appendChild(h);
      }

      b.addEventListener("click", function () {
        if (it.disabled) return;
        $("wheelwrap").classList.remove("on");
        onPick(it.data);
      });
      grid.appendChild(b);
    });
    $("wheelwrap").classList.add("on");
  }

  $("wheelwrap").addEventListener("click", function (e) {
    if (e.target === $("wheelwrap")) $("wheelwrap").classList.remove("on");
  });

  // ---- feed ------------------------------------------------------------------

  $("a-feed").addEventListener("click", function () {
    var fav = favourites();
    var items = FOODS.map(function (f) {
      return {
        ico: f.ico, name: f.name, data: f,
        // Two correct guesses and he stops being subtle about it.
        heart: f.id === fav.food && (S.favHits[f.id] || 0) >= 2
      };
    });
    openWheel("What's for dinner?", items, false, function (food) {
      var ap = appetite();
      var isFav = food.id === fav.food;
      var gain = (ap === 2 ? 6 : ap === 1 ? 3 : 1) + (isFav ? 3 : 0);
      S.drops += gain;
      S.fedAt = Date.now();
      if (isFav) S.favHits[food.id] = (S.favHits[food.id] || 0) + 1;
      var banked = markCare("fed");

      if (isFav) {
        var firstTime = !S.favSeen.food;
        S.favSeen.food = true;
        if (firstTime) {
          journal("You worked out that he loves " + food.name.toLowerCase() + ".");
          showCard(food.ico, "Oh — he *loves* " + food.name.toLowerCase() + ".",
            "you'll want to remember that");
        }
        react(trait().feedFav, "wiggle");
        melody([523, 659, 880], 90);
      } else if (ap === 2) {
        react("He ate it in one go.", "happy");
        blip(660, 0.2, "sine");
      } else if (ap === 1) {
        react("He's happy with that.", "happy");
        blip(587, 0.18, "sine");
      } else {
        react("He nibbles politely. Not really hungry.", null);
        blip(392, 0.16, "sine");
      }
      // Let the reaction above be read first — this is a second beat, not a
      // replacement for it.
      if (banked) setTimeout(function () { react("That's a good day.", null); }, 2800);
      save();
      paintReadouts();
      checkEvolution();
    });
  });

  // ---- play / tuck --------------------------------------------------------------

  $("a-play").addEventListener("click", function () {
    if (asleep()) return doTuck();
    var fav = favourites();
    var items = PLAYS.map(function (p) {
      return {
        ico: p.ico, name: p.name, data: p,
        heart: p.id === fav.play && (S.favHits[p.id] || 0) >= 2
      };
    });
    openWheel("What shall we do?", items, false, function (p) {
      var isFav = p.id === fav.play;
      var gain = (isFav ? 5 : 2) + (trait().id === "silly" ? 2 : 0);
      S.drops += gain;
      S.lastPlayAt = Date.now();
      if (isFav) S.favHits[p.id] = (S.favHits[p.id] || 0) + 1;
      var banked = markCare("played");

      if (isFav) {
        var firstTime = !S.favSeen.play;
        S.favSeen.play = true;
        if (firstTime) {
          journal(p.name + " turns out to be his favourite thing in the world.");
          showCard(p.ico, p.name + " is his favourite thing in the world.",
            "you found it out yourself");
        }
        react(trait().play, "wiggle");
        melody([659, 784, 988], 90);
      } else {
        react("That was fun.", "happy");
        blip(587, 0.18, "sine");
      }
      // Let the reaction above be read first — this is a second beat, not a
      // replacement for it.
      if (banked) setTimeout(function () { react("That's a good day.", null); }, 2800);
      save();
      paintReadouts();
      checkEvolution();
    });
  });

  function doTuck() {
    if (S.tuckNight === nightKey()) return;
    S.tuckNight = nightKey();
    var gain = trait().id === "gentle" ? 4 : 2;
    S.drops += gain;
    var banked = markCare("tucked");
    journal("You tucked him in.");
    save();
    blip(392, 0.4, "sine", 0.08);
    setTimeout(function () { blip(330, 0.5, "sine", 0.07); }, 300);
    showCard("🛌", "He doesn't wake up. He shifts a bit, and settles.",
      "+" + gain + " 💧" + (banked ? " · day banked" : ""));
    paintReadouts();
    checkEvolution();
  }

  // ---- dive ------------------------------------------------------------------

  function tierUnlocked(t) {
    return stage() >= t.stage && S.dives >= t.dives;
  }

  function tierBlockReason(t) {
    if (stage() < t.stage) return "needs " + STAGES[t.stage].name;
    if (S.dives < t.dives) return "needs " + t.dives + " dives (" + S.dives + ")";
    if (appetite() > t.app) return t.app === 0 ? "he must be fed first" : "he's too hungry";
    return null;
  }

  function diveMs(t) {
    return trait().id === "bold" ? Math.round(t.ms * 0.85) : t.ms;
  }

  $("a-dive").addEventListener("click", function () {
    if (S.dive) {
      if (diveLeft() > 0) return;
      return surface();
    }
    var items = TIERS.map(function (t) {
      var reason = tierBlockReason(t);
      var name = t.name.charAt(0).toUpperCase() + t.name.slice(1);
      return {
        ico: reason && !tierUnlocked(t) ? "🔒" : "🌊",
        name: name,
        sub: reason ? reason : "down for " + fmtDur(diveMs(t)),
        disabled: !!reason,
        data: t
      };
    });
    openWheel("How deep?", items, true, function (t) {
      S.dive = { startAt: Date.now(), ms: diveMs(t), tier: t.id };
      S.dives += 1;
      save();
      blip(330, 0.35, "sine");
      react(S.name + " went under.", null);
      lastSpriteKey = "";
      paintSprite();
      paintReadouts();
    });
  });

  function surface() {
    var d = S.dive;
    var t = byId(TIERS, d.tier);
    var rnd = Arcade.seededRandom("dive:" + d.startAt + ":" + S.born);
    var pool = FINDS.filter(function (f) { return f.tier === t.id; });
    var find = pickWeighted(pool, rnd);

    // A dream that pointed at this depth re-rolls and keeps the rarer result.
    if (S.boostDay === Arcade.dailySeed() && S.boostTier === t.id) {
      var alt = pickWeighted(pool, rnd);
      if (alt.w < find.w) find = alt;
    }

    S.dive = null;
    award(find, t, "dive");
    lastSpriteKey = "";
    paintSprite();
  }

  // Shared by dives and lines. Duplicates still pay, at a third rate, so a
  // tier never becomes worthless once you've cleared it.
  function award(find, tier, how, bonus) {
    var isNew = S.found.indexOf(find.id) === -1;
    if (isNew) S.found.push(find.id);
    var gain = isNew ? find.drops : Math.max(1, Math.floor(find.drops / 3));
    if (trait().id === "greedy") gain += 1;
    S.drops += gain;
    gain += bonus || 0;   // a line folds its own haul into the one card
    markCare(how === "dive" ? "dived" : "fished");

    var gift = null;
    if (isNew && S.tierFirsts.indexOf(tier.id) === -1) {
      S.tierFirsts.push(tier.id);
      gift = giveKeepsake();
    }
    if (isNew) journal("Found a " + find.name.toLowerCase() + " in " + tier.name + ".");

    save();
    blip(330, 0.3, "sine");
    setTimeout(function () { blip(523, 0.25, "triangle"); }, 260);

    showCard(find.ico,
      how === "dive"
        ? S.name + " came up out of " + tier.name + " with a " + find.name.toLowerCase() + "."
        : "The line pulled tight. A " + find.name.toLowerCase() + ", up from " + tier.name + ".",
      (isNew ? "NEW! " : "") + "+" + gain + " 💧");

    if (gift) showCard(gift.ico, "He wants you to have " + gift.name + ".", gift.note);
    react("Splash!", "happy");
    paintReadouts();
    checkEvolution();
  }

  // ---- cast ------------------------------------------------------------------

  $("a-cast").addEventListener("click", function () {
    if (S.line) {
      if (lineLeft() > 0) return;
      return reel();
    }
    var items = LINES.map(function (l) {
      return {
        ico: "🎣", name: l.label, sub: l.sub + " · " + l.drops + " 💧",
        data: l
      };
    });
    openWheel("How long a line?", items, true, function (l) {
      S.line = { castAt: Date.now(), ms: l.ms, kind: l.id };
      save();
      blip(440, 0.2, "sine");
      react("Line's in the water.", null);
      paintReadouts();
    });
  });

  function reel() {
    var def = byId(LINES, S.line.kind) || LINES[0];
    var rnd = Arcade.seededRandom("line:" + S.line.castAt + ":" + S.born);
    var gain = def.drops + (trait().id === "greedy" ? 1 : 0);
    S.drops += gain;
    var gotFind = rnd() < def.find;
    S.line = null;
    markCare("fished");
    save();

    if (!gotFind) {
      melody([523, 784], 110);
      showCard("💧", "A good haul off the line. Nothing living, mind.", "+" + gain + " 💧");
      paintReadouts();
      checkEvolution();
      return;
    }

    // Shallow-weighted tier draw across everything currently unlocked.
    var open = TIERS.filter(tierUnlocked);
    var weighted = open.map(function (t, i) { return { t: t, w: LINE_TIER_W[i] }; });
    var tier = pickWeighted(weighted, rnd).t;
    var pool = FINDS.filter(function (f) { return f.tier === tier.id; });
    melody([523, 784], 110);
    award(pickWeighted(pool, rnd), tier, "line", gain);
  }

  // ---- pond sheet --------------------------------------------------------------

  function paintSheet() {
    var st = STAGES[stage()];
    var tr = trait();

    $("whoname").textContent = S.name;
    $("whosub").textContent = st.name + " · day " + ageDays() + " · " + S.careDays + " care-days · " + mood();
    $("whotrait").innerHTML = "";
    if (S.careDays >= 3) {
      var b = document.createElement("b");
      b.textContent = tr.name + ". ";
      $("whotrait").appendChild(b);
      $("whotrait").appendChild(document.createTextNode(tr.desc));
    } else {
      $("whotrait").textContent = "You're still working out who he is.";
    }

    $("todayline").textContent = careLine();

    var fav = favourites();
    var likes = [];
    likes.push(S.favSeen.food
      ? "Food: " + byId(FOODS, fav.food).name.toLowerCase()
      : "Food: you haven't found it yet.");
    likes.push(S.favSeen.play
      ? "Games: " + byId(PLAYS, fav.play).name.toLowerCase()
      : "Games: you haven't found it yet.");
    $("likesline").textContent = likes.join(" · ");

    // Keepsakes
    $("keephint").textContent = S.keepsakes.length
      ? S.keepsakes.length + " of " + KEEPSAKES.length + " — things he gave you. They're not for spending."
      : "Nothing yet. He'll get round to it.";
    var kl = $("keeplist");
    kl.innerHTML = "";
    S.keepsakes.slice().reverse().forEach(function (rec) {
      var k = byId(KEEPSAKES, rec.id);
      if (!k) return;
      var row = document.createElement("div");
      row.className = "keep-row";
      var ico = document.createElement("span");
      ico.className = "ico";
      ico.textContent = k.ico;
      var txt = document.createElement("span");
      txt.className = "txt";
      txt.appendChild(document.createTextNode(k.name));
      var em = document.createElement("em");
      em.textContent = " — " + k.note;
      txt.appendChild(em);
      var when = document.createElement("span");
      when.className = "when";
      when.textContent = "given " + whenStr(rec.t);
      txt.appendChild(when);
      row.appendChild(ico);
      row.appendChild(txt);
      kl.appendChild(row);
    });

    // Collection
    var open = TIERS.filter(tierUnlocked);
    $("collhint").textContent = S.found.length + " of " + FINDS.length + " found · " +
      S.dives + " dives · open: " + open.map(function (t) { return t.name; }).join(", ");
    var grid = $("collgrid");
    grid.innerHTML = "";
    FINDS.forEach(function (f) {
      var slot = document.createElement("div");
      var has = S.found.indexOf(f.id) !== -1;
      slot.className = "slot" + (has ? "" : " empty");
      var top = document.createElement("div");
      top.textContent = has ? f.ico : "?";
      var lbl = document.createElement("div");
      lbl.className = "lbl";
      lbl.textContent = has ? f.name : "";
      slot.appendChild(top);
      slot.appendChild(lbl);
      grid.appendChild(slot);
    });

    // Shop
    $("dropline").textContent = "You have " + S.drops + " dew drops.";
    var shop = $("shoplist");
    shop.innerHTML = "";
    DECOR.forEach(function (d) {
      var owned = S.decor.indexOf(d.id) !== -1;
      var row = document.createElement("div");
      row.className = "shop-row";
      var ico = document.createElement("span");
      ico.className = "ico";
      ico.textContent = d.ico;
      var nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = d.name;
      var btn = document.createElement("button");
      btn.className = "buy" + (owned ? " owned" : "");
      btn.textContent = owned ? "in pond" : d.cost + " 💧";
      btn.disabled = owned || S.drops < d.cost;
      btn.addEventListener("click", function () {
        if (S.drops < d.cost || S.decor.indexOf(d.id) !== -1) return;
        S.drops -= d.cost;
        S.decor.push(d.id);
        journal("You put " + d.name.toLowerCase() + " in the pond.");
        save();
        blip(784, 0.22, "triangle");
        paintDecor();
        paintSheet();
        paintReadouts();
      });
      row.appendChild(ico);
      row.appendChild(nm);
      row.appendChild(btn);
      shop.appendChild(row);
    });

    // Journal
    $("jrnhint").textContent = S.journal.length ? "" : "Nothing worth writing down yet.";
    var jl = $("jrnlist");
    jl.innerHTML = "";
    S.journal.forEach(function (e) {
      var row = document.createElement("div");
      row.className = "jrn";
      var when = document.createElement("span");
      when.className = "when";
      when.textContent = whenStr(e.t);
      row.appendChild(when);
      row.appendChild(document.createTextNode(e.txt));
      jl.appendChild(row);
    });
  }

  $("a-pond").addEventListener("click", function () {
    paintSheet();
    $("sheetwrap").classList.add("on");
  });

  $("sheetclose").addEventListener("click", function () {
    $("sheetwrap").classList.remove("on");
  });

  // ---- mute --------------------------------------------------------------------

  function paintMute() {
    $("mute").innerHTML = S.muted ? "&#128263;" : "&#128266;";
  }

  $("mute").addEventListener("click", function () {
    S.muted = !S.muted;
    save();
    paintMute();
  });

  // ---- naming (first run) -------------------------------------------------------

  function askName(done) {
    $("naming").classList.add("on");
    $("namego").addEventListener("click", function go() {
      var v = ($("nameinput").value || "").trim().slice(0, 12);
      S.name = v || "Totodile";
      S.born = Date.now();
      S.fedAt = Date.now();
      // He hasn't slept a night here yet, so he has nothing to have dreamed.
      // Burn today's dream; the first one arrives tomorrow morning.
      S.dreamDay = Arcade.dailySeed();
      journal(S.name + " moved into the pond.");
      save();
      $("naming").classList.remove("on");
      $("namego").removeEventListener("click", go);
      done();
    });
  }

  // ---- main loop ------------------------------------------------------------------

  function tick() {
    var p = phase();
    if (p !== lastPhase) {
      lastPhase = p;
      paintScene();
      paintWeather();
    }
    paintSprite();
    paintReadouts();
  }

  // Run the whole "you just opened the pond" sequence. Called on boot AND on
  // return to a backgrounded tab — which is the most common way back in on a
  // phone, and which v1 never handled at all, so the core loop silently never
  // ran for anyone who didn't hard-reload.
  function openSequence() {
    if (S.redug) {
      S.redug = false;
      showCard("🌊", "The pond turned out to be deeper than anyone thought. " +
        "Everything he'd collected has settled back into the silt.",
        "the depths are worth exploring again");
    }
    doDrift();
    if (!asleep()) doDream();
    S.lastSeen = Date.now();
    save();
    checkEvolution();
  }

  function begin() {
    paintMute();
    lastPhase = phase();
    paintScene();
    paintWeather();
    paintDecor();
    lastSpriteKey = "";
    paintSprite();
    paintReadouts();

    if (asleep()) react("He's fast asleep.", null);

    openSequence();
    paintDecor();      // drift may have left a trace
    paintReadouts();

    setInterval(tick, 1000);

    document.addEventListener("visibilitychange", function () {
      if (document.hidden) {
        // Measure away-time from when you actually left, not the last open.
        S.lastSeen = Date.now();
        save();
      } else {
        // A quick tab flick isn't an absence. Only re-run the open sequence
        // once you've genuinely been away, or every glance costs a drift card.
        if (Date.now() - S.lastSeen >= 2 * MIN) {
          openSequence();
          paintDecor();
        } else {
          S.lastSeen = Date.now();
        }
        lastPhase = "";
        tick();
      }
    });
  }

  Arcade.backButton();
  Arcade.boot(function () {
    if (!S.born) {
      askName(begin);
    } else {
      begin();
    }
  });
})();
</script>
</body>
</html>
