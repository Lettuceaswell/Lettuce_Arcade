<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lettuce Arcade</title>
<meta name="theme-color" content="#083734">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icon-180-bg.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/shared/arcade.css">
<style>
  body {
    display: flex;
    justify-content: center;
    /* flex-start, not the default stretch: stretched, main was pinned to the
       viewport height and its content overflowed past its own bottom padding,
       which is why the last tile's edge hid under Safari's toolbar. */
    align-items: flex-start;
  }

  main {
    width: 100%;
    max-width: 500px;
    padding: 24px 16px calc(32px + var(--safe-bottom));
  }

  .lettuce {
    display: block;
    width: 56px;
    height: 56px;
    margin: 20px auto 0;
    padding: 4px;
    border: none;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
  }
  .lettuce img { display: block; width: 48px; height: 48px; }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0); }
    20% { transform: rotate(-14deg) scale(1.08); }
    40% { transform: rotate(12deg) scale(1.08); }
    60% { transform: rotate(-8deg); }
    80% { transform: rotate(6deg); }
  }
  .lettuce.wiggle img { animation: wiggle 600ms ease-in-out; }
  @media (prefers-reduced-motion: reduce) { .lettuce.wiggle img { animation: none; } }

  .header-icon {
    display: block;
    width: 180px;
    height: 180px;
    margin: 0 auto 12px;
    border-radius: 16px;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 24px;
    text-align: center;
  }

  .tile-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .tile {
    display: flex;
    align-items: center;
    gap: 16px;
    min-height: 88px;
    padding: 14px 18px;
    border-radius: 16px;
    background: var(--bg-elevated);
    color: var(--fg);
    text-decoration: none;
  }

  .tile:active {
    background: var(--accent-dim);
  }

  .tile-emoji {
    font-size: 2.5rem;
    line-height: 1;
    flex-shrink: 0;
  }

  .tile-icon {
    /* Sprite PNGs carry transparent padding, so they need a bigger box than
       the emoji to read at the same visual size. Negative margin keeps the
       row height and text alignment identical to the emoji tiles. */
    width: 108px;
    height: 108px;
    margin: -26px;
    flex-shrink: 0;
    object-fit: contain;
  }

  .tile-title {
    font-size: 1.3rem;
    font-weight: 700;
  }

  .tile-blurb {
    font-size: 1rem;
    color: var(--fg-dim);
    margin-top: 2px;
  }

  .empty, .error {
    text-align: center;
    color: var(--fg-dim);
    padding: 24px;
  }
</style>
</head>
<body>
<main>
  <img class="header-icon" src="/icon-180.png" alt="" width="180" height="180">
  <h1>Lettuce Arcade</h1>
  <ul class="tile-list" id="tile-list" aria-live="polite"></ul>
  <button class="lettuce" id="lettuce" aria-label="Lettuce"><img src="/lettuce-192.png" alt="" width="48" height="48"></button>
</main>
<script src="/shared/arcade.js"></script>
<script>
  (function () {
    var list = document.getElementById("tile-list");

    // The lettuce at the bottom does one thing: wiggles when tapped.
    var lettuce = document.getElementById("lettuce");
    lettuce.addEventListener("click", function () {
      lettuce.classList.remove("wiggle");
      void lettuce.offsetWidth; // restart the animation on rapid taps
      lettuce.classList.add("wiggle");
    });
    lettuce.addEventListener("animationend", function () { lettuce.classList.remove("wiggle"); });

    fetch("/games.json")
      .then(function (res) {
        if (!res.ok) throw new Error("failed to load games.json");
        return res.json();
      })
      .then(function (games) {
        if (!Array.isArray(games) || games.length === 0) {
          list.innerHTML = '<li class="empty">No games yet.</li>';
          return;
        }
        games.forEach(function (game) {
          var li = document.createElement("li");
          var a = document.createElement("a");
          a.className = "tile";
          a.href = "/games/" + encodeURIComponent(game.slug) + "/";

          // A game may supply `icon` (a file inside its own folder) instead of
          // an emoji. `emoji` stays the fallback for everything else.
          var emoji;
          if (game.icon) {
            emoji = document.createElement("img");
            emoji.className = "tile-icon";
            emoji.src = "/games/" + encodeURIComponent(game.slug) + "/" + encodeURIComponent(game.icon);
            emoji.alt = "";
            emoji.width = 56;
            emoji.height = 56;
            emoji.loading = "lazy";
          } else {
            emoji = document.createElement("div");
            emoji.className = "tile-emoji";
            emoji.textContent = game.emoji || "🎮";
          }
          emoji.setAttribute("aria-hidden", "true");

          var text = document.createElement("div");
          var title = document.createElement("div");
          title.className = "tile-title";
          title.textContent = game.title || game.slug;
          var blurb = document.createElement("div");
          blurb.className = "tile-blurb";
          blurb.textContent = game.blurb || "";
          text.appendChild(title);
          text.appendChild(blurb);

          a.appendChild(emoji);
          a.appendChild(text);
          li.appendChild(a);
          list.appendChild(li);
        });
      })
      .catch(function () {
        list.innerHTML = '<li class="error">Could not load the game list.</li>';
      });
  })();
</script>
</body>
</html>
