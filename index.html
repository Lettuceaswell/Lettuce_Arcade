<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lettuce Arcade</title>
<meta name="theme-color" content="#083734">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icon-180-bg.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/shared/arcade.css">
<style>
  body {
    display: flex;
    justify-content: center;
    /* flex-start, not the default stretch: stretched, main was pinned to the
       viewport height and its content overflowed past its own bottom padding,
       which is why the last tile's edge hid under Safari's toolbar. */
    align-items: flex-start;
  }

  main {
    width: 100%;
    max-width: 500px;
    padding: 24px 16px calc(32px + var(--safe-bottom));
  }

  .lettuce {
    display: block;
    width: 56px;
    height: 56px;
    margin: 20px auto 0;
    padding: 4px;
    border: none;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
  }
  .lettuce img { display: block; width: 48px; height: 48px; pointer-events: none; }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0); }
    20% { transform: rotate(-14deg) scale(1.08); }
    40% { transform: rotate(12deg) scale(1.08); }
    60% { transform: rotate(-8deg); }
    80% { transform: rotate(6deg); }
  }
  .lettuce.wiggle img { animation: wiggle 600ms ease-in-out; }

  .header-icon {
    display: block;
    width: 180px;
    height: 180px;
    margin: 0 auto 12px;
    border-radius: 16px;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 12px;
    text-align: center;
  }

  /* One button that cycles the sort order: the whole row is the tap target,
     so a thumb can't miss it. */
  .sort-row {
    display: flex;
    justify-content: center;
    margin-bottom: 16px;
  }
  .sort-btn {
    background: transparent;
    border: 2px solid var(--accent-dim);
    color: var(--fg-dim);
    font-size: 1rem;
    font-weight: 600;
    padding: 10px 18px;
  }
  .sort-btn:active {
    background: var(--accent-dim);
    color: var(--fg);
  }
  .sort-btn .sort-label {
    color: var(--fg);
    margin-left: 0.4em;
  }

  .tile-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .tile {
    display: flex;
    align-items: center;
    gap: 16px;
    min-height: 88px;
    padding: 14px 18px;
    border-radius: 16px;
    background: var(--bg-elevated);
    color: var(--fg);
    text-decoration: none;
  }

  .tile:active {
    background: var(--accent-dim);
  }

  .tile-emoji {
    font-size: 2.5rem;
    line-height: 1;
    flex-shrink: 0;
  }

  .tile-icon {
    /* Sprite PNGs carry transparent padding, so they need a bigger box than
       the emoji to read at the same visual size. Negative margin keeps the
       row height and text alignment identical to the emoji tiles. */
    width: 108px;
    height: 108px;
    margin: -26px;
    flex-shrink: 0;
    object-fit: contain;
  }

  .tile-title {
    font-size: 1.3rem;
    font-weight: 700;
  }

  /* A never-played game gets an inviting tag beside its title, so under
     "Most played" a zero reads as "try me", not as the loser at the bottom. */
  .tag-new {
    display: inline-block;
    vertical-align: 0.15em;
    margin-left: 8px;
    padding: 2px 9px;
    border-radius: 999px;
    background: #ffd54a;
    color: #4a3300;
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .tile-blurb {
    font-size: 1rem;
    color: var(--fg-dim);
    margin-top: 2px;
  }

  /* The trophy shelf: each game's own one-line brag, then the play count. */
  .tile-plays {
    font-size: 0.85rem;
    color: var(--fg-dim);
    opacity: 0.85;
    margin-top: 4px;
  }
  .tile-plays .brag {
    color: #ffd54a;
    font-weight: 700;
    opacity: 1;
  }
  .tile-plays .sep { opacity: 0.5; margin: 0 5px; }

  /* The 📊 in the corner: lifetime stats for that game, without opening it.
     It sits on the <li>, not inside the link, so a tap on it never counts
     as a tap on the tile. The tile leaves it room on the right. */
  .tile-list li { position: relative; }
  .tile.has-stats { padding-right: 56px; }
  .tile-stats {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 44px;
    height: 44px;
    min-height: 44px;
    padding: 0;
    border-radius: 12px;
    background: transparent;
    font-size: 1.2rem;
    line-height: 1;
    opacity: 0.8;
  }
  .tile-stats:active { background: rgba(0, 0, 0, 0.25); }

  /* Beta games: unfinished, playable by anyone, tucked behind one quiet
     button in the bottom-left corner, below the lettuce, so it reads as a
     footnote rather than an invitation. */
  .beta-row {
    display: flex;
    justify-content: flex-start;
    margin-top: 28px;
  }
  .beta-btn {
    background: transparent;
    border: 2px dashed var(--accent-dim);
    color: var(--fg-dim);
    font-size: 0.85rem;
    font-weight: 600;
    padding: 10px 14px;
    opacity: 0.7;
  }
  .beta-btn:active {
    background: var(--accent-dim);
    color: var(--fg);
  }
  .beta-section {
    margin-top: 16px;
  }
  .beta-note {
    text-align: center;
    color: var(--fg-dim);
    font-size: 0.9rem;
    margin-bottom: 12px;
  }
  .tile.beta {
    border: 2px dashed var(--accent-dim);
    background: transparent;
  }
  .tag-beta {
    background: var(--accent-dim);
    color: var(--fg);
  }

  .empty, .error {
    text-align: center;
    color: var(--fg-dim);
    padding: 24px;
  }
</style>
</head>
<body>
<main>
  <img class="header-icon" src="/icon-180.png" alt="" width="180" height="180">
  <h1>Lettuce Arcade</h1>
  <div class="sort-row">
    <button class="btn sort-btn" id="sort-btn" type="button" aria-live="polite"><span>Sort:</span><span class="sort-label"></span></button>
  </div>
  <ul class="tile-list" id="tile-list" aria-live="polite"></ul>
  <button class="lettuce" id="lettuce" aria-label="Lettuce"><img src="/lettuce-192.png" alt="" width="48" height="48"></button>
  <div class="beta-row" id="beta-row" hidden>
    <button class="btn beta-btn" id="beta-btn" type="button" aria-expanded="false" aria-controls="beta-section">Betas</button>
  </div>
  <section class="beta-section" id="beta-section" hidden>
    <p class="beta-note">These games are broken. Don’t play. I can’t stop you.</p>
    <ul class="tile-list" id="beta-list"></ul>
  </section>
</main>
<script src="/shared/arcade.js"></script>
<script>
  (function () {
    var list = document.getElementById("tile-list");

    // The lettuce at the bottom does one thing: wiggles when tapped.
    var lettuce = document.getElementById("lettuce");
    lettuce.addEventListener("click", function () {
      lettuce.classList.remove("wiggle");
      void lettuce.offsetWidth; // restart the animation on rapid taps
      lettuce.classList.add("wiggle");
    });
    lettuce.addEventListener("animationend", function () { lettuce.classList.remove("wiggle"); });

    // ---- sorting ----
    //
    // games.json order is the hand-picked default. Every comparator breaks
    // ties on that order (index `i`), so the list never jitters between
    // visits and old Safari's unstable sort can't reshuffle equal entries.
    var SORTS = [
      { id: "default", label: "Default", cmp: function (a, b) { return a.i - b.i; } },
      { id: "title", label: "A to Z", cmp: function (a, b) {
        return (a.title || "").localeCompare(b.title || "") || a.i - b.i;
      } },
      { id: "most", label: "Most played", cmp: function (a, b) { return b.plays - a.plays || a.i - b.i; } },
      { id: "least", label: "Least played", cmp: function (a, b) { return a.plays - b.plays || a.i - b.i; } }
    ];

    var sortBtn = document.getElementById("sort-btn");
    var sortLabel = sortBtn.querySelector(".sort-label");
    var sortIndex = 0;
    var savedSort = Arcade.load("sort", "default");
    SORTS.forEach(function (s, i) { if (s.id === savedSort) sortIndex = i; });

    var games = [];
    var betaGames = [];

    function playsText(n) {
      return n === 1 ? "1 play" : n + " plays";
    }

    function render() {
      var sort = SORTS[sortIndex];
      sortLabel.textContent = sort.label;

      var counts = Arcade.playCounts();
      var rows = games.map(function (game, i) {
        return { game: game, i: i, title: game.title || game.slug, plays: counts[game.slug] || 0 };
      });
      rows.sort(sort.cmp);

      list.innerHTML = "";
      if (rows.length === 0) list.innerHTML = '<li class="empty">No games yet.</li>';
      rows.forEach(function (row) { list.appendChild(tile(row, false)); });
    }

    // Beta tiles keep games.json order, never sort, and never show a play
    // count: Arcade.boot skips the tally for any slug the index flagged as
    // beta, so a game graduates to the main list still wearing "New!".
    function renderBeta() {
      betaList.innerHTML = "";
      betaGames.forEach(function (game, i) {
        betaList.appendChild(tile({ game: game, i: i, title: game.title || game.slug, plays: 0 }, true));
      });
    }

    function tile(row, isBeta) {
      var game = row.game;
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.className = isBeta ? "tile beta" : "tile";
      a.href = "/games/" + encodeURIComponent(game.slug) + "/";

      // A game may supply `icon` (a file inside its own folder) instead of
      // an emoji. `emoji` stays the fallback for everything else.
      var emoji;
      if (game.icon) {
        emoji = document.createElement("img");
        emoji.className = "tile-icon";
        emoji.src = "/games/" + encodeURIComponent(game.slug) + "/" + encodeURIComponent(game.icon);
        emoji.alt = "";
        emoji.width = 56;
        emoji.height = 56;
        emoji.loading = "lazy";
      } else {
        emoji = document.createElement("div");
        emoji.className = "tile-emoji";
        emoji.textContent = game.emoji || "🎮";
      }
      emoji.setAttribute("aria-hidden", "true");

      var text = document.createElement("div");
      var title = document.createElement("div");
      title.className = "tile-title";
      title.textContent = row.title;
      var tag = document.createElement("span");
      if (isBeta) {
        tag.className = "tag-new tag-beta";
        tag.textContent = "Beta";
        title.appendChild(tag);
      } else if (row.plays === 0) {
        tag.className = "tag-new";
        tag.textContent = "New!";
        title.appendChild(tag);
      }
      var blurb = document.createElement("div");
      blurb.className = "tile-blurb";
      blurb.textContent = game.blurb || "";
      text.appendChild(title);
      text.appendChild(blurb);
      var brag = Arcade.bragFor(game.slug);
      if (row.plays > 0 || brag) {
        var plays = document.createElement("div");
        plays.className = "tile-plays";
        if (brag) {
          var b = document.createElement("span");
          b.className = "brag";
          b.textContent = brag;
          plays.appendChild(b);
        }
        if (row.plays > 0) {
          if (brag) {
            var sep = document.createElement("span");
            sep.className = "sep";
            sep.textContent = "·";
            plays.appendChild(sep);
          }
          plays.appendChild(document.createTextNode(playsText(row.plays)));
        }
        text.appendChild(plays);
      }

      a.appendChild(emoji);
      a.appendChild(text);
      li.appendChild(a);

      var stats = Arcade.statsFor(game.slug);
      if (stats) {
        a.classList.add("has-stats");
        var sb = document.createElement("button");
        sb.type = "button";
        sb.className = "btn tile-stats";
        sb.textContent = "📊";
        sb.setAttribute("aria-label", game.title + " stats");
        sb.addEventListener("click", function (e) {
          e.preventDefault();
          Arcade.statsSheet(game.title, stats);
        });
        li.appendChild(sb);
      }
      return li;
    }

    sortBtn.addEventListener("click", function () {
      sortIndex = (sortIndex + 1) % SORTS.length;
      Arcade.save("sort", SORTS[sortIndex].id);
      render();
    });

    // ---- beta games ----
    //
    // The toggle remembers its state, so a playtest loop (play, back, play
    // again) doesn't cost a tap each time.
    var betaRow = document.getElementById("beta-row");
    var betaBtn = document.getElementById("beta-btn");
    var betaSection = document.getElementById("beta-section");
    var betaList = document.getElementById("beta-list");
    var betaOpen = Arcade.load("beta-open", false) === true;

    function updateBeta() {
      betaRow.hidden = betaGames.length === 0;
      betaSection.hidden = !betaOpen || betaGames.length === 0;
      betaBtn.setAttribute("aria-expanded", betaOpen ? "true" : "false");
      betaBtn.textContent = betaOpen ? "Hide betas" : "Betas";
    }

    betaBtn.addEventListener("click", function () {
      betaOpen = !betaOpen;
      Arcade.save("beta-open", betaOpen);
      updateBeta();
    });

    fetch("/games.json")
      .then(function (res) {
        if (!res.ok) throw new Error("failed to load games.json");
        return res.json();
      })
      .then(function (loaded) {
        if (!Array.isArray(loaded) || loaded.length === 0) {
          list.innerHTML = '<li class="empty">No games yet.</li>';
          return;
        }
        games = loaded.filter(function (g) { return !g.beta; });
        betaGames = loaded.filter(function (g) { return g.beta === true; });
        Arcade.setBetaSlugs(betaGames.map(function (g) { return g.slug; }));
        render();
        renderBeta();
        updateBeta();
      })
      .catch(function () {
        list.innerHTML = '<li class="error">Could not load the game list.</li>';
      });
  })();
</script>
</body>
</html>
